<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test MapLibre + TrackAsia</title>
    <!-- 1. Nhúng CSS của MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

    <!-- 2. Phần tử chứa bản đồ -->
    <div id="map"></div>

    <!-- 3. Nhúng thư viện JavaScript của MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@^4.0.0/dist/maplibre-gl.js"></script>

    <script>
        // === CẤU HÌNH KẾT NỐI ===
        // API Key bạn đã cung cấp
        const TRACKASIA_API_KEY = '1792297789c0cf0ddb16e5446d7364580f';
        
        // URL Style của TrackAsia (sử dụng phong cách 'streets')
        // Đây là endpoint chính thức từ tài liệu của TrackAsia
        const TRACKASIA_STYLE_URL = `https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_API_KEY}`;

        // === KHỞI TẠO BẢN ĐỒ ===
        // MapLibre sẽ tải file JSON style từ TrackAsia và render các lớp bản đồ
        const map = new maplibregl.Map({
            container: 'map', // ID của div chứa bản đồ
            style: TRACKASIA_STYLE_URL, // URL style từ TrackAsia
            center: [105.85, 21.03], // Tọa độ trung tâm (Hà Nội)
            zoom: 10 // Mức độ thu phóng ban đầu
        });

        // Thêm các control cơ bản (zoom, compass) để dễ tương tác
        map.addControl(new maplibregl.NavigationControl());

        // (Tùy chọn) Log ra console khi bản đồ tải xong
        map.on('load', () => {
            console.log('Bản đồ đã tải thành công với style từ TrackAsia!');
        });
    </script>

</body>
</html>
