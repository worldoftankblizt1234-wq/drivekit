<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Realtime Traffic (Orbis) - MapLibre</title>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- vConsole -->
    <script src="https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
        window.vConsole = new window.VConsole();
    </script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 1;
            background: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 12px 16px; border-radius: 8px;
            font-family: system-ui, sans-serif; font-size: 14px;
            display: flex; flex-direction: column; gap: 10px;
            min-width: 260px; backdrop-filter: blur(6px);
        }
        .btn-test {
            background: #2BC82B; color: #000; border: none;
            padding: 8px 12px; border-radius: 4px; font-weight: bold;
            cursor: pointer; text-align: center; text-decoration: none;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <strong>🗺️ Test TomTom API Key Mới</strong>
    
    <label>
        <input type="checkbox" id="toggleTraffic" checked />
        Hiển thị TomTom Traffic (Orbis)
    </label>
    
    <!-- Link test trực tiếp với Key mới -->
    <a href="https://api.tomtom.com/maps/orbis/traffic/flow/raster/tile/13/6504/3606?apiVersion=2&key=tG84Z1Yh4rauGWjz6pRn98rrWymLjTru&style=light" 
       target="_blank" class="btn-test">
       🔗 Test Key Trực Tiếp
    </a>

    <div style="font-size: 12px; color: #aaa;">
        Bấm nút trên. Nếu ra ảnh bản đồ => Key OK.
    </div>
</div>

<script>
    const log = (...args) => console.log('[Traffic]', ...args);

    // ==========================================
    // CẬP NHẬT KEY MỚI TẠI ĐÂY
    // ==========================================
    const TOMTOM_API_KEY = 'tG84Z1Yh4rauGWjz6pRn98rrWymLjTru'; 
    const TRACKASIA_API_KEY = '1792297789c0cf0ddb16e5446d7364580f';

    const map = new maplibregl.Map({
        container: 'map',
        style: `https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_API_KEY}`,
        center: [105.85, 21.02], 
        zoom: 12,
        pitch: 0,
        bearing: 0,
        maxPitch: 85
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    map.on('load', () => {
        log('Base map load xong ✅');

        // ==========================================
        // GẮN KEY VÀO CẢ URL VÀ HEADER (Bảo hiểm 2 lớp)
        // ==========================================
        map.addSource('tomtom-traffic', {
            type: 'raster',
            // 1. Key nằm trực tiếp trên URL
            tiles: [
                `https://api.tomtom.com/maps/orbis/traffic/flow/raster/tile/{z}/{x}/{y}?apiVersion=2&style=light&key=${TOMTOM_API_KEY}`
            ],
            tileSize: 256,
            // 2. Key gắn thêm vào Header cho chắc chắn
            transformRequest: (url, resourceType) => {
                if (url.includes('api.tomtom.com')) {
                    return {
                        url: url,
                        headers: {
                            'TomTom-Api-Key': TOMTOM_API_KEY
                        }
                    };
                }
                return { url: url };
            }
        });

        map.addLayer({
            id: 'tomtom-traffic-layer',
            type: 'raster',
            source: 'tomtom-traffic',
            paint: {
                'raster-opacity': 0.85,
                'raster-contrast': 0.2,
                'raster-saturation': 0.3
            }
        });

        log('Đã thêm layer Traffic với key mới.');
    });

    document.getElementById('toggleTraffic').addEventListener('change', (e) => {
        if (map.getLayer('tomtom-traffic-layer')) {
            map.setLayoutProperty(
                'tomtom-traffic-layer', 'visibility', 
                e.target.checked ? 'visible' : 'none'
            );
        }
    });

    map.on('error', (e) => {
        console.error('MapLibre error:', e.error);
    });
</script>

</body>
</html>
