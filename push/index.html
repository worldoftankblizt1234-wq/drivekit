<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Realtime Traffic - TrackAsia + TomTom + MapLibre</title>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- vConsole (debug panel) — load TRƯỚC khi app chạy -->
    <script src="https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
        // Khởi tạo vConsole NGAY (trước MapLibre) để bắt được mọi log
        window.vConsole = new window.VConsole({
            theme: 'dark',
            defaultPlugins: ['system', 'network', 'element', 'storage'],
            maxLogNumber: 1000
        });
    </script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            backdrop-filter: blur(6px);
        }

        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        #controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2BC82B;
        }

        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <strong>🗺️ Realtime Traffic</strong>
    <label>
        <input type="checkbox" id="toggleTraffic" checked />
        Hiển thị TomTom Traffic Flow
    </label>
    <div class="hint">
        Kéo chuột phải để xoay 360°<br />
        Ctrl + kéo chuột để nghiêng (pitch)
    </div>
</div>

<script>
    // ==============================
    // 0. HELPERS (log đẹp trong vConsole)
    // ==============================
    const log   = (...args) => console.log('[Traffic]', ...args);
    const warn  = (...args) => console.warn('[Traffic]', ...args);
    const error = (...args) => console.error('[Traffic]', ...args);

    log('Khởi động app, vConsole đã sẵn sàng ✨');

    // ==============================
    // 1. CẤU HÌNH API KEY
    // ==============================
    const TOMTOM_API_KEY = 'ab591bfc-9bfe-4644-b5e7-21ad3e9bc51c';
    const TRACKASIA_API_KEY = '1792297789c0cf0ddb16e5446d7364580f';

    // ==============================
    // 2. KHỞI TẠO MAPLIBRE
    // ==============================
    const map = new maplibregl.Map({
        container: 'map',
        style: `https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_API_KEY}`,
        center: [105.85, 21.02],
        zoom: 12,
        pitch: 0,
        bearing: 0,
        maxPitch: 85,
        attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl({
        showCompass: true,
        showZoom: true,
        visualizePitch: true
    }), 'top-right');

    // Log vị trí mỗi khi người dùng dừng di chuyển (hữu ích để debug trên mobile)
    map.on('moveend', () => {
        const c = map.getCenter();
        log(`Center: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} | zoom=${map.getZoom().toFixed(2)} | pitch=${map.getPitch().toFixed(0)} | bearing=${map.getBearing().toFixed(0)}`);
    });

    // ==============================
    // 3. THÊM LỚP TRAFFIC TỪ TOMTOM
    // ==============================
    map.on('load', () => {
        log('Base map TrackAsia đã load xong ✅');

        map.addSource('tomtom-traffic', {
            type: 'raster',
            tiles: [
                `https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${TOMTOM_API_KEY}`
            ],
            tileSize: 256,
            minzoom: 0,
            maxzoom: 22,
            attribution: '© TomTom Traffic'
        });

        map.addLayer({
            id: 'tomtom-traffic-layer',
            type: 'raster',
            source: 'tomtom-traffic',
            paint: {
                'raster-opacity': 0.85,
                'raster-contrast': 0.2,
                'raster-saturation': 0.3
            }
        });

        log('Layer TomTom Traffic đã được thêm vào map 🚦');
    });

    // Log khi tile traffic load xong (mỗi tile)
    map.on('data', (e) => {
        if (e.sourceId === 'tomtom-traffic' && e.tile) {
            log(`🛰️  Traffic tile loaded z=${e.tile.tileID.canonical.z} x=${e.tile.tileID.canonical.x} y=${e.tile.tileID.canonical.y}`);
        }
    });

    // ==============================
    // 4. TOGGLE BẬT/TẮT TRAFFIC
    // ==============================
    const toggleCheckbox = document.getElementById('toggleTraffic');

    toggleCheckbox.addEventListener('change', (e) => {
        const visibility = e.target.checked ? 'visible' : 'none';
        if (map.getLayer('tomtom-traffic-layer')) {
            map.setLayoutProperty('tomtom-traffic-layer', 'visibility', visibility);
            log(`Traffic layer → ${visibility}`);
        } else {
            warn('Layer tomtom-traffic-layer chưa tồn tại (map chưa load xong?)');
        }
    });

    // ==============================
    // 5. BẮT LỖI
    // ==============================
    map.on('error', (e) => {
        error('MapLibre error:', e.error?.message || e.error);
    });

    // Bắt lỗi tải style / tile bị 403 / 429 (hết quota TomTom)
    window.addEventListener('unhandledrejection', (ev) => {
        warn('Unhandled promise rejection:', ev.reason);
    });
</script>

</body>
</html>
