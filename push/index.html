<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Migrate Data: RTDB -> Firestore</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYxZYEnoxtzpUMaYfQXYWF3lojUX51R48",
  authDomain: "drivekit-c88ef.firebaseapp.com",
  databaseURL: "https://drivekit-c88ef-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "drivekit-c88ef",
  storageBucket: "drivekit-c88ef.firebasestorage.app",
  messagingSenderId: "1073887619343",
  appId: "1:1073887619343:web:d89a872968bc4ee871f67a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const firestore = getFirestore(app);

async function migrate() {
  console.log("Đang đăng nhập Admin...");
  // Sửa lại email/pass của bạn ở đây
  await signInWithEmailAndPassword(auth, 'anhminhadof123@gmail.com', 'MẬT_KHẨU_CỦA_BẠN');
  console.log("Đăng nhập thành công. Bắt đầu chuyển dữ liệu...");

  // 1. CHUYỂN TRẠM DỪNG NGHỈ
  console.log("--- Đang chuyển Trạm dừng nghỉ (communityPois) ---");
  const poisSnapshot = await get(ref(db, 'communityPois'));
  if (poisSnapshot.exists()) {
    const pois = poisSnapshot.val();
    let count = 0;
    for (const key in pois) {
      const poi = pois[key];
      if (poi.tag === 'rest_stop') {
        await addDoc(collection(firestore, "rest_stops"), {
          lat: poi.lat,
          lng: poi.lng,
          name: poi.name,
          tag: 'rest_stop',
          uid: poi.uid || 'admin',
          authorName: poi.authorName || 'Admin',
          timestamp: poi.timestamp || Date.now(),
          upvotes: poi.upvotes || 0
        });
        count++;
      }
    }
    console.log(`✅ Đã chuyển ${count} trạm dừng nghỉ sang Firestore.`);
  } else {
    console.log("Không có dữ liệu trạm dừng nghỉ trên RTDB.");
  }

  // 2. CHUYỂN VÙNG CẤM
  console.log("--- Đang chuyển Vùng cấm (avoid_zones) ---");
  const zonesSnapshot = await get(ref(db, 'avoid_zones'));
  if (zonesSnapshot.exists()) {
    const zones = zonesSnapshot.val();
    let count = 0;
    for (const key in zones) {
      const zone = zones[key];
      await addDoc(collection(firestore, "avoid_zones"), {
        name: zone.name,
        lat1: zone.lat1,
        lng1: zone.lng1,
        lat2: zone.lat2,
        lng2: zone.lng2,
        timestamp: zone.timestamp || Date.now()
      });
      count++;
    }
    console.log(`✅ Đã chuyển ${count} vùng cấm sang Firestore.`);
  } else {
    console.log("Không có dữ liệu vùng cấm trên RTDB.");
  }

  // 3. DỌN DẸP RTDB (Tuỳ chọn)
  if (confirm("Bạn có muốn XOÁ dữ liệu cũ trên RTDB để dọn dẹp không?")) {
    await remove(ref(db, 'communityPois'));
    await remove(ref(db, 'avoid_zones'));
    console.log("🧹 Đã dọn dẹp dữ liệu cũ trên RTDB.");
  }

  console.log("🎉 QUÁ TRÌNH CHUYỂN ĐỔI HOÀN TẤT!");
}

// Chạy
migrate().catch(console.error);
</script>
</head>
<body style="background:#0f172a; color:white; font-family:sans-serif; padding:20px;">
  <h2>Đang chuyển dữ liệu từ RTDB sang Firestore...</h2>
  <p>Vui lòng mở <b>F12 (Console)</b> để xem tiến trình chi tiết.</p>
</body>
</html>
