<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Realtime Traffic - TrackAsia + TomTom + MapLibre</title>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* Panel điều khiển */
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            backdrop-filter: blur(6px);
        }

        #controls label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        #controls input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2BC82B;
        }

        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
    <strong>🗺️ Realtime Traffic</strong>
    <label>
        <input type="checkbox" id="toggleTraffic" checked />
        Hiển thị TomTom Traffic Flow
    </label>
    <div class="hint">
        Kéo chuột phải để xoay 360°<br />
        Ctrl + kéo chuột để nghiêng (pitch)
    </div>
</div>

<script>
    // ==============================
    // 1. CẤU HÌNH API KEY
    // ==============================
    const TOMTOM_API_KEY = 'ab591bfc-9bfe-4644-b5e7-21ad3e9bc51c';
    const TRACKASIA_API_KEY = '1792297789c0cf0ddb16e5446d7364580f';

    // ==============================
    // 2. KHỞI TẠO MAPLIBRE
    // ==============================
    const map = new maplibregl.Map({
        container: 'map',
        // Sử dụng style vector của TrackAsia làm base map
        style: `https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_API_KEY}`,
        center: [105.85, 21.02], // Hà Nội
        zoom: 12,
        pitch: 0,                // Nghiêng ban đầu (0 = nhìn từ trên xuống)
        bearing: 0,              // Hướng xoay ban đầu
        maxPitch: 85,            // Cho phép nghiêng tối đa 85°
        attributionControl: true
    });

    // Thêm control điều hướng (zoom, xoay, nghiêng)
    map.addControl(new maplibregl.NavigationControl({
        showCompass: true,
        showZoom: true,
        visualizePitch: true
    }), 'top-right');

    // ==============================
    // 3. THÊM LỚP TRAFFIC TỪ TOMTOM
    // ==============================
    map.on('load', () => {
        // 3.1 Thêm source raster tile từ TomTom Traffic Flow
        map.addSource('tomtom-traffic', {
            type: 'raster',
            tiles: [
                `https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${TOMTOM_API_KEY}`
            ],
            tileSize: 256,
            minzoom: 0,
            maxzoom: 22,
            attribution: '© TomTom Traffic'
        });

        // 3.2 Thêm layer hiển thị traffic
        map.addLayer({
            id: 'tomtom-traffic-layer',
            type: 'raster',
            source: 'tomtom-traffic',
            paint: {
                'raster-opacity': 0.85,
                // Đảm bảo traffic nổi bật trên nền bản đồ
                'raster-contrast': 0.2,
                'raster-saturation': 0.3
            }
        });

        // Đảm bảo layer traffic luôn nằm trên cùng (nếu cần)
        // map.moveLayer('tomtom-traffic-layer');
    });

    // ==============================
    // 4. TOGGLE BẬT/TẮT TRAFFIC
    // ==============================
    const toggleCheckbox = document.getElementById('toggleTraffic');

    toggleCheckbox.addEventListener('change', (e) => {
        const visibility = e.target.checked ? 'visible' : 'none';
        if (map.getLayer('tomtom-traffic-layer')) {
            map.setLayoutProperty('tomtom-traffic-layer', 'visibility', visibility);
        }
    });

    // ==============================
    // 5. XỬ LÝ LỖI (tùy chọn)
    // ==============================
    map.on('error', (e) => {
        console.warn('MapLibre error:', e.error);
    });

</script>

</body>
</html>
