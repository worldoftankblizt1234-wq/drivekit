<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackAsia Real-time Traffic Map</title>
    
    <!-- Nhập thư viện CSS & JS của TrackAsia GL -->
    <link href="https://jsdelivr.net" rel="stylesheet" />
    <script src="https://jsdelivr.net"></script>

    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1;
            max-width: 320px;
        }
        h3 { margin-top: 0; color: #333; }
        .btn-route {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-route:hover { background-color: #0056b3; }
        #result { margin-top: 10px; font-size: 14px; color: #555; line-height: 1.4; }
    </style>
</head>
<body>

<div class="info-panel">
    <h3>Giao thông Thời gian thực</h3>
    <p style="font-size: 13px; color: #666;">Bản đồ đang hiển thị lớp dữ liệu kẹt xe (Traffic Style Layer). Nhấn nút dưới để demo tìm đường tối ưu tránh kẹt xe.</p>
    <button class="btn-route" onclick="calculateTrafficRoute()">Tìm đường tránh kẹt xe</button>
    <div id="result"></div>
</div>

<div id="map"></div>

<script>
    // THAY THẾ BẰNG API KEY CỦA BẠN ĐĂNG KÝ TRÊN TRACK-ASIA.COM
    const TRACKASIA_KEY = '1792297789c0cf0ddb16e5446d7364580f'; 

    // 1. KHỞI TẠO BẢN ĐỒ VÀ NẠP LAYER TRAFFIC (Dải màu kẹt xe xanh/vàng/đỏ)
    const map = new trackasiagl.Map({
        container: 'map',
        // Gọi Style URL chứa dữ liệu traffic theo thời gian thực của TrackAsia
        style: `https://track-asia.com{TRACKASIA_KEY}`,
        center: [106.660172, 10.762622], // Tọa độ mặc định (Ví dụ: TP. Hồ Chí Minh)
        zoom: 13
    });

    // Thêm bộ điều hướng Zoom In/Out
    map.addControl(new trackasiagl.NavigationControl(), 'top-right');

    // Tọa độ Demo điểm đi và điểm đến (Định dạng: Kinh độ, Vĩ độ)
    const origin = [106.660172, 10.762622];      // Điểm A
    const destination = [106.695327, 10.774911]; // Điểm B

    // Thêm Marker đánh dấu Điểm Đi & Điểm Đến trên bản đồ
    new trackasiagl.Marker({ color: 'green' }).setLngLat(origin).addTo(map);
    new trackasiagl.Marker({ color: 'red' }).setLngLat(destination).addTo(map);

    // 2. HÀM GỌI ENDPOINT ROUTING ĐỂ TÌM ĐƯỜNG TỐI ƯU THEO LƯU LƯỢNG THỰC TẾ
    function calculateTrafficRoute() {
        document.getElementById('result').innerText = "Thống kê lộ trình...";

        // Endpoint OSRM thông minh tích hợp dữ liệu Traffic từ TrackAsia
        // Định dạng chuỗi tọa độ truyền vào: lng,lat;lng,lat
        const routingUrl = `https://track-asia.com{origin[0]},${origin[1]};${destination[0]},${destination[1]}.json?geometries=geojson&steps=true&overview=full&new_admin=true&key=${TRACKASIA_KEY}`;

        fetch(routingUrl)
            .then(response => response.json())
            .then(data => {
                if (!data.routes || data.routes.length === 0) {
                    document.getElementById('result').innerText = "Không tìm thấy lộ trình phù hợp.";
                    return;
                }

                const route = data.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(2);
                
                // Thời gian (duration) trả về đã được hệ thống tính toán dựa trên mức độ kẹt xe thời gian thực
                const durationMins = Math.round(route.duration / 60); 

                // Hiển thị thông tin lên panel
                document.getElementById('result').innerHTML = `
                    <strong>Khoảng cách:</strong> ${distanceKm} km <br>
                    <strong>Thời gian (Đã tính kẹt xe):</strong> ${durationMins} phút <br>
                    <span style="color: #28a745;">✓ Lộ trình đã né các điểm nghẽn nặng.</span>
                `;

                // 3. VẼ TUYẾN ĐƯỜNG LÊN BẢN ĐỒ
                const routeGeoJSON = route.geometry;

                // Nếu Layer cũ đã tồn tại thì xóa trước khi vẽ tuyến mới
                if (map.getSource('route')) {
                    map.removeLayer('route');
                    map.removeSource('route');
                }

                // Nạp dữ liệu tuyến đường đi dưới dạng GeoJSON
                map.addSource('route', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'properties': {},
                        'geometry': routeGeoJSON
                    }
                });

                // Cấu hình hiển thị đường vẽ (màu sắc, độ rộng) lên bản đồ
                map.addLayer({
                    'id': 'route',
                    'type': 'line',
                    'source': 'route',
                    'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': '#4a90e2',
                        'line-width': 6,
                        'line-opacity': 0.8
                    }
                });

                // Tự động căn chỉnh bản đồ ôm trọn tuyến đường vừa tìm được
                const coordinates = routeGeoJSON.coordinates;
                const bounds = coordinates.reduce((bounds, coord) => {
                    return bounds.extend(coord);
                }, new trackasiagl.LngLatBounds(coordinates[0], coordinates[0]));
                
                map.fitBounds(bounds, { padding: 50 });
            })
            .catch(error => {
                console.error('Lỗi kết nối API:', error);
                document.getElementById('result').innerText = "Có lỗi xảy ra khi tải dữ liệu giao thông.";
            });
    }
</script>

</body>
</html>
