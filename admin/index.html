<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>DriveKit Admin — Quản trị hệ thống</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f172a; --bg-2: #1e293b; --card: #1e293b; --border: #334155;
    --text: #f1f5f9; --text-muted: #94a3b8; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
  
  .sidebar { width: 420px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 4px 0 15px rgba(0,0,0,0.2); overflow-y: auto; }
  .header { padding: 20px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 1.2rem; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
  
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 15px; text-align: center; font-weight: 700; font-size: 0.9rem; cursor: pointer; color: var(--text-muted); background: var(--bg-2); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .tab:hover { background: var(--border); }
  .tab.active { color: var(--primary); background: var(--card); border-bottom: 3px solid var(--primary); }
  .tab-content { display: none; padding: 20px; flex: 1; overflow-y: auto; flex-direction: column; gap: 16px; }
  .tab-content.active { display: flex; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
  .form-control { width: 100%; padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; transition: border 0.2s; }
  .form-control:focus { border-color: var(--primary); outline: none; }
  
  .btn { padding: 14px; border-radius: 8px; font-weight: 800; font-size: 0.95rem; cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; gap: 8px; transition: opacity 0.2s; }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); }
  .btn-outline.active { border-color: var(--warning); color: var(--warning); background: rgba(245, 158, 11, 0.1); }
  .btn:disabled { background: #475569; cursor: not-allowed; }
  
  .help-text { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; margin-top: 4px; }
  
  #map { flex: 1; background: #e5e5e5; z-index: 1; cursor: crosshair; }
  #map.no-draw { cursor: grab; }
  #map.freehand { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="%233b82f6" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>') 0 24, crosshair !important; }

  .status-box { padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; display: none; margin-top: 10px; text-align: center; white-space: pre-wrap; line-height: 1.4; }
  .status-success { background: rgba(16,185,129,0.15); border: 1px solid var(--success); color: var(--success); display: block; }
  .status-error { background: rgba(239,68,68,0.15); border: 1px solid var(--danger); color: var(--danger); display: block; }
  .status-loading { background: rgba(59,130,246,0.15); border: 1px solid var(--primary); color: var(--primary); display: block; }

  .custom-pin { border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.3); border: 2px solid white; }
  .custom-pin i { transform: rotate(45deg); color: white; font-size: 0.8rem; }
  .pin-rest-stop { background: var(--primary); }
  .pin-avoid-start { background: var(--warning); }
  .pin-avoid-end { background: var(--danger); }

  /* CHECKBOX CHIPS CHO LOẠI XE */
  .vehicle-checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .vehicle-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
  .vehicle-chip input { display: none; }
  .vehicle-chip:has(input:checked) { border-color: var(--primary); background: rgba(59,130,246,0.15); color: var(--primary); }
  .vehicle-chip i { font-size: 1rem; }

  .auth-screen { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .auth-box { background: var(--card); padding: 32px; border-radius: 16px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid var(--border); }
  .auth-box h2 { font-size: 1.4rem; margin-bottom: 8px; text-align: center; }
  .auth-box p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2><i class="fas fa-shield-alt" style="color:var(--primary);"></i> Admin Login</h2>
    <p>Đăng nhập bằng tài khoản Firebase</p>
    <div class="form-group" style="margin-bottom: 12px;">
      <input type="email" id="authEmail" class="form-control" placeholder="Email..." />
    </div>
    <div class="form-group" style="margin-bottom: 16px;">
      <input type="password" id="authPassword" class="form-control" placeholder="Mật khẩu..." />
    </div>
    <div id="authError" class="status-box status-error"></div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()" style="width: 100%;">
      <i class="fas fa-sign-in-alt"></i> Đăng nhập
    </button>
  </div>
</div>

<div class="sidebar">
  <div class="header">
    <h1><i class="fas fa-shield-alt" style="color: var(--primary);"></i> DriveKit Admin</h1>
    <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Dữ liệu lưu vào Firestore & RTDB</p>
  </div>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('tab-reststop')" id="tab-btn-reststop">
      <i class="fas fa-bed"></i> Trạm dừng nghỉ
    </div>
    <div class="tab" onclick="switchTab('tab-avoid')" id="tab-btn-avoid">
      <i class="fas fa-ban"></i> Tuyến đường cấm
    </div>
  </div>

  <div class="tab-content active" id="tab-reststop">
    <div class="form-group">
      <label>Dán link Google Maps</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="poiGmapsUrl" class="form-control" placeholder="https://maps.app.goo.gl/...">
        <button class="btn btn-primary" id="btnResolvePoi" onclick="resolveRestStopUrl()" style="padding: 0 16px;"><i class="fas fa-search-location"></i></button>
      </div>
    </div>

    <div class="form-group">
      <label>Tên Trạm dừng nghỉ</label>
      <input type="text" id="poiName" class="form-control" placeholder="VD: Trạm dừng nghỉ Hải Vân">
    </div>

    <div class="form-group">
      <label>Tọa độ (Vĩ độ / Kinh độ)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="poiLat" class="form-control" placeholder="Vĩ độ (Lat)" oninput="updateRestStopMapFromInputs()">
        <input type="text" id="poiLng" class="form-control" placeholder="Kinh độ (Lng)" oninput="updateRestStopMapFromInputs()">
      </div>
      <div class="help-text">Hoặc <b>click lên bản đồ</b> để lấy tọa độ.</div>
    </div>

    <button class="btn btn-success" id="btnSaveRestStop" onclick="submitRestStop()">
      <i class="fas fa-cloud-upload-alt"></i> Lưu Trạm Dừng Nghỉ
    </button>
    <div id="statusRestStop" class="status-box"></div>
  </div>

  <div class="tab-content" id="tab-avoid">
    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
      <button class="btn btn-outline" id="btnToggleDraw" onclick="toggleDrawMode()" style="flex:1;">
        <i class="fas fa-pen"></i> Click 2 điểm
      </button>
      <button class="btn btn-outline" id="btnToggleFreehand" onclick="toggleFreehandMode()" style="flex:1;">
        <i class="fas fa-paint-brush"></i> Vẽ tự do
      </button>
    </div>

    <div class="form-group">
      <label>Tên đoạn cấm / Vùng cấm</label>
      <input type="text" id="zoneName" class="form-control" placeholder="VD: Cấm tải đường Nguyễn Trãi">
    </div>

    <!-- THỜI GIAN CẤM (KHÔNG BẮT BUỘC) -->
    <div class="form-group" style="background: rgba(16,185,129,0.1); padding: 12px; border-radius: 8px; border: 1px dashed var(--success);">
      <label style="color: var(--success);"><i class="fas fa-clock"></i> Thời gian cấm (Không bắt buộc)</label>
      <div style="display: flex; gap: 8px; margin-top: 6px;">
        <div style="flex:1;">
          <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:4px;">Từ lúc:</div>
          <input type="datetime-local" id="zoneStartTime" class="form-control">
        </div>
        <div style="flex:1;">
          <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:4px;">Đến lúc:</div>
          <input type="datetime-local" id="zoneEndTime" class="form-control">
        </div>
      </div>
    </div>

    <!-- LOẠI XE BỊ CẤM (KHÔNG BẮT BUỘC) -->
    <div class="form-group" style="background: rgba(239,68,68,0.1); padding: 12px; border-radius: 8px; border: 1px dashed var(--danger);">
      <label style="color: var(--danger);"><i class="fas fa-car-crash"></i> Loại xe bị cấm (Bỏ trống = Cấm tất cả)</label>
      <div class="vehicle-checkbox-group">
        <label class="vehicle-chip"><input type="checkbox" value="car" class="zone-vehicle"><i class="fas fa-car"></i> Ô tô</label>
        <label class="vehicle-chip"><input type="checkbox" value="motorcycle" class="zone-vehicle"><i class="fas fa-motorcycle"></i> Xe máy</label>
        <label class="vehicle-chip"><input type="checkbox" value="truck" class="zone-vehicle"><i class="fas fa-truck"></i> Xe tải</label>
        <label class="vehicle-chip"><input type="checkbox" value="hd" class="zone-vehicle"><i class="fas fa-motorcycle"></i> Xe CN</label>
        <label class="vehicle-chip"><input type="checkbox" value="bicycle" class="zone-vehicle"><i class="fas fa-bicycle"></i> Xe đạp</label>
        <label class="vehicle-chip"><input type="checkbox" value="walking" class="zone-vehicle"><i class="fas fa-walking"></i> Đi bộ</label>
      </div>
    </div>

    <div class="form-group">
      <label>Điểm đầu (Nếu dùng Click 2 điểm)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="zoneLat1" class="form-control" placeholder="Vĩ độ đầu" oninput="updateZoneMapFromInputs()">
        <input type="text" id="zoneLng1" class="form-control" placeholder="Kinh độ đầu" oninput="updateZoneMapFromInputs()">
      </div>
    </div>
    
    <div class="form-group">
      <label>Điểm cuối (Hoặc điểm chỉ hướng)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="zoneLat2" class="form-control" placeholder="Vĩ độ cuối" oninput="updateZoneMapFromInputs()">
        <input type="text" id="zoneLng2" class="form-control" placeholder="Kinh độ cuối" oninput="updateZoneMapFromInputs()">
      </div>
    </div>

    <button class="btn btn-danger" onclick="saveAvoidZone()" style="margin-top: 10px;">
      <i class="fas fa-save"></i> Lưu Tuyến Đường Cấm
    </button>
    <button class="btn btn-outline" onclick="resetZoneDrawing()" style="margin-top: 4px;">
      <i class="fas fa-undo"></i> Xóa nét vẽ hiện tại
    </button>
    <div id="statusAvoid" class="status-box"></div>
  </div>
</div>

<div id="map" class="no-draw"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYxZYEnoxtzpUMaYfQXYWF3lojUX51R48",
  authDomain: "drivekit-c88ef.firebaseapp.com",
  databaseURL: "https://drivekit-c88ef-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "drivekit-c88ef",
  storageBucket: "drivekit-c88ef.firebasestorage.app",
  messagingSenderId: "1073887619343",
  appId: "1:1073887619343:web:d89a872968bc4ee871f67a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

const GMAPS_WORKER_URL = 'https://gmaps-resolver.anhminhadof123.workers.dev';
const MAIN_WORKER_URL = 'https://map-birthday.anhminhadof123.workers.dev';

let currentUser = null;
let map = null;
let currentRestStopMarker = null;

let pointA = null;
let pointB = null;
let tempMarkerA = null;
let tempMarkerB = null;
let tempPolyline = null;
let isDrawMode = false;
let isFreehandMode = false;
let currentRouteWaypoints = null;
let zoneInputTimeout = null;

// Biến cho việc vẽ tự do (NỐI TIẾP & CẮT)
let isFreehandDrawing = false;
let freehandStrokes = []; // Mảng chứa các nét vẽ riêng biệt
let currentFreehandStroke = []; // Nét vẽ hiện tại đang vẽ dở
let freehandPolyline = null;
let startLatLng = null;

// Hàm cập nhật Version để Client biết có data mới
async function updateVersion(collectionName) {
  try {
    const metaRef = doc(db, "system_meta", "version");
    await setDoc(metaRef, { [collectionName]: Date.now() }, { merge: true });
  } catch(e) { console.warn("Lỗi cập nhật version:", e); }
}

window.doLogin = async function() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if (!email || !pass) return showStatus('authError', 'Nhập đủ email và mật khẩu!', 'error');

  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';
  document.getElementById('authError').style.display = 'none';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (error) {
    document.getElementById('authError').style.display = 'block';
    document.getElementById('authError').textContent = 'Lỗi: ' + (error.code || error.message);
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    if (!map) initMap();
  } else {
    currentUser = null;
    document.getElementById('authScreen').classList.remove('hidden');
  }
});

window.switchTab = function(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  document.getElementById('tab-btn-' + tabId.replace('tab-', '')).classList.add('active');
  document.getElementById(tabId).classList.add('active');

  if (tabId !== 'tab-avoid') {
    isDrawMode = false;
    isFreehandMode = false;
    document.getElementById('btnToggleDraw').classList.remove('active');
    document.getElementById('btnToggleFreehand').classList.remove('active');
    document.getElementById('map').className = 'no-draw';
    resetZoneDrawing();
  }
};

function updateMapCursorClass() {
  const mapEl = document.getElementById('map');
  mapEl.className = '';
  if (isFreehandMode) mapEl.classList.add('freehand');
  else if (isDrawMode) mapEl.classList.add('no-draw');
  else mapEl.classList.add('no-draw');
}

window.toggleDrawMode = function() {
  if (isFreehandMode) toggleFreehandMode();
  isDrawMode = !isDrawMode;
  const btn = document.getElementById('btnToggleDraw');
  
  if (isDrawMode) {
    btn.classList.add('active');
    btn.innerHTML = '<i class="fas fa-mouse-pointer"></i> Đang click 2 điểm...';
    resetZoneDrawing();
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<i class="fas fa-pen"></i> Click 2 điểm';
  }
  updateMapCursorClass();
};

window.toggleFreehandMode = function() {
  if (isDrawMode) toggleDrawMode();
  isFreehandMode = !isFreehandMode;
  const btn = document.getElementById('btnToggleFreehand');
  
  if (isFreehandMode) {
    btn.classList.add('active');
    btn.innerHTML = '<i class="fas fa-paint-brush"></i> Đang vẽ tự do...';
    resetZoneDrawing();
    showStatus('statusAvoid', '💡 Kéo để di chuyển map. Giữ Shift (PC) hoặc Nhấn giữ 0.5s (Mobile) để vẽ. Ấn phím C để cắt đoạn.', 'loading');
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<i class="fas fa-paint-brush"></i> Vẽ tự do';
    showStatus('statusAvoid', 'Đã tắt chế độ vẽ tự do', 'loading');
  }
  updateMapCursorClass();
};

window.resetZoneDrawing = function() {
  pointA = null; pointB = null;
  currentRouteWaypoints = null;
  freehandStrokes = [];
  currentFreehandStroke = [];
  
  if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
  if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
  if (tempPolyline) { map.removeLayer(tempPolyline); tempPolyline = null; }
  if (freehandPolyline) { map.removeLayer(freehandPolyline); freehandPolyline = null; }
  
  document.getElementById('zoneLat1').value = '';
  document.getElementById('zoneLng1').value = '';
  document.getElementById('zoneLat2').value = '';
  document.getElementById('zoneLng2').value = '';
  document.getElementById('zoneStartTime').value = '';
  document.getElementById('zoneEndTime').value = '';
  document.querySelectorAll('.zone-vehicle').forEach(cb => cb.checked = false);
};

window.updateZoneMapFromInputs = function() {
  const lat1Str = document.getElementById('zoneLat1').value.replace(/,/g, '.');
  const lng1Str = document.getElementById('zoneLng1').value.replace(/,/g, '.');
  const lat2Str = document.getElementById('zoneLat2').value.replace(/,/g, '.');
  const lng2Str = document.getElementById('zoneLng2').value.replace(/,/g, '.');

  const lat1 = parseFloat(lat1Str);
  const lng1 = parseFloat(lng1Str);
  const lat2 = parseFloat(lat2Str);
  const lng2 = parseFloat(lng2Str);

  if (!isNaN(lat1) && !isNaN(lng1) && lat1 >= -90 && lat1 <= 90 && lng1 >= -180 && lng1 <= 180) {
    pointA = L.latLng(lat1, lng1);
    if (tempMarkerA) map.removeLayer(tempMarkerA);
    tempMarkerA = L.marker(pointA, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-start" style="width: 30px; height: 30px;"><i class="fas fa-map-marker-alt"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm đầu");
    
    if (isNaN(lat2) || isNaN(lng2)) {
      map.flyTo([lat1, lng1], 15, { animate: true, duration: 1 });
    }
  } else {
    pointA = null;
    if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
  }

  if (!isNaN(lat2) && !isNaN(lng2) && lat2 >= -90 && lat2 <= 90 && lng2 >= -180 && lng2 <= 180) {
    pointB = L.latLng(lat2, lng2);
    if (tempMarkerB) map.removeLayer(tempMarkerB);
    tempMarkerB = L.marker(pointB, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-end" style="width: 30px; height: 30px;"><i class="fas fa-flag-checkered"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm cuối");
  } else {
    pointB = null;
    if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
  }

  if (pointA && pointB) {
    clearTimeout(window._zoneDrawTimer);
    window._zoneDrawTimer = setTimeout(async () => {
      if (tempPolyline) map.removeLayer(tempPolyline);
      showStatus('statusAvoid', 'Đang tìm đường...', 'loading');
      
      const snappedCoords = await fetchSnappedRoute(pointA.lat, pointA.lng, pointB.lat, pointB.lng);
      if (snappedCoords && snappedCoords.length > 0) {
        currentRouteWaypoints = snappedCoords;
        tempPolyline = L.polyline(snappedCoords, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
        showStatus('statusAvoid', '✅ Đã bám đường thành công!', 'success');
      } else {
        currentRouteWaypoints = [[pointA.lat, pointA.lng], [pointB.lat, pointB.lng]];
        tempPolyline = L.polyline(currentRouteWaypoints, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
        showStatus('statusAvoid', '⚠️ Không thể bám đường, vẽ đường chim bay!', 'error');
      }
      map.fitBounds([[lat1, lng1], [lat2, lng2]], { padding: [50, 50] });
    }, 800);
  }
};

window.updateRestStopMapFromInputs = function() {
  const latStr = document.getElementById('poiLat').value.replace(/,/g, '.');
  const lngStr = document.getElementById('poiLng').value.replace(/,/g, '.');
  
  const lat = parseFloat(latStr);
  const lng = parseFloat(lngStr);
  
  if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

  if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
  const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
  currentRestStopMarker = L.marker([lat, lng], { icon }).addTo(map);
  
  map.flyTo([lat, lng], 16, { animate: true, duration: 1 });
};

async function fetchSnappedRoute(lat1, lng1, lat2, lng2) {
  showStatus('statusAvoid', 'Đang tìm đường bám đường thực tế...', 'loading');
  try {
    const res = await fetch(`${MAIN_WORKER_URL}/trackasia-route?origin=${lat1},${lng1}&destination=${lat2},${lng2}&mode=driving`);
    const data = await res.json();
    if (data.routes && data.routes.length > 0) {
      let coords = [];
      if (data.routes[0].geometry && data.routes[0].geometry.coordinates) {
        const c0 = data.routes[0].geometry.coordinates[0];
        if (c0[0] > 90 || c0[1] > 90) coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        else coords = data.routes[0].geometry.coordinates.map(c => [c[0], c[1]]);
      }
      return coords;
    }
    return null;
  } catch (e) {
    return null;
  }
}

function initMap() {
  map = L.map('map', { center: [21.0285, 105.8542], zoom: 6 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  map.on('click', async (e) => {
    const activeTab = document.querySelector('.tab.active').id;
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    
    if (activeTab === 'tab-btn-reststop') {
      document.getElementById('poiLat').value = lat.toFixed(6);
      document.getElementById('poiLng').value = lng.toFixed(6);
      
      if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
      const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
      currentRestStopMarker = L.marker([lat, lng], { icon }).addTo(map);
    } 
    else if (activeTab === 'tab-btn-avoid' && isDrawMode) {
      if (!pointA || (pointA && pointB)) {
        if (pointA && pointB) resetZoneDrawing();
        
        pointA = L.latLng(lat, lng);
        document.getElementById('zoneLat1').value = lat.toFixed(6);
        document.getElementById('zoneLng1').value = lng.toFixed(6);
        
        if (tempMarkerA) map.removeLayer(tempMarkerA);
        tempMarkerA = L.marker(pointA, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-start" style="width: 30px; height: 30px;"><i class="fas fa-map-marker-alt"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm đầu").openPopup();
      } else {
        pointB = L.latLng(lat, lng);
        document.getElementById('zoneLat2').value = lat.toFixed(6);
        document.getElementById('zoneLng2').value = lng.toFixed(6);
        
        if (tempMarkerB) map.removeLayer(tempMarkerB);
        tempMarkerB = L.marker(pointB, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-end" style="width: 30px; height: 30px;"><i class="fas fa-flag-checkered"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm cuối").openPopup();

        if (tempPolyline) map.removeLayer(tempPolyline);
        const snappedCoords = await fetchSnappedRoute(pointA.lat, pointA.lng, pointB.lat, pointB.lng);
        if (snappedCoords && snappedCoords.length > 0) {
          currentRouteWaypoints = snappedCoords;
          tempPolyline = L.polyline(snappedCoords, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
          showStatus('statusAvoid', '✅ Đã bám đường thành công!', 'success');
        } else {
          currentRouteWaypoints = [[pointA.lat, pointA.lng], [pointB.lat, pointB.lng]];
          tempPolyline = L.polyline(currentRouteWaypoints, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
          showStatus('statusAvoid', '⚠️ Không thể bám đường, vẽ đường chim bay!', 'error');
        }
        map.fitBounds(tempPolyline.getBounds(), { padding: [50, 50] });
        toggleDrawMode();
      }
    }
  });

  // LOGIC VẼ TỰ DO NỐI TIẾP (CẮT BẰNG PHÍM C)
  function startFreehandDrawing(latlng) {
    isFreehandDrawing = true;
    map.dragging.disable();
    
    currentFreehandStroke = [latlng];
    freehandPolyline = L.polyline(currentFreehandStroke, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
  }

  function finishFreehandDrawing() {
    if (!isFreehandDrawing) return;
    isFreehandDrawing = false;
    map.dragging.enable();
    
    if (currentFreehandStroke.length > 1) {
      freehandStrokes.push([...currentFreehandStroke]);
      
      // Cập nhật mảng waypoints (dạng mảng của các mảng)
      currentRouteWaypoints = freehandStrokes.map(stroke => stroke.map(p => [p.lat, p.lng]));
      
      const firstPt = freehandStrokes[0][0];
      const lastStroke = freehandStrokes[freehandStrokes.length - 1];
      const lastPt = lastStroke[lastStroke.length - 1];
      
      document.getElementById('zoneLat1').value = firstPt.lat.toFixed(6);
      document.getElementById('zoneLng1').value = firstPt.lng.toFixed(6);
      document.getElementById('zoneLat2').value = lastPt.lat.toFixed(6);
      document.getElementById('zoneLng2').value = lastPt.lng.toFixed(6);
    }
    currentFreehandStroke = [];
    freehandPolyline = null;
  }

  // Sự kiện Chuột (PC)
  map.on('mousedown', (e) => {
    if (!isFreehandMode) return;
    startLatLng = e.latlng;
    
    if (e.originalEvent.shiftKey || e.originalEvent.altKey) {
      startFreehandDrawing(e.latlng);
      return;
    }
    
    window._longPressTimer = setTimeout(() => {
      if (startLatLng) startFreehandDrawing(startLatLng);
    }, 300);
  });

  map.on('mousemove', (e) => {
    if (!isFreehandMode) return;
    
    if (window._longPressTimer && !isFreehandDrawing) {
      if (startLatLng && startLatLng.distanceTo(e.latlng) > 10) {
        clearTimeout(window._longPressTimer);
        window._longPressTimer = null;
        startLatLng = null;
      }
    }
    
    if (isFreehandDrawing) {
      const lastPoint = currentFreehandStroke[currentFreehandStroke.length - 1];
      if (e.latlng.distanceTo(lastPoint) > 3) {
        currentFreehandStroke.push(e.latlng);
        freehandPolyline.setLatLngs(currentFreehandStroke);
      }
    }
  });

  map.on('mouseup', () => {
    if (!isFreehandMode) return;
    clearTimeout(window._longPressTimer);
    window._longPressTimer = null;
    startLatLng = null;
    if (isFreehandDrawing) finishFreehandDrawing();
  });

  // Sự kiện Cảm ứng (Mobile)
  map.on('touchstart', (e) => {
    if (!isFreehandMode) return;
    startLatLng = e.latlng;
    
    window._longPressTimer = setTimeout(() => {
      if (startLatLng) startFreehandDrawing(startLatLng);
    }, 300);
  });

  map.on('touchmove', (e) => {
    if (!isFreehandMode) return;
    
    if (window._longPressTimer && !isFreehandDrawing) {
      if (startLatLng && startLatLng.distanceTo(e.latlng) > 10) {
        clearTimeout(window._longPressTimer);
        window._longPressTimer = null;
        startLatLng = null;
      }
    }
    
    if (isFreehandDrawing) {
      const lastPoint = currentFreehandStroke[currentFreehandStroke.length - 1];
      if (e.latlng.distanceTo(lastPoint) > 3) {
        currentFreehandStroke.push(e.latlng);
        freehandPolyline.setLatLngs(currentFreehandStroke);
      }
    }
  });

  map.on('touchend', () => {
    if (!isFreehandMode) return;
    clearTimeout(window._longPressTimer);
    window._longPressTimer = null;
    startLatLng = null;
    if (isFreehandDrawing) finishFreehandDrawing();
  });
}

// Lắng nghe phím C để cắt
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c' && isFreehandMode) {
    if (isFreehandDrawing) {
      finishFreehandDrawing();
      showStatus('statusAvoid', '✂️ Đã cắt nét vẽ. Bạn có thể di chuyển bản đồ và vẽ đoạn mới.', 'success');
    }
  }
});

async function getCoordsFromGmapsUrl(url) {
  if (!url) return { success: false, error: 'Chưa dán link' };
  try {
    const res = await fetch(`${GMAPS_WORKER_URL}?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (data.success && data.coords) return { success: true, coords: data.coords, source: data.source };
    return { success: false, error: 'Link rút gọn bị Google chặn!' };
  } catch (e) {
    return { success: false, error: 'Lỗi kết nối tới Server: ' + e.message };
  }
}

window.resolveRestStopUrl = async function() {
  const url = document.getElementById('poiGmapsUrl').value.trim();
  if (!url) return showStatus('statusRestStop', 'Vui lòng dán link!', 'error');

  const btn = document.getElementById('btnResolvePoi');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  showStatus('statusRestStop', 'Đang giải mã link...', 'loading');
  
  const result = await getCoordsFromGmapsUrl(url);

  if (result.success) {
    const coords = result.coords;
    document.getElementById('poiLat').value = coords.lat.toFixed(6);
    document.getElementById('poiLng').value = coords.lng.toFixed(6);
    
    const latlng = [coords.lat, coords.lng];
    map.flyTo(latlng, 16, { animate: true, duration: 1.5 });
    
    if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
    const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
    currentRestStopMarker = L.marker(latlng, { icon }).addTo(map);

    showStatus('statusRestStop', `✅ Đã lấy được tọa độ!`, 'success');
  } else {
    showStatus('statusRestStop', '❌ ' + result.error, 'error');
  }
  
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-search-location"></i>';
};

window.submitRestStop = async function() {
  if (!currentUser) return showStatus('statusRestStop', 'Lỗi: Chưa đăng nhập Firebase!', 'error');

  const name = document.getElementById('poiName').value.trim();
  const lat = parseFloat(document.getElementById('poiLat').value.replace(/,/g, '.'));
  const lng = parseFloat(document.getElementById('poiLng').value.replace(/,/g, '.'));

  if (!name || isNaN(lat) || isNaN(lng)) return showStatus('statusRestStop', 'Vui lòng nhập đủ Tên và Tọa độ!', 'error');

  showStatus('statusRestStop', 'Đang lưu...', 'loading');
  const btn = document.getElementById('btnSaveRestStop');
  btn.disabled = true;

  try {
    const payload = {
      lat: lat, lng: lng, name: name, tag: 'rest_stop',
      uid: currentUser.uid, authorName: 'Admin', timestamp: Date.now(), upvotes: 0
    };
    
    // 1. Lưu vào Firestore
    const docRef = await addDoc(collection(db, "rest_stops"), payload);
    
    // 2. Lưu vào RTDB để Client realtime
    await set(ref(rtdb, `communityPois/${docRef.id}`), payload);
    
    // 3. Cập nhật Version
    await updateVersion('rest_stops');

    showStatus('statusRestStop', '✅ Đã lưu: ' + name, 'success');
    document.getElementById('poiName').value = '';
    document.getElementById('poiGmapsUrl').value = '';
    if (currentRestStopMarker) { map.removeLayer(currentRestStopMarker); currentRestStopMarker = null; }
  } catch (err) {
    showStatus('statusRestStop', 'Lỗi: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
};

window.saveAvoidZone = async function() {
  if (!currentUser) return showStatus('statusAvoid', 'Lỗi: Chưa đăng nhập Firebase!', 'error');
  
  const name = document.getElementById('zoneName').value.trim();
  const startTimeVal = document.getElementById('zoneStartTime').value;
  const endTimeVal = document.getElementById('zoneEndTime').value;

  if (!name) return showStatus('statusAvoid', 'Vui lòng nhập Tên đoạn cấm!', 'error');
  if (!currentRouteWaypoints || currentRouteWaypoints.length < 2) {
    return showStatus('statusAvoid', 'Vui lòng vẽ hoặc chọn tọa độ tuyến đường trước!', 'error');
  }

  const checkedVehicles = document.querySelectorAll('.zone-vehicle:checked');
  const bannedVehicles = Array.from(checkedVehicles).map(cb => cb.value);

  // Xử lý lấy điểm đầu/cuối cho MultiLineString hoặc LineString
  let firstPoint, lastPoint;
  if (Array.isArray(currentRouteWaypoints[0][0])) {
    const firstLine = currentRouteWaypoints[0];
    const lastLine = currentRouteWaypoints[currentRouteWaypoints.length - 1];
    firstPoint = firstLine[0];
    lastPoint = lastLine[lastLine.length - 1];
  } else {
    firstPoint = currentRouteWaypoints[0];
    lastPoint = currentRouteWaypoints[currentRouteWaypoints.length - 1];
  }

  let startTime = null;
  let endTime = null;
  if (startTimeVal) startTime = new Date(startTimeVal).getTime();
  if (endTimeVal) endTime = new Date(endTimeVal).getTime();

  showStatus('statusAvoid', 'Đang lưu...', 'loading');
  try {
    const payload = {
      name: name,
      lat1: firstPoint[0],
      lng1: firstPoint[1],
      lat2: lastPoint[0],
      lng2: lastPoint[1],
      waypoints: JSON.stringify(currentRouteWaypoints),
      startTime: startTime,
      endTime: endTime,
      bannedVehicles: bannedVehicles,
      timestamp: Date.now()
    };

    // 1. Lưu vào Firestore
    const docRef = await addDoc(collection(db, "avoid_zones"), payload);

    // 2. Lưu vào RTDB
    await set(ref(rtdb, `avoid_zones/${docRef.id}`), payload);

    // 3. Cập nhật Version
    await updateVersion('avoid_zones');
    
    showStatus('statusAvoid', '✅ Đã lưu đoạn cấm thành công!', 'success');
    
    resetZoneDrawing();
    document.getElementById('zoneName').value = '';
  } catch (err) {
    showStatus('statusAvoid', 'Lỗi: ' + err.message, 'error');
  }
};

function showStatus(id, msg, type) {
  const box = document.getElementById(id);
  if (!box) return;
  box.textContent = msg;
  box.className = 'status-box status-' + type;
}
</script>
