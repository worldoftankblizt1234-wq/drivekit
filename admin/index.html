let currentUser = null;

async function updateVersion(collectionName) {
  try {
    const metaRef = doc(db, "system_meta", "version");
    await setDoc(metaRef, { [collectionName]: Date.now() }, { merge: true });
  } catch(e) { console.warn("Lỗi cập nhật version:", e); }
}

window.doLogin = async function() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  if (!email || !pass) return showStatus('authError', 'Nhập đủ email và mật khẩu!', 'error');

  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';
  document.getElementById('authError').style.display = 'none';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (error) {
    document.getElementById('authError').style.display = 'block';
    document.getElementById('authError').textContent = 'Lỗi: ' + (error.code || error.message);
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Đăng nhập';
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    if (!map) initMap();
  } else {
    currentUser = null;
    document.getElementById('authScreen').classList.remove('hidden');
  }
});

window.switchTab = function(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  document.getElementById('tab-btn-' + tabId.replace('tab-', '')).classList.add('active');
  document.getElementById(tabId).classList.add('active');

  if (tabId !== 'tab-avoid') {
    isDrawMode = false;
    isFreehandMode = false;
    document.getElementById('btnToggleDraw').classList.remove('active');
    document.getElementById('btnToggleFreehand').classList.remove('active');
    document.getElementById('map').className = 'no-draw';
    resetZoneDrawing();
  }
};

function updateMapCursorClass() {
  const mapEl = document.getElementById('map');
  mapEl.className = '';
  if (isFreehandMode) mapEl.classList.add('freehand');
  else if (isDrawMode) mapEl.classList.add('no-draw');
  else mapEl.classList.add('no-draw');
}

window.toggleDrawMode = function() {
  if (isFreehandMode) toggleFreehandMode();
  isDrawMode = !isDrawMode;
  const btn = document.getElementById('btnToggleDraw');
  
  if (isDrawMode) {
    btn.classList.add('active');
    btn.innerHTML = '<i class="fas fa-mouse-pointer"></i> Đang click 2 điểm...';
    resetZoneDrawing();
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<i class="fas fa-pen"></i> Click 2 điểm';
  }
  updateMapCursorClass();
};

window.toggleFreehandMode = function() {
  if (isDrawMode) toggleDrawMode();
  isFreehandMode = !isFreehandMode;
  const btn = document.getElementById('btnToggleFreehand');
  
  if (isFreehandMode) {
    btn.classList.add('active');
    btn.innerHTML = '<i class="fas fa-paint-brush"></i> Đang vẽ tự do...';
    resetZoneDrawing();
    showStatus('statusAvoid', '💡 Click 2 điểm để nối. Hoặc Giữ phím E + Kéo chuột để vẽ (Mobile: Nhấn giữ 0.5s). Ấn C để cắt đoạn.', 'loading');
  } else {
    btn.classList.remove('active');
    btn.innerHTML = '<i class="fas fa-paint-brush"></i> Vẽ tự do';
    showStatus('statusAvoid', 'Đã tắt chế độ vẽ tự do', 'loading');
  }
  updateMapCursorClass();
};

window.resetZoneDrawing = function() {
  pointA = null; pointB = null;
  currentRouteWaypoints = null;
  
  if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
  if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
  if (tempPolyline) { tempPolyline.clearLayers(); }
  if (activeFreehandPolyline) { map.removeLayer(activeFreehandPolyline); activeFreehandPolyline = null; }
  
  document.getElementById('zoneLat1').value = '';
  document.getElementById('zoneLng1').value = '';
  document.getElementById('zoneLat2').value = '';
  document.getElementById('zoneLng2').value = '';
  document.getElementById('zoneStartTime').value = '';
  document.getElementById('zoneEndTime').value = '';
  document.querySelectorAll('.zone-vehicle').forEach(cb => cb.checked = false);
};

function updateDrawnPolylines() {
  if (!tempPolyline) return;
  tempPolyline.clearLayers();
  if (!currentRouteWaypoints) return;
  
  const isMulti = Array.isArray(currentRouteWaypoints[0][0]);
  if (isMulti) {
    currentRouteWaypoints.forEach(seg => {
      if (seg && seg.length > 0) {
        L.polyline(seg, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(tempPolyline);
      }
    });
  } else {
    if (currentRouteWaypoints.length > 0) {
      L.polyline(currentRouteWaypoints, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(tempPolyline);
    }
  }
}

window.updateZoneMapFromInputs = function() {
  const lat1Str = document.getElementById('zoneLat1').value.replace(/,/g, '.');
  const lng1Str = document.getElementById('zoneLng1').value.replace(/,/g, '.');
  const lat2Str = document.getElementById('zoneLat2').value.replace(/,/g, '.');
  const lng2Str = document.getElementById('zoneLng2').value.replace(/,/g, '.');

  const lat1 = parseFloat(lat1Str);
  const lng1 = parseFloat(lng1Str);
  const lat2 = parseFloat(lat2Str);
  const lng2 = parseFloat(lng2Str);

  if (!isNaN(lat1) && !isNaN(lng1) && lat1 >= -90 && lat1 <= 90 && lng1 >= -180 && lng1 <= 180) {
    pointA = L.latLng(lat1, lng1);
    if (tempMarkerA) map.removeLayer(tempMarkerA);
    tempMarkerA = L.marker(pointA, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-start" style="width: 30px; height: 30px;"><i class="fas fa-map-marker-alt"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm đầu");
    
    if (isNaN(lat2) || isNaN(lng2)) {
      map.flyTo([lat1, lng1], 15, { animate: true, duration: 1 });
    }
  } else {
    pointA = null;
    if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
  }

  if (!isNaN(lat2) && !isNaN(lng2) && lat2 >= -90 && lat2 <= 90 && lng2 >= -180 && lng2 <= 180) {
    pointB = L.latLng(lat2, lng2);
    if (tempMarkerB) map.removeLayer(tempMarkerB);
    tempMarkerB = L.marker(pointB, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-end" style="width: 30px; height: 30px;"><i class="fas fa-flag-checkered"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm cuối");
  } else {
    pointB = null;
    if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
  }

  if (pointA && pointB) {
    clearTimeout(window._zoneDrawTimer);
    window._zoneDrawTimer = setTimeout(async () => {
      showStatus('statusAvoid', 'Đang tìm đường...', 'loading');
      
      const snappedCoords = await fetchSnappedRoute(pointA.lat, pointA.lng, pointB.lat, pointB.lng);
      
      let newSegment = [];
      if (snappedCoords && snappedCoords.length > 0) {
        newSegment = snappedCoords;
        showStatus('statusAvoid', '✅ Đã bám đường thành công!', 'success');
      } else {
        newSegment = [[pointA.lat, pointA.lng], [pointB.lat, pointB.lng]];
        showStatus('statusAvoid', '⚠️ Không thể bám đường, vẽ đường chim bay!', 'error');
      }

      if (!currentRouteWaypoints) currentRouteWaypoints = [];
      if (currentRouteWaypoints.length > 0 && !Array.isArray(currentRouteWaypoints[0][0])) {
        currentRouteWaypoints = [currentRouteWaypoints];
      }
      currentRouteWaypoints.push(newSegment);
      
      updateDrawnPolylines();
      map.fitBounds(tempPolyline.getBounds(), { padding: [50, 50] });
      
      pointA = null; pointB = null;
      if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
      if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
      document.getElementById('zoneLat1').value = '';
      document.getElementById('zoneLng1').value = '';
      document.getElementById('zoneLat2').value = '';
      document.getElementById('zoneLng2').value = '';
    }, 800);
  }
};

window.updateRestStopMapFromInputs = function() {
  const latStr = document.getElementById('poiLat').value.replace(/,/g, '.');
  const lngStr = document.getElementById('poiLng').value.replace(/,/g, '.');
  
  const lat = parseFloat(latStr);
  const lng = parseFloat(lngStr);
  
  if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

  if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
  const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
  currentRestStopMarker = L.marker([lat, lng], { icon }).addTo(map);
  
  map.flyTo([lat, lng], 16, { animate: true, duration: 1 });
};

async function fetchSnappedRoute(lat1, lng1, lat2, lng2) {
  showStatus('statusAvoid', 'Đang tìm đường bám đường thực tế...', 'loading');
  try {
    const res = await fetch(`${MAIN_WORKER_URL}/trackasia-route?origin=${lat1},${lng1}&destination=${lat2},${lng2}&mode=driving`);
    const data = await res.json();
    if (data.routes && data.routes.length > 0) {
      let coords = [];
      if (data.routes[0].geometry && data.routes[0].geometry.coordinates) {
        const c0 = data.routes[0].geometry.coordinates[0];
        if (c0[0] > 90 || c0[1] > 90) coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        else coords = data.routes[0].geometry.coordinates.map(c => [c[0], c[1]]);
      }
      return coords;
    }
    return null;
  } catch (e) {
    return null;
  }
}

function initMap() {
  map = L.map('map', { center: [21.0285, 105.8542], zoom: 6 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap', maxZoom: 19
  }).addTo(map);

  tempPolyline = L.featureGroup().addTo(map);

  map.on('click', async (e) => {
    if (isFreehandDrawing) return; // Ngăn click khi đang vẽ nét
    
    const activeTab = document.querySelector('.tab.active').id;
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    
    if (activeTab === 'tab-btn-reststop') {
      document.getElementById('poiLat').value = lat.toFixed(6);
      document.getElementById('poiLng').value = lng.toFixed(6);
      
      if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
      const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
      currentRestStopMarker = L.marker([lat, lng], { icon }).addTo(map);
    } 
    // ĐÃ CẬP NHẬT: Cho phép click 2 điểm cả trong chế độ isDrawMode VÀ isFreehandMode (khi không giữ phím E)
    else if (activeTab === 'tab-btn-avoid' && (isDrawMode || (isFreehandMode && !isKeyEDown))) {
      if (!pointA) {
        pointA = L.latLng(lat, lng);
        document.getElementById('zoneLat1').value = lat.toFixed(6);
        document.getElementById('zoneLng1').value = lng.toFixed(6);
        
        if (tempMarkerA) map.removeLayer(tempMarkerA);
        tempMarkerA = L.marker(pointA, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-start" style="width: 30px; height: 30px;"><i class="fas fa-map-marker-alt"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm đầu").openPopup();
      } else {
        pointB = L.latLng(lat, lng);
        document.getElementById('zoneLat2').value = lat.toFixed(6);
        document.getElementById('zoneLng2').value = lng.toFixed(6);
        
        if (tempMarkerB) map.removeLayer(tempMarkerB);
        tempMarkerB = L.marker(pointB, { icon: L.divIcon({ html: '<div class="custom-pin pin-avoid-end" style="width: 30px; height: 30px;"><i class="fas fa-flag-checkered"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] }) }).addTo(map).bindPopup("Điểm cuối").openPopup();

        showStatus('statusAvoid', 'Đang tìm đường...', 'loading');
        const snappedCoords = await fetchSnappedRoute(pointA.lat, pointA.lng, pointB.lat, pointB.lng);
        
        let newSegment = [];
        if (snappedCoords && snappedCoords.length > 0) {
          newSegment = snappedCoords;
          showStatus('statusAvoid', '✅ Đã bám đường thành công!', 'success');
        } else {
          newSegment = [[pointA.lat, pointA.lng], [pointB.lat, pointB.lng]];
          showStatus('statusAvoid', '⚠️ Không thể bám đường, vẽ đường chim bay!', 'error');
        }

        if (!currentRouteWaypoints) currentRouteWaypoints = [];
        if (currentRouteWaypoints.length > 0 && !Array.isArray(currentRouteWaypoints[0][0])) {
          currentRouteWaypoints = [currentRouteWaypoints];
        }
        currentRouteWaypoints.push(newSegment);
        
        updateDrawnPolylines();
        map.fitBounds(tempPolyline.getBounds(), { padding: [50, 50] });

        pointA = null; pointB = null;
        if (tempMarkerA) { map.removeLayer(tempMarkerA); tempMarkerA = null; }
        if (tempMarkerB) { map.removeLayer(tempMarkerB); tempMarkerB = null; }
        document.getElementById('zoneLat1').value = '';
        document.getElementById('zoneLng1').value = '';
        document.getElementById('zoneLat2').value = '';
        document.getElementById('zoneLng2').value = '';
      }
    }
  });

  // --- LOGIC VẼ TỰ DO (CẬP NHẬT) ---
  function startFreehandDrawing(latlng) {
    isFreehandDrawing = true;
    map.dragging.disable();
    currentFreehandStroke = [latlng];
    activeFreehandPolyline = L.polyline(currentFreehandStroke, { color: '#ef4444', weight: 8, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
  }

  function finishFreehandDrawing() {
    if (!isFreehandDrawing) return;
    isFreehandDrawing = false;
    map.dragging.enable();
    
    if (activeFreehandPolyline) {
      map.removeLayer(activeFreehandPolyline);
      activeFreehandPolyline = null;
    }
    
    if (currentFreehandStroke.length > 1) {
      const strokeCoords = currentFreehandStroke.map(p => [p.lat, p.lng]);
      
      if (!currentRouteWaypoints) currentRouteWaypoints = [];
      if (currentRouteWaypoints.length > 0 && !Array.isArray(currentRouteWaypoints[0][0])) {
        currentRouteWaypoints = [currentRouteWaypoints];
      }
      currentRouteWaypoints.push(strokeCoords);
      
      updateDrawnPolylines();
      
      const firstPt = currentFreehandStroke[0];
      const lastPt = currentFreehandStroke[currentFreehandStroke.length - 1];
      document.getElementById('zoneLat1').value = firstPt.lat.toFixed(6);
      document.getElementById('zoneLng1').value = firstPt.lng.toFixed(6);
      document.getElementById('zoneLat2').value = lastPt.lat.toFixed(6);
      document.getElementById('zoneLng2').value = lastPt.lng.toFixed(6);
    }
    currentFreehandStroke = [];
  }

  // Sự kiện Chuột (PC) - ĐÃ SỬA: Chỉ vẽ khi giữ phím E
  map.on('mousedown', (e) => {
    if (!isFreehandMode) return;
    if (isKeyEDown) {
      startFreehandDrawing(e.latlng);
    }
  });

  map.on('mousemove', (e) => {
    if (!isFreehandMode) return;
    if (isFreehandDrawing && activeFreehandPolyline) {
      const lastPoint = currentFreehandStroke[currentFreehandStroke.length - 1];
      if (e.latlng.distanceTo(lastPoint) > 3) {
        currentFreehandStroke.push(e.latlng);
        activeFreehandPolyline.setLatLngs(currentFreehandStroke);
      }
    }
  });

  map.on('mouseup', () => {
    if (!isFreehandMode) return;
    if (isFreehandDrawing) finishFreehandDrawing();
  });

  // Sự kiện Cảm ứng (Mobile) - Giữ nguyên logic nhấn giữ 0.5s để vẽ
  map.on('touchstart', (e) => {
    if (!isFreehandMode) return;
    const startLatLng = e.latlng;
    
    window._longPressTimer = setTimeout(() => {
      if (startLatLng) startFreehandDrawing(startLatLng);
    }, 300);
  });

  map.on('touchmove', (e) => {
    if (!isFreehandMode) return;
    
    if (window._longPressTimer && !isFreehandDrawing) {
      // Nếu di chuyển ngón tay quá xa trước khi hết 0.5s, hủy vẽ (để cho phép vuốt bản đồ)
      const touch = e.touches[0];
      const touchPoint = L.latLng(touch.clientY, touch.clientX); 
      // Lưu ý: logic hủy này có thể hơi khó chuẩn xác 100%, nhưng giữ nguyên theo code cũ của bạn
      clearTimeout(window._longPressTimer);
      window._longPressTimer = null;
    }
    
    if (isFreehandDrawing && activeFreehandPolyline) {
      const lastPoint = currentFreehandStroke[currentFreehandStroke.length - 1];
      if (e.latlng.distanceTo(lastPoint) > 3) {
        currentFreehandStroke.push(e.latlng);
        activeFreehandPolyline.setLatLngs(currentFreehandStroke);
      }
    }
  });

  map.on('touchend', () => {
    if (!isFreehandMode) return;
    clearTimeout(window._longPressTimer);
    window._longPressTimer = null;
    if (isFreehandDrawing) finishFreehandDrawing();
  });
}

// ĐÃ CẬP NHẬT: Lắng nghe phím E (Bắt đầu vẽ) và phím C (Cắt nét vẽ)
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'e') isKeyEDown = true;
  
  if (e.key.toLowerCase() === 'c' && isFreehandMode) {
    if (isFreehandDrawing) {
      finishFreehandDrawing();
      showStatus('statusAvoid', '✂️ Đã cắt nét vẽ. Bạn có thể di chuyển bản đồ và vẽ đoạn mới.', 'success');
    }
  }
});

document.addEventListener('keyup', (e) => {
  if (e.key.toLowerCase() === 'e') {
    isKeyEDown = false;
    if (isFreehandDrawing) finishFreehandDrawing();
  }
});

async function getCoordsFromGmapsUrl(url) {
  if (!url) return { success: false, error: 'Chưa dán link' };
  try {
    const res = await fetch(`${GMAPS_WORKER_URL}?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (data.success && data.coords) return { success: true, coords: data.coords, source: data.source };
    return { success: false, error: 'Link rút gọn bị Google chặn!' };
  } catch (e) {
    return { success: false, error: 'Lỗi kết nối tới Server: ' + e.message };
  }
}

window.resolveRestStopUrl = async function() {
  const url = document.getElementById('poiGmapsUrl').value.trim();
  if (!url) return showStatus('statusRestStop', 'Vui lòng dán link!', 'error');

  const btn = document.getElementById('btnResolvePoi');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  showStatus('statusRestStop', 'Đang giải mã link...', 'loading');
  
  const result = await getCoordsFromGmapsUrl(url);

  if (result.success) {
    const coords = result.coords;
    document.getElementById('poiLat').value = coords.lat.toFixed(6);
    document.getElementById('poiLng').value = coords.lng.toFixed(6);
    
    const latlng = [coords.lat, coords.lng];
    map.flyTo(latlng, 16, { animate: true, duration: 1.5 });
    
    if (currentRestStopMarker) map.removeLayer(currentRestStopMarker);
    const icon = L.divIcon({ html: '<div class="custom-pin pin-rest-stop" style="width: 30px; height: 30px;"><i class="fas fa-bed"></i></div>', className: '', iconSize: [30, 30], iconAnchor: [15, 30] });
    currentRestStopMarker = L.marker(latlng, { icon }).addTo(map);

    showStatus('statusRestStop', `✅ Đã lấy được tọa độ!`, 'success');
  } else {
    showStatus('statusRestStop', '❌ ' + result.error, 'error');
  }
  
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-search-location"></i>';
};

window.submitRestStop = async function() {
  if (!currentUser) return showStatus('statusRestStop', 'Lỗi: Chưa đăng nhập Firebase!', 'error');

  const name = document.getElementById('poiName').value.trim();
  const lat = parseFloat(document.getElementById('poiLat').value.replace(/,/g, '.'));
  const lng = parseFloat(document.getElementById('poiLng').value.replace(/,/g, '.'));

  if (!name || isNaN(lat) || isNaN(lng)) return showStatus('statusRestStop', 'Vui lòng nhập đủ Tên và Tọa độ!', 'error');

  showStatus('statusRestStop', 'Đang lưu...', 'loading');
  const btn = document.getElementById('btnSaveRestStop');
  btn.disabled = true;

  try {
    const payload = {
      lat: lat, lng: lng, name: name, tag: 'rest_stop',
      uid: currentUser.uid, authorName: 'Admin', timestamp: Date.now(), upvotes: 0
    };
    
    const docRef = await addDoc(collection(db, "rest_stops"), payload);
    await set(ref(rtdb, `communityPois/${docRef.id}`), payload);
    await updateVersion('rest_stops');

    showStatus('statusRestStop', '✅ Đã lưu: ' + name, 'success');
    document.getElementById('poiName').value = '';
    document.getElementById('poiGmapsUrl').value = '';
    if (currentRestStopMarker) { map.removeLayer(currentRestStopMarker); currentRestStopMarker = null; }
  } catch (err) {
    showStatus('statusRestStop', 'Lỗi: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
};

window.saveAvoidZone = async function() {
  if (!currentUser) return showStatus('statusAvoid', 'Lỗi: Chưa đăng nhập Firebase!', 'error');
  
  const name = document.getElementById('zoneName').value.trim();
  const startTimeVal = document.getElementById('zoneStartTime').value;
  const endTimeVal = document.getElementById('zoneEndTime').value;

  if (!name) return showStatus('statusAvoid', 'Vui lòng nhập Tên đoạn cấm!', 'error');
  if (!currentRouteWaypoints || currentRouteWaypoints.length < 2) {
    return showStatus('statusAvoid', 'Vui lòng vẽ hoặc chọn tọa độ tuyến đường trước!', 'error');
  }

  const checkedVehicles = document.querySelectorAll('.zone-vehicle:checked');
  const bannedVehicles = Array.from(checkedVehicles).map(cb => cb.value);

  let firstPoint, lastPoint;
  if (Array.isArray(currentRouteWaypoints[0][0])) {
    const firstLine = currentRouteWaypoints[0];
    const lastLine = currentRouteWaypoints[currentRouteWaypoints.length - 1];
    firstPoint = firstLine[0];
    lastPoint = lastLine[lastLine.length - 1];
  } else {
    firstPoint = currentRouteWaypoints[0];
    lastPoint = currentRouteWaypoints[currentRouteWaypoints.length - 1];
  }

  let startTime = null;
  let endTime = null;
  if (startTimeVal) startTime = new Date(startTimeVal).getTime();
  if (endTimeVal) endTime = new Date(endTimeVal).getTime();

  showStatus('statusAvoid', 'Đang lưu...', 'loading');
  try {
    const payload = {
      name: name,
      lat1: firstPoint[0],
      lng1: firstPoint[1],
      lat2: lastPoint[0],
      lng2: lastPoint[1],
      waypoints: JSON.stringify(currentRouteWaypoints),
      startTime: startTime,
      endTime: endTime,
      bannedVehicles: bannedVehicles,
      timestamp: Date.now()
    };

    const docRef = await addDoc(collection(db, "avoid_zones"), payload);
    await set(ref(rtdb, `avoid_zones/${docRef.id}`), payload);
    await updateVersion('avoid_zones');
    
    showStatus('statusAvoid', '✅ Đã lưu đoạn cấm thành công!', 'success');
    
    resetZoneDrawing();
    document.getElementById('zoneName').value = '';
  } catch (err) {
    showStatus('statusAvoid', 'Lỗi: ' + err.message, 'error');
  }
};

function showStatus(id, msg, type) {
  const box = document.getElementById(id);
  if (!box) return;
  box.textContent = msg;
  box.className = 'status-box status-' + type;
}
</script>
