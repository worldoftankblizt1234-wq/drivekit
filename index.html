<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So sánh Nearby: TomTom vs Foursquare</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- vConsole -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new window.VConsole();</script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; background-color: #e5e5e5; }
        #ui-panel {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 300px; max-height: 85vh; overflow-y: auto;
        }
        h3 { margin-top: 0; font-size: 16px; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            padding: 10px; cursor: pointer; border: none; border-radius: 5px;
            background-color: #007bff; color: white; font-weight: bold; flex: 1; transition: 0.2s; font-size: 13px;
        }
        button:hover { background-color: #0056b3; }
        button.active { background-color: #28a745; }
        
        select {
            width: 100%; padding: 10px; margin-bottom: 10px; 
            border: 1px solid #ccc; border-radius: 5px; 
            box-sizing: border-box; font-size: 14px; background-color: white;
        }

        /* Style cho phần Bán kính */
        .radius-container {
            margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 5px; border: 1px solid #ddd;
        }
        .radius-header {
            display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #333;
        }
        input[type="range"] {
            width: 100%; cursor: pointer;
        }

        .legend { display: flex; gap: 15px; font-size: 13px; margin-bottom: 10px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid white; box-shadow: 0 0 3px rgba(0,0,0,0.4); }
        #results-list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
        #results-list li { padding: 6px 0; border-bottom: 1px solid #eee; cursor: pointer; }
        #results-list li:hover { background-color: #f9f9f9; }
        .place-name { font-weight: bold; }
        .place-source { font-size: 11px; padding: 1px 4px; border-radius: 3px; color: white; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h3>Tìm địa điểm xung quanh</h3>
        <div class="btn-group">
            <button id="btn-locate">📍 Vị trí của tôi</button>
            <button id="btn-pick">🎯 Chọn điểm khác</button>
        </div>
        
        <select id="search-category">
            <option value="cafe" data-tomtom="9376">Quán Cà phê</option>
            <option value="hotel" data-tomtom="7314">Khách sạn</option>
            <option value="hospital" data-tomtom="7321">Bệnh viện</option>
            <option value="bank" data-tomtom="9368">Ngân hàng</option>
        </select>

        <!-- Thanh trượt bán kính -->
        <div class="radius-container">
            <div class="radius-header">
                <span>Bán kính:</span>
                <span id="radius-value" style="color: #007bff;">2000 m</span>
            </div>
            <input type="range" id="radius-slider" min="500" max="10000" step="500" value="2000">
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot" style="background:#dc3545;"></span> TomTom</div>
            <div class="legend-item"><span class="dot" style="background:#007bff;"></span> Foursquare</div>
        </div>

        <button id="btn-search" style="width: 100%; margin-bottom: 15px;">Tìm kiếm cả hai</button>

        <div id="status-msg" style="color: #e67e22; font-size: 13px; margin-bottom: 10px;"></div>
        <ul id="results-list"></ul>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ==========================================
        // CẤU HÌNH API KEY
        // ==========================================
        const TOMTOM_API_KEY = 'tG84Z1Yh4rauGWjz6pRn98rrWymLjTru';
        const FSQ_API_KEY = 'OZ4V35PQYDWISQTVSR4PUQ4TAJDDRBKY4SON2UGWL333DX33';
        const MAPTILER_KEY = 'aEzMCP0ANRz52vd1RvrW';
        const CORSPROXY_KEY = '68c61444'; 
        
        const DEFAULT_LAT = 21.0285; // Hồ Hoàn Kiếm
        const DEFAULT_LNG = 105.8542;
        
        let currentRadius = 2000; // Bán kính mặc định (mét)

        // --- KHỞI TẠO BẢN ĐỒ ---
        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 14);
        
        L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
            tileSize: 512, zoomOffset: -1, minZoom: 1,
            attribution: '&copy; MapTiler &copy; OpenStreetMap contributors',
            crossOrigin: true
        }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 500);

        // Icon tâm
        const centerIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#ffc107; width:15px; height:15px; border-radius:50%; border:3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);'></div>",
            iconSize: [20, 20], iconAnchor: [10, 10]
        });
        let centerMarker = L.marker([DEFAULT_LAT, DEFAULT_LNG], { icon: centerIcon }).addTo(map);

        // Vòng tròn hiển thị bán kính
        let searchCircle = L.circle([DEFAULT_LAT, DEFAULT_LNG], {
            radius: currentRadius,
            color: '#ffc107', // Màu vàng giống tâm
            weight: 2,
            fillColor: '#ffc107',
            fillOpacity: 0.1,
            interactive: false // Không cản trở việc click bản đồ
        }).addTo(map);

        let allMarkers = [];
        let isPickingMode = false;
        
        const btnPick = document.getElementById('btn-pick');
        const statusMsg = document.getElementById('status-msg');
        const resultsList = document.getElementById('results-list');
        const radiusSlider = document.getElementById('radius-slider');
        const radiusValue = document.getElementById('radius-value');

        // --- XỬ LÝ THANH TRƯỢT BÁN KÍNH ---
        radiusSlider.addEventListener('input', (e) => {
            currentRadius = parseInt(e.target.value);
            radiusValue.innerText = currentRadius + ' m';
            searchCircle.setRadius(currentRadius); // Cập nhật vòng tròn ngay lập tức
        });

        // --- CHỨC NĂNG VỊ TRÍ CỦA TÔI ---
        document.getElementById('btn-locate').addEventListener('click', () => {
            if (!navigator.geolocation) return alert("Không hỗ trợ GPS");
            statusMsg.innerText = "Đang lấy vị trí...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const newLatLng = [lat, lng];
                    
                    map.setView(newLatLng, 15);
                    centerMarker.setLatLng(newLatLng);
                    searchCircle.setLatLng(newLatLng); // Di chuyển vòng tròn theo
                    
                    statusMsg.innerText = "Đã lấy vị trí.";
                    if (isPickingMode) togglePickMode();
                    searchAll(lat, lng);
                },
                (error) => { statusMsg.innerText = "Lỗi GPS: " + error.message; }
            );
        });

        // --- CHỌN ĐIỂM KHÁC ---
        btnPick.addEventListener('click', togglePickMode);

        function togglePickMode() {
            isPickingMode = !isPickingMode;
            if (isPickingMode) {
                btnPick.classList.add('active');
                btnPick.innerText = "🎯 Đang chọn...";
                statusMsg.innerText = "Click lên bản đồ để đặt tâm.";
            } else {
                btnPick.classList.remove('active');
                btnPick.innerText = "🎯 Chọn điểm khác";
            }
        }

        map.on('click', function(e) {
            if (isPickingMode) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                const newLatLng = [lat, lng];
                
                centerMarker.setLatLng(newLatLng);
                searchCircle.setLatLng(newLatLng); // Di chuyển vòng tròn theo
                
                statusMsg.innerText = `Đã chọn: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                togglePickMode();
                searchAll(lat, lng);
            }
        });

        // --- NÚT TÌM KIẾM ---
        document.getElementById('btn-search').addEventListener('click', () => {
            const currentLatLng = centerMarker.getLatLng();
            searchAll(currentLatLng.lat, currentLatLng.lng);
        });

        // --- HÀM GỌI CẢ HAI API ---
        async function searchAll(lat, lng) {
            resultsList.innerHTML = '';
            statusMsg.innerText = "Đang tìm kiếm...";
            
            allMarkers.forEach(m => map.removeLayer(m));
            allMarkers = [];

            const selectEl = document.getElementById('search-category');
            const queryText = selectEl.value;
            const tomtomCategory = selectEl.options[selectEl.selectedIndex].getAttribute('data-tomtom');

            // Truyền currentRadius vào API
            await Promise.all([
                searchTomTom(lat, lng, tomtomCategory, currentRadius),
                searchFoursquare(lat, lng, queryText, currentRadius)
            ]);

            statusMsg.innerText = "Hoàn tất! Xem kết quả bên dưới.";
        }

        // --- 1. TOMTOM NEARBY SEARCH ---
        async function searchTomTom(lat, lng, categoryId, radius) {
            const url = `https://api.tomtom.com/search/2/nearbySearch/.json?key=${TOMTOM_API_KEY}&lat=${lat}&lon=${lng}&radius=${radius}&limit=20&categorySet=${categoryId}&language=vi-VN`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`TomTom HTTP ${res.status}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) return;

                data.results.forEach(place => {
                    const pLat = place.position.lat;
                    const pLng = place.position.lon;
                    const pName = place.poi.name;
                    const pAddress = place.address.freeformAddress;
                    const dist = Math.round(place.dist);

                    const marker = L.circleMarker([pLat, pLng], {
                        radius: 8, fillColor: "#dc3545", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
                    }).addTo(map).bindPopup(`<b>[TomTom] ${pName}</b><br>${pAddress}<br>${dist}m`);

                    allMarkers.push(marker);
                    addToList(pName, pAddress, dist, 'TomTom', '#dc3545', marker);
                });
            } catch (err) {
                console.error('Lỗi TomTom:', err);
            }
        }

        // --- 2. FOURSQUARE NEARBY SEARCH ---
        async function searchFoursquare(lat, lng, queryText, radius) {
            const targetUrl = `https://places-api.foursquare.com/places/search?query=${queryText}&ll=${lat},${lng}&radius=${radius}&limit=20`;
            const params = new URLSearchParams({ key: CORSPROXY_KEY, url: targetUrl });
            const proxyUrl = 'https://corsproxy.io/?' + params.toString();

            try {
                const res = await fetch(proxyUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${FSQ_API_KEY}`, 
                        'X-Places-Api-Version': '2025-06-17',
                        'Accept': 'application/json'
                    }
                });

                if (!res.ok) throw new Error(`Foursquare HTTP ${res.status}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) return;

                data.results.forEach(place => {
                    const pLat = place.geocodes?.primary?.latitude || place.geocodes?.main?.latitude || place.latitude;
                    const pLng = place.geocodes?.primary?.longitude || place.geocodes?.main?.longitude || place.longitude;
                    
                    if (!pLat || !pLng) return;

                    const pName = place.name;
                    const pAddress = place.location?.formatted_address || 'Không có địa chỉ';
                    const dist = place.distance || 0;

                    const marker = L.circleMarker([pLat, pLng], {
                        radius: 8, fillColor: "#007bff", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
                    }).addTo(map).bindPopup(`<b>[Foursquare] ${pName}</b><br>${pAddress}<br>${dist}m`);

                    allMarkers.push(marker);
                    addToList(pName, pAddress, dist, 'FSQ', '#007bff', marker);
                });
            } catch (err) {
                console.error('Lỗi Foursquare:', err);
            }
        }

        // --- HÀM THÊM VÀO DANH SÁCH BÊN TRÁI ---
        function addToList(name, address, dist, source, color, marker) {
            const li = document.createElement('li');
            li.innerHTML = `
                <div><span class="place-source" style="background:${color}">${source}</span><span class="place-name">${name}</span></div>
                <div style="color:#666; font-size:11px; margin-top:2px;">📍 ${dist}m - ${address}</div>
            `;
            li.addEventListener('click', () => {
                map.setView(marker.getLatLng(), 17);
                marker.openPopup();
            });
            resultsList.appendChild(li);
        }

        // Chạy lần đầu
        searchAll(DEFAULT_LAT, DEFAULT_LNG);
    </script>
</body>
</html>
