<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Nearby - MapTiler + Python API</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- vConsole để debug -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>var vConsole = new window.VConsole();</script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; background: #e5e5e5; z-index: 1; }
        
        .panel { 
            position: absolute; top: 10px; left: 10px; z-index: 1000; 
            background: white; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 290px; 
        }
        h3 { margin-top: 0; text-align: center; color: #333; font-size: 16px; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-locate, .btn-pick {
            flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .btn-locate { background: #3b82f6; color: white; }
        .btn-locate:hover { background: #2563eb; }
        .btn-pick { background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; }
        .btn-pick.active { background: #10b981; color: white; border-color: #10b981; }

        select, .btn-search { 
            width: 100%; padding: 10px; margin-bottom: 10px; 
            box-sizing: border-box; border-radius: 8px; 
            border: 1px solid #ccc; font-size: 14px; font-weight: bold;
        }
        .btn-search { background: #3b82f6; color: white; border: none; cursor: pointer; }
        .btn-search:hover { background: #2563eb; }
        
        .rad-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .rad-container input { flex: 1; }
        .rad-container span { font-size: 13px; font-weight: bold; color: #3b82f6; min-width: 50px; text-align: right; }

        /* Bottom Sheet */
        #sheet { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.2); 
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 2000; max-height: 60vh; display: flex; flex-direction: column; 
        }
        #sheet.open { transform: translateY(0); }
        .sheet-header { 
            padding: 15px; font-weight: bold; text-align: center; 
            border-bottom: 1px solid #eee; cursor: pointer; 
            color: #333; font-size: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .sheet-header:active { background: #f9f9f9; border-radius: 20px 20px 0 0; }
        .sheet-list { overflow-y: auto; padding: 10px 15px; flex: 1; }
        .item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; border-bottom: 1px solid #eee; cursor: pointer; 
        }
        .item:active { background: #f9f9f9; }
        .item-name { font-weight: bold; font-size: 14px; color: #333; }
        .item-dist { color: #ef4444; font-size: 13px; font-weight: bold; margin-top: 4px; }
        .btn-dir {
            background: #3b82f6; color: white; border: none; padding: 8px 12px;
            border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h3>Tìm quanh đây (Max 1km)</h3>
        
        <!-- 2 Nút chọn vị trí -->
        <div class="btn-group">
            <button class="btn-locate" id="btnLocate"><i class="fas fa-location-arrow"></i> Vị trí</button>
            <button class="btn-pick" id="btnPick"><i class="fas fa-crosshairs"></i> Chọn điểm</button>
        </div>

        <select id="category">
            <option value="restaurant">Nhà hàng / Quán ăn</option>
            <option value="cafe">Quán cà phê</option>
            <option value="hotel">Khách sạn</option>
            <option value="hospital">Bệnh viện</option>
            <option value="bank">Ngân hàng</option>
        </select>
        
        <div class="rad-container">
            <input type="range" id="radius" min="0.1" max="1" step="0.1" value="1">
            <span id="radVal">1.0 km</span>
        </div>

        <button class="btn-search" onclick="fetchNearby()">Tìm kiếm</button>
        <div id="status" style="font-size:12px; color:#e67e22; margin-top:10px; text-align:center;">Nhấp chọn điểm để đổi tâm</div>
    </div>

    <div id="map"></div>

    <div id="sheet">
        <div class="sheet-header" onclick="document.getElementById('sheet').classList.remove('open')">
            <span>Kết quả tìm kiếm</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="sheet-list" id="resultList"></div>
    </div>

    <script>
        // ==============================
        // CẤU HÌNH MAPTILER
        // ==============================
        const MAPTILER_KEY = 'aEzMCP0ANRz52vd1RvrW';
        
        // Tọa độ mặc định (Biên Hòa)
        let centerLat = 10.96976;
        let centerLng = 106.89238;
        let isPickingMode = false;

        // Khởi tạo bản đồ MapTiler
        const map = L.map('map').setView([centerLat, centerLng], 15);
        L.tileLayer(`https://api.maptiler.com/maps/streets-v4/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
            tileSize: 512,
            zoomOffset: -1,
            attribution: '&copy; MapTiler &copy; OpenStreetMap'
        }).addTo(map);

        // Marker tâm
        let centerMarker = L.marker([centerLat, centerLng]).addTo(map).bindPopup("Tâm tìm kiếm").openPopup();
        let resultMarkers = [];

        // ==============================
        // XỬ LÝ NÚT VỊ TRÍ VÀ CHỌN ĐIỂM
        // ==============================
        const btnLocate = document.getElementById('btnLocate');
        const btnPick = document.getElementById('btnPick');
        const statusEl = document.getElementById('status');

        // Nút 1: Lấy vị trí GPS
        btnLocate.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ GPS.");
                return;
            }
            
            statusEl.innerText = "Đang lấy vị trí GPS...";
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    centerLat = pos.coords.latitude;
                    centerLng = pos.coords.longitude;
                    
                    map.flyTo([centerLat, centerLng], 16);
                    centerMarker.setLatLng([centerLat, centerLng]);
                    centerMarker.openPopup();
                    
                    statusEl.innerText = "Đã lấy vị trí hiện tại.";
                    
                    // Tắt chế độ chọn nếu đang bật
                    if (isPickingMode) togglePickMode();
                    
                    // Tự động tìm kiếm
                    fetchNearby();
                },
                (err) => {
                    statusEl.innerHTML = `<span style="color:red">Lỗi GPS: ${err.message}</span>`;
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        });

        // Nút 2: Bật/tắt chế độ chọn điểm
        btnPick.addEventListener('click', togglePickMode);

        function togglePickMode() {
            isPickingMode = !isPickingMode;
            if (isPickingMode) {
                btnPick.classList.add('active');
                btnPick.innerHTML = `<i class="fas fa-check"></i> Đang chọn...`;
                statusEl.innerText = "Hãy click lên bản đồ để đặt tâm.";
            } else {
                btnPick.classList.remove('active');
                btnPick.innerHTML = `<i class="fas fa-crosshairs"></i> Chọn điểm`;
                statusEl.innerText = "Nhấp chọn điểm để đổi tâm";
            }
        }

        // Sự kiện click lên bản đồ
        map.on('click', (e) => {
            if (isPickingMode) {
                centerLat = e.latlng.lat;
                centerLng = e.latlng.lng;
                
                centerMarker.setLatLng([centerLat, centerLng]);
                centerMarker.openPopup();
                
                statusEl.innerText = `Đã chọn: ${centerLat.toFixed(4)}, ${centerLng.toFixed(4)}`;
                
                // Tắt chế độ chọn
                togglePickMode();
                
                // Tự động tìm kiếm
                fetchNearby();
            }
        });

        // Cập nhật text khi kéo thanh trượt
        document.getElementById('radius').addEventListener('input', (e) => {
            document.getElementById('radVal').innerText = parseFloat(e.target.value).toFixed(1) + ' km';
        });

        // ==============================
        // GỌI API PYTHON
        // ==============================
        async function fetchNearby() {
            const radius = document.getElementById('radius').value;
            const category = document.getElementById('category').value;
            
            statusEl.innerText = "Đang tìm kiếm...";
            resultMarkers.forEach(m => map.removeLayer(m));
            resultMarkers = [];

            const url = `https://potential-space-trout-p7r7pgrjwjvw26g6j-8000.app.github.dev/api/nearby?lat=${centerLat}&lon=${centerLng}&radius=${radius}&category=${category}`;
            console.log("Fetching:", url);

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                if (data.length === 0) {
                    statusEl.innerText = "Không tìm thấy địa điểm nào.";
                    return;
                }

                statusEl.innerText = `Tìm thấy ${data.length} địa điểm.`;
                document.getElementById('resultList').innerHTML = '';
                
                data.forEach(p => {
                    // Vẽ Marker (Màu đỏ)
                    const marker = L.circleMarker([p.lat, p.lon], {
                        radius: 8, fillColor: "#ef4444", color: "#fff", weight: 2, fillOpacity: 1
                    }).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.distance_km.toFixed(2)} km`);
                    resultMarkers.push(marker);

                    // Thêm vào danh sách Bottom Sheet
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item';
                    itemDiv.innerHTML = `
                        <div>
                            <div class="item-name">${p.name}</div>
                            <div class="item-dist">📍 ${p.distance_km.toFixed(2)} km</div>
                        </div>
                        <button class="btn-dir" title="Chỉ đường"><i class="fas fa-diamond-turn-right"></i></button>
                    `;
                    
                    // Click vào item -> bay tới
                    itemDiv.onclick = () => {
                        map.flyTo([p.lat, p.lon], 17);
                        marker.openPopup();
                    };

                    document.getElementById('resultList').appendChild(itemDiv);
                });

                // Hiện Bottom Sheet
                document.getElementById('sheet').classList.add('open');
                // Zoom map bao quát
                map.flyTo([centerLat, centerLng], 15);

            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `<span style="color:red">Lỗi: ${err.message} (Xem vConsole)</span>`;
                alert("Lỗi kết nối API. Hãy chắc chắn server Python đã bật CORS (Access-Control-Allow-Origin: *).");
            }
        }
    </script>
</body>
</html>
