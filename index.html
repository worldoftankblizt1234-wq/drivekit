<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foursquare Nearby Search với OSM</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        
        /* Bản đồ chiếm toàn màn hình */
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Bảng điều khiển bên trái */
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h3 { margin-top: 0; font-size: 16px; color: #333; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        
        button {
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            flex: 1;
            transition: 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.active { background-color: #28a745; } /* Màu xanh lá khi đang bật chế độ chọn */
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #results-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }
        #results-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        #results-list li:hover { background-color: #f9f9f9; }
        .place-name { font-weight: bold; color: #007bff; }
        .place-distance { color: #666; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Bảng điều khiển -->
    <div id="ui-panel">
        <h3>Tìm kiếm xung quanh</h3>
        
        <div class="btn-group">
            <button id="btn-locate">📍 Vị trí của tôi</button>
            <button id="btn-pick">🎯 Chọn điểm khác</button>
        </div>

        <input type="text" id="search-query" placeholder="Nhập từ khóa (VD: cafe, hotel...)" value="cafe">
        <button id="btn-search" style="width: 100%; margin-bottom: 15px;">Tìm kiếm</button>

        <div id="status-msg" style="color: #e67e22; font-size: 13px; margin-bottom: 10px;"></div>
        <ul id="results-list"></ul>
    </div>

    <!-- Vùng chứa bản đồ -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // --- CẤU HÌNH ---
        const FSQ_API_KEY = 'OZ4V35PQYDWISQTVSR4PUQ4TAJDDRBKY4SON2UGWL333DX33';
        const DEFAULT_LAT = 21.0285; // Hồ Hoàn Kiếm
        const DEFAULT_LNG = 105.8542;
        const RADIUS = 2000; // Bán kính 2km

        // --- KHỞI TẠO BẢN ĐỒ (OSM) ---
        const map = L.map('map').setView([DEFAULT_LAT, DEFAULT_LNG], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker màu xanh đại diện cho tâm tìm kiếm
        const centerIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#007bff; width:15px; height:15px; border-radius:50%; border:3px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);'></div>",
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        let centerMarker = L.marker([DEFAULT_LAT, DEFAULT_LNG], { icon: centerIcon }).addTo(map);

        // Mảng lưu các marker kết quả để xóa khi tìm kiếm mới
        let resultMarkers = [];

        // --- CÁC BIẾN TRẠNG THÁI ---
        let isPickingMode = false;
        const btnPick = document.getElementById('btn-pick');
        const statusMsg = document.getElementById('status-msg');
        const resultsList = document.getElementById('results-list');

        // --- CHỨC NĂNG 1: VỊ TRÍ CỦA TÔI ---
        document.getElementById('btn-locate').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ định vị GPS.");
                return;
            }

            statusMsg.innerText = "Đang lấy vị trí...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 15);
                    centerMarker.setLatLng([lat, lng]);
                    statusMsg.innerText = "Đã lấy vị trí hiện tại.";
                    
                    // Tắt chế độ chọn điểm nếu đang bật
                    if (isPickingMode) togglePickMode();
                    
                    // Tự động tìm kiếm
                    searchFoursquare(lat, lng);
                },
                (error) => {
                    statusMsg.innerText = "Lỗi định vị: " + error.message;
                }
            );
        });

        // --- CHỨC NĂNG 2: CHỌN ĐIỂM KHÁC (CLICK LÊN BẢN ĐỒ) ---
        btnPick.addEventListener('click', togglePickMode);

        function togglePickMode() {
            isPickingMode = !isPickingMode;
            if (isPickingMode) {
                btnPick.classList.add('active');
                btnPick.innerText = "🎯 Đang chọn... (Click bản đồ)";
                statusMsg.innerText = "Hãy click lên bản đồ để đặt tâm xanh.";
            } else {
                btnPick.classList.remove('active');
                btnPick.innerText = "🎯 Chọn điểm khác";
            }
        }

        // Bắt sự kiện click lên bản đồ
        map.on('click', function(e) {
            if (isPickingMode) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                
                centerMarker.setLatLng([lat, lng]);
                statusMsg.innerText = `Đã chọn tâm: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                
                // Tắt chế độ chọn
                togglePickMode();
                
                // Tự động tìm kiếm
                searchFoursquare(lat, lng);
            }
        });

        // Bắt sự kiện nút Tìm kiếm thủ công
        document.getElementById('btn-search').addEventListener('click', () => {
            const currentLatLng = centerMarker.getLatLng();
            searchFoursquare(currentLatLng.lat, currentLatLng.lng);
        });

        // --- CHỨC NĂNG GỌI API FOURSQUARE ---
        async function searchFoursquare(lat, lng) {
            const query = document.getElementById('search-query').value || 'cafe';
            
            resultsList.innerHTML = '';
            statusMsg.innerText = "Đang tìm kiếm...";
            
            // Xóa các marker kết quả cũ
            resultMarkers.forEach(marker => map.removeLayer(marker));
            resultMarkers = [];

            const url = `https://places-api.foursquare.com/places/search?query=${encodeURIComponent(query)}&ll=${lat},${lng}&radius=${RADIUS}&limit=20`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${FSQ_API_KEY}`,
                        'Accept': 'application/json',
                        'X-Places-Api-Version': '2025-06-17'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Lỗi API: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                statusMsg.innerText = `Tìm thấy ${data.results.length} địa điểm.`;

                // Vẽ kết quả lên bản đồ và danh sách
                data.results.forEach(place => {
                    const pLat = place.geocodes.main.latitude;
                    const pLng = place.geocodes.main.longitude;
                    const pName = place.name;
                    const pAddress = place.location.formatted_address || 'Không có địa chỉ';
                    const pDistance = place.distance; // mét

                    // Thêm marker đỏ cho địa điểm
                    const marker = L.marker([pLat, pLng]).addTo(map)
                        .bindPopup(`<b>${pName}</b><br>${pAddress}<br>Cách ${pDistance}m`);
                    resultMarkers.push(marker);

                    // Thêm vào danh sách bên trái
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="place-name">${pName}</div>
                        <div class="place-distance">📍 Cách ${pDistance}m</div>
                    `;
                    
                    // Click vào danh sách -> bay tới địa điểm đó
                    li.addEventListener('click', () => {
                        map.setView([pLat, pLng], 17);
                        marker.openPopup();
                    });
                    
                    resultsList.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                statusMsg.innerText = error.message;
            }
        }

        // Tự động tìm kiếm lần đầu khi mở bản đồ
        searchFoursquare(DEFAULT_LAT, DEFAULT_LNG);

    </script>
</body>
</html>
