<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapillary Traffic Signs – MapTiler Streets</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }

    #legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(255,255,255,.92);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      z-index: 2;
      line-height: 1.5;
    }
    #legend b { display: block; margin-bottom: 4px; }
    #legend span.dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }

    .mapillary-popup { max-width: 340px; font-size: 13px; }
    .mapillary-popup img { width: 100%; border-radius: 6px; margin-top: 6px; }
    .mapillary-popup .meta { color: #555; font-size: 11px; margin-top: 4px; }
    .mapillary-popup .loading { color: #888; font-style: italic; }
    .mapillary-popup .error { color: #c00; }
  </style>
</head>
<body>

<div id="map"></div>

<div id="legend">
  <b>Chú thích biển báo</b>
  <div><span class="dot" style="background:#d62828"></span>Regulatory</div>
  <div><span class="dot" style="background:#fcbf49"></span>Warning</div>
  <div><span class="dot" style="background:#003049"></span>Information / Complementary</div>
</div>

<script>
/* ==================================================================
   1. CẤU HÌNH
   ================================================================== */
const MAPILLARY_TOKEN = 'MLY|29249168751358312|a5696ee10fc78ffba69a9a34515c63a8';

// MapTiler style URL (đã bao gồm OSM + attribution)
const MAPTILER_STYLE_URL =
  'https://api.maptiler.com/maps/streets-v4/style.json?key=aEzMCP0ANRz52vd1RvrW';

// CDN icon SVG của Mapillary
const SIGN_ICON_CDN = 'https://static.mapillary.com/traffic_signs';

/* ==================================================================
   2. KHỞI TẠO BẢN ĐỒ – NỀN MAPTILER STREETS v4
   ================================================================== */
const map = new maplibregl.Map({
  container: 'map',
  style: MAPTILER_STYLE_URL,
  center: [105.85, 21.03],  // Hà Nội – đổi tuỳ ý
  zoom: 15
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

/* ==================================================================
   3. QUẢN LÝ ICON SVG
   ================================================================== */
const DEFAULT_SIGN_SVG = `
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="#e63946" stroke="#ffffff" stroke-width="2.5"/>
</svg>`;

const CATEGORY_COLORS = {
  regulatory:     '#d62828',
  warning:        '#fcbf49',
  information:    '#003049',
  complementary:  '#003049'
};

const loadedIcons = new Set();
const loadingIcons = new Map();

function svgToDataUri(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function makeFallbackSvg(objectValue) {
  const category = (objectValue || '').split('--')[0] || 'regulatory';
  const color = CATEGORY_COLORS[category] || '#e63946';
  return `
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="${color}" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="16" cy="16" r="8" fill="#ffffff" fill-opacity="0.25"/>
</svg>`;
}

async function loadIconForSign(objectValue) {
  if (!objectValue) return;
  if (loadedIcons.has(objectValue)) return;
  if (loadingIcons.has(objectValue)) return loadingIcons.get(objectValue);

  const promise = (async () => {
    const url = `${SIGN_ICON_CDN}/${objectValue}.svg`;
    try {
      const img = await map.loadImage(url);
      if (!map.hasImage(objectValue)) map.addImage(objectValue, img.data);
      loadedIcons.add(objectValue);
    } catch (err) {
      console.warn(`[icon] Không tải được ${objectValue}, dùng fallback`, err.message || err);
      try {
        const fb = await map.loadImage(svgToDataUri(makeFallbackSvg(objectValue)));
        if (!map.hasImage(objectValue)) map.addImage(objectValue, fb.data);
        loadedIcons.add(objectValue);
      } catch (e2) {
        console.error('[icon] Fallback cũng lỗi cho', objectValue, e2);
      }
    } finally {
      loadingIcons.delete(objectValue);
    }
  })();

  loadingIcons.set(objectValue, promise);
  return promise;
}

/* ==================================================================
   4. SETUP LỚP BIỂN BÁO SAU KHI STYLE LOAD XONG
   ================================================================== */
map.on('load', async () => {
  // 4a. Icon mặc định
  const defaultImg = await map.loadImage(svgToDataUri(DEFAULT_SIGN_SVG));
  if (!map.hasImage('default-sign')) map.addImage('default-sign', defaultImg.data);

  // 4b. Vector tile source Mapillary
  if (!map.getSource('traffic-signs')) {
    map.addSource('traffic-signs', {
      type: 'vector',
      tiles: [
        `https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${MAPILLARY_TOKEN}`
      ],
      minzoom: 0,
      maxzoom: 14
    });
  }

  // 4c. Symbol layer – không chỉ định beforeId → tự nằm trên cùng
  if (!map.getLayer('traffic-signs-layer')) {
    map.addLayer({
      id: 'traffic-signs-layer',
      type: 'symbol',
      source: 'traffic-signs',
      'source-layer': 'traffic_sign',
      layout: {
        'icon-image': [
          'coalesce',
          ['get', 'object_value'],
          ['get', 'value'],
          'default-sign'
        ],
        'icon-size': [
          'interpolate', ['linear'], ['zoom'],
          12, 0.35,
          15, 0.55,
          18, 0.8
        ],
        'icon-allow-overlap': true,
        'icon-anchor': 'bottom',
        'icon-padding': 2
      }
    });
  }

  // 4d. Tự load icon khi gặp id chưa có
  map.on('styleimagemissing', async (e) => {
    const id = e.id;
    if (!id || id === 'default-sign') return;
    if (map.hasImage(id)) return;
    if (id.includes('--') || /^[a-z-]+$/.test(id)) {
      await loadIconForSign(id);
    }
  });

  // 4e. Preload icon cho các biển báo đang có trong tile
  map.on('sourcedata', (e) => {
    if (e.sourceId !== 'traffic-signs' || !e.isSourceLoaded) return;
    const feats = map.querySourceFeatures('traffic-signs', { sourceLayer: 'traffic_sign' });
    const seen = new Set();
    feats.forEach(f => {
      const v = f.properties.object_value || f.properties.value;
      if (v && !seen.has(v)) {
        seen.add(v);
        loadIconForSign(v);
      }
    });
  });

  /* Click biển báo → popup ảnh street-level */
  map.on('click', 'traffic-signs-layer', async (e) => {
    const feature = e.features[0];
    const mapFeatureId = feature.properties.id;
    const signType = feature.properties.object_value || feature.properties.value || 'unknown';

    const popup = new maplibregl.Popup({ maxWidth: '360px' })
      .setLngLat(e.lngLat)
      .setHTML(`<div class="mapillary-popup"><div class="loading">Đang tải ảnh…</div></div>`)
      .addTo(map);

    try {
      const imageIds = await fetchMapFeatureImages(mapFeatureId);
      if (!imageIds || imageIds.length === 0) {
        popup.setHTML(`<div class="mapillary-popup error">Không tìm thấy ảnh cho biển báo này.</div>`);
        return;
      }
      const imgData = await fetchImageThumbnail(imageIds[0]);
      const captured = imgData.captured_at
        ? new Date(imgData.captured_at).toLocaleString('vi-VN')
        : 'Không rõ';

      popup.setHTML(`
        <div class="mapillary-popup">
          <strong>${signType}</strong><br>
          <img src="${imgData.thumb_1024_url}" alt="Mapillary street-level image" />
          <div class="meta">
            📍 Map feature ID: ${mapFeatureId}<br>
            🕒 Chụp lúc: ${captured}<br>
            🧭 Hướng: ${imgData.compass_angle ?? '—'}°
          </div>
        </div>
      `);
    } catch (err) {
      console.error(err);
      popup.setHTML(`<div class="mapillary-popup error">Lỗi: ${err.message}</div>`);
    }
  });

  map.on('mouseenter', 'traffic-signs-layer', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'traffic-signs-layer', () => map.getCanvas().style.cursor = '');
});

/* ==================================================================
   5. API MAPILLARY
   ================================================================== */
async function fetchMapFeatureImages(mapFeatureId) {
  const url = `https://graph.mapillary.com/${mapFeatureId}?access_token=${MAPILLARY_TOKEN}&fields=images`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Map feature API lỗi: ${res.status}`);
  const data = await res.json();
  return data.images || [];
}

async function fetchImageThumbnail(imageId) {
  const url = `https://graph.mapillary.com/${imageId}?access_token=${MAPILLARY_TOKEN}&fields=thumb_1024_url,captured_at,compass_angle`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Image API lỗi: ${res.status}`);
  return await res.json();
}
</script>

</body>
</html>
