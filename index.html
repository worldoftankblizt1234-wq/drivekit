<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapillary Signs – Debug Panel (SVG fix)</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #legend {
      position: absolute; left: 12px; bottom: 12px;
      background: rgba(255,255,255,.92); padding: 8px 10px;
      border-radius: 8px; font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); z-index: 2; line-height: 1.5;
    }
    #legend b { display: block; margin-bottom: 4px; }
    #legend span.dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
    #debugPanel {
      position: absolute; top: 12px; right: 60px; width: 380px; max-height: 60vh;
      background: rgba(20, 20, 20, 0.92); color: #e0e0e0;
      font: 12px/1.45 ui-monospace, "Cascadia Code", monospace;
      border-radius: 10px; display: flex; flex-direction: column;
      z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,.4); overflow: hidden;
    }
    #debugPanel.collapsed #debugBody { display: none; }
    #debugHeader {
      padding: 8px 10px; display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid #333; cursor: pointer; user-select: none;
      background: #2a2a2a;
    }
    #debugHeader b { color: #fff; font-size: 12px; }
    #debugHeader .badge {
      background: #d62828; color: #fff; border-radius: 10px;
      padding: 1px 7px; font-size: 10px; margin-left: auto;
    }
    #debugHeader .badge.zero { background: #2a7d2a; }
    #debugHeader .state {
      color: #888; font-size: 10px; padding: 1px 6px;
      border: 1px solid #444; border-radius: 10px;
    }
    #debugHeader .state.ready { color: #7dff7d; border-color: #2a7d2a; }
    #debugControls {
      display: flex; gap: 4px; padding: 6px 8px;
      border-bottom: 1px solid #333; flex-wrap: wrap;
    }
    #debugControls button {
      background: #3a3a3a; color: #fff; border: 1px solid #555;
      padding: 4px 8px; border-radius: 4px; font-size: 11px;
      cursor: pointer; font-family: inherit;
    }
    #debugControls button:hover { background: #4a4a4a; }
    #debugControls button.primary { background: #1a73e8; border-color: #1a73e8; }
    #debugControls button.danger { background: #b00020; border-color: #b00020; }
    #debugBody { overflow-y: auto; padding: 6px 0; flex: 1; min-height: 120px; max-height: 50vh; }
    .logLine {
      padding: 2px 10px; border-left: 3px solid transparent;
      white-space: pre-wrap; word-break: break-all;
      font-size: 11px; line-height: 1.4;
    }
    .logLine.info { border-color: #1a73e8; color: #d0d0d0; }
    .logLine.ok   { border-color: #2a7d2a; color: #7dff7d; }
    .logLine.warn { border-color: #d6a500; color: #ffd76e; }
    .logLine.err  { border-color: #d62828; color: #ff8c8c; }
    .logLine .time { color: #777; margin-right: 4px; }
    .logLine .tag  { color: #888; }
    .mapillary-popup { max-width: 340px; font-size: 13px; }
    .mapillary-popup img { width: 100%; border-radius: 6px; margin-top: 6px; }
    .mapillary-popup .meta { color: #555; font-size: 11px; margin-top: 4px; }
    .mapillary-popup .loading { color: #888; font-style: italic; }
    .mapillary-popup .error { color: #c00; }
  </style>
</head>
<body>

<div id="map"></div>
<div id="legend">
  <b>Chú thích</b>
  <div><span class="dot" style="background:#d62828"></span>Regulatory</div>
  <div><span class="dot" style="background:#fcbf49"></span>Warning</div>
  <div><span class="dot" style="background:#003049"></span>Info / Complementary</div>
</div>

<div id="debugPanel">
  <div id="debugHeader">
    <b>🐞 Debug</b>
    <span class="state" id="mapState">waiting</span>
    <span class="badge zero" id="errBadge">0 lỗi</span>
  </div>
  <div id="debugControls">
    <button class="primary" id="btnTest">▶ Test API</button>
    <button id="btnReloadIcons">↻ Reload icons</button>
    <button id="btnTestIcon">🧪 Test 1 icon</button>
    <button class="danger" id="btnClear">🗑 Xoá log</button>
    <button id="btnCopy">📋 Copy log</button>
  </div>
  <div id="debugBody"></div>
</div>

<script>
/* ============ 1. CONFIG ============ */
const MAPILLARY_TOKEN = 'MLY|29249168751358312|a5696ee10fc78ffba69a9a34515c63a8';
const MAPTILER_STYLE_URL =
  'https://api.maptiler.com/maps/streets-v4/style.json?key=aEzMCP0ANRz52vd1RvrW';
const SIGN_ICON_BASE =
  'https://cdn.jsdelivr.net/gh/worldoftankblizt1234-wq/drivekit@main/map/mapillary_signs';

/* ============ 2. LOGGER ============ */
const logBody = document.getElementById('debugBody');
const errBadge = document.getElementById('errBadge');
const mapStateEl = document.getElementById('mapState');
let errCount = 0;
const allLogs = [];

function log(level, tag, ...msg) {
  const t = new Date().toLocaleTimeString('vi-VN', { hour12: false });
  const text = msg.map(m => typeof m === 'object' ? JSON.stringify(m) : String(m)).join(' ');
  const line = document.createElement('div');
  line.className = 'logLine ' + level;
  line.innerHTML = `<span class="time">${t}</span><span class="tag">[${tag}]</span> ${escapeHtml(text)}`;
  logBody.appendChild(line);
  logBody.scrollTop = logBody.scrollHeight;
  allLogs.push(`[${t}] [${level.toUpperCase()}] [${tag}] ${text}`);
  if (level === 'err') {
    errCount++;
    errBadge.textContent = `${errCount} lỗi`;
    errBadge.classList.remove('zero');
  }
  while (logBody.children.length > 500) logBody.removeChild(logBody.firstChild);
  const fn = level === 'err' ? console.error : level === 'warn' ? console.warn : console.log;
  fn(`[${tag}]`, ...msg);
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function setMapState(s) {
  mapStateEl.textContent = s;
  mapStateEl.classList.toggle('ready', s === 'ready');
}
log('info', 'boot', 'Debug panel ready');

/* ============ 3. MAP ============ */
log('info', 'map', 'Khởi tạo MapLibre…');
const map = new maplibregl.Map({
  container: 'map',
  style: MAPTILER_STYLE_URL,
  center: [105.85, 21.03],
  zoom: 16
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

map.on('error', (e) => {
  const msg = e?.error?.message || String(e?.error || e);
  log('err', 'map', msg);
});
map.on('style.load', () => {
  setMapState('style');
  log('ok', 'map', 'style.load event');
});

/* ============ 4. ICON MANAGER – FIX: dùng <img> thay vì map.loadImage ============ */
const DEFAULT_SIGN_SVG =
  '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
  '<circle cx="16" cy="16" r="14" fill="#e63946" stroke="#ffffff" stroke-width="2.5"/></svg>';

const CATEGORY_COLORS = {
  regulatory: '#d62828', warning: '#fcbf49',
  information: '#003049', complementary: '#003049'
};
const loadedIcons = new Set();
const loadingIcons = new Map();
const failedIcons = new Set();

function svgToDataUri(svg) {
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function makeFallbackSvg(v) {
  const cat = (v || '').split('--')[0] || 'regulatory';
  const color = CATEGORY_COLORS[cat] || '#e63946';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
    `<circle cx="16" cy="16" r="14" fill="${color}" stroke="#fff" stroke-width="2.5"/>` +
    '<circle cx="16" cy="16" r="8" fill="#fff" fill-opacity="0.25"/></svg>';
}

/**
 * *** FIX CHÍNH ***
 * MapLibre v4's loadImage() dùng createImageBitmap → không decode được SVG.
 * Dùng <img> element native để decode SVG (hỗ trợ đầy đủ).
 */
function loadSvgAsImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Decode fail: ${url}`));
    img.src = url;
  });
}

async function loadIconForSign(objectValue) {
  if (!objectValue) return;
  if (loadedIcons.has(objectValue)) return;
  if (loadingIcons.has(objectValue)) return loadingIcons.get(objectValue);

  const promise = (async () => {
    const url = `${SIGN_ICON_BASE}/${objectValue}.svg`;
    try {
      const img = await loadSvgAsImage(url);
      if (!map.hasImage(objectValue)) {
        map.addImage(objectValue, img, { sdf: false });
      }
      loadedIcons.add(objectValue);
      log('ok', 'icon', `✓ ${objectValue} (${img.naturalWidth}×${img.naturalHeight})`);
    } catch (err) {
      failedIcons.add(objectValue);
      log('warn', 'icon', `✗ ${objectValue} (${err.message}) → fallback`);
      try {
        const fbImg = await loadSvgAsImage(svgToDataUri(makeFallbackSvg(objectValue)));
        if (!map.hasImage(objectValue)) {
          map.addImage(objectValue, fbImg, { sdf: false });
        }
        loadedIcons.add(objectValue);
      } catch (e2) {
        log('err', 'icon', `fallback fail ${objectValue}: ${e2.message}`);
      }
    } finally {
      loadingIcons.delete(objectValue);
    }
  })();

  loadingIcons.set(objectValue, promise);
  return promise;
}

/* ============ 5. LOAD ============ */
map.on('load', async () => {
  window._mapReady = true;
  setMapState('ready');
  log('ok', 'map', 'load event fired – _mapReady = true');

  try {
    // default icon – cũng dùng <img>, không dùng map.loadImage
    try {
      const defaultImg = await loadSvgAsImage(svgToDataUri(DEFAULT_SIGN_SVG));
      if (!map.hasImage('default-sign')) {
        map.addImage('default-sign', defaultImg, { sdf: false });
      }
      log('ok', 'icon', `default-sign đã thêm (${defaultImg.naturalWidth}×${defaultImg.naturalHeight})`);
    } catch (e) {
      log('err', 'icon', 'default-sign fail: ' + e.message);
    }

    // source
    if (!map.getSource('traffic-signs')) {
      map.addSource('traffic-signs', {
        type: 'vector',
        tiles: [
          `https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${MAPILLARY_TOKEN}`
        ],
        minzoom: 0, maxzoom: 14
      });
      log('ok', 'src', 'traffic-signs source đã thêm');
    }

    // layer
    if (!map.getLayer('traffic-signs-layer')) {
      map.addLayer({
        id: 'traffic-signs-layer',
        type: 'symbol',
        source: 'traffic-signs',
        'source-layer': 'traffic_sign',
        layout: {
          'icon-image': [
            'coalesce',
            ['image', ['get', 'object_value']],
            ['image', ['get', 'value']],
            'default-sign'
          ],
          'icon-size': ['interpolate', ['linear'], ['zoom'], 12, 0.35, 15, 0.55, 18, 0.8],
          'icon-allow-overlap': true,
          'icon-anchor': 'bottom',
          'icon-padding': 2
        }
      });
      log('ok', 'layer', 'traffic-signs-layer đã thêm');
    }

    map.on('styleimagemissing', (e) => {
      const id = e.id;
      if (!id || id === 'default-sign') return;
      if (map.hasImage(id)) return;
      if (id.includes('--')) loadIconForSign(id);
    });

    let lastCount = -1;
    map.on('sourcedata', (e) => {
      if (e.sourceId !== 'traffic-signs' || !e.isSourceLoaded) return;
      const feats = map.querySourceFeatures('traffic-signs', { sourceLayer: 'traffic_sign' });
      const uniq = new Set();
      feats.forEach(f => uniq.add(f.properties.id || f.id));
      if (uniq.size !== lastCount) {
        lastCount = uniq.size;
        log('info', 'signs', `${uniq.size} signs trong view (z=${map.getZoom().toFixed(1)})`);
        const seen = new Set();
        feats.forEach(f => {
          const v = f.properties.object_value || f.properties.value;
          if (v && !seen.has(v)) { seen.add(v); loadIconForSign(v); }
        });
      }
    });

    // click
    map.on('click', 'traffic-signs-layer', async (e) => {
      const f = e.features[0];
      const id = f.properties.id;
      const signType = f.properties.object_value || f.properties.value || 'unknown';
      log('info', 'click', `sign id=${id} type=${signType}`);

      const popup = new maplibregl.Popup({ maxWidth: '360px' })
        .setLngLat(e.lngLat)
        .setHTML(`<div class="mapillary-popup"><div class="loading">Đang tải ảnh…</div></div>`)
        .addTo(map);

      try {
        const ids = await fetchMapFeatureImages(id);
        if (!ids.length) {
          log('warn', 'api', `map feature ${id} không có images`);
          popup.setHTML(`<div class="mapillary-popup error">Không tìm thấy ảnh.</div>`);
          return;
        }
        const img = await fetchImageThumbnail(ids[0]);
        log('ok', 'api', `ảnh OK`);
        popup.setHTML(`
          <div class="mapillary-popup">
            <strong>${signType}</strong><br>
            <img src="${img.thumb_1024_url}" alt="Mapillary" />
            <div class="meta">
              📍 ${id}<br>
              🕒 ${img.captured_at ? new Date(img.captured_at).toLocaleString('vi-VN') : '—'}<br>
              🧭 ${img.compass_angle ?? '—'}°
            </div>
          </div>
        `);
      } catch (err) {
        log('err', 'api', err.message || err);
        popup.setHTML(`<div class="mapillary-popup error">Lỗi: ${err.message}</div>`);
      }
    });

    map.on('mouseenter', 'traffic-signs-layer', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'traffic-signs-layer', () => map.getCanvas().style.cursor = '');

    log('ok', 'setup', 'Sẵn sàng');
  } catch (err) {
    log('err', 'setup', 'Lỗi: ' + (err.message || err));
    console.error(err);
  }
});

/* ============ 6. BUTTONS ============ */
document.getElementById('debugHeader').onclick = () =>
  document.getElementById('debugPanel').classList.toggle('collapsed');

document.getElementById('btnClear').onclick = () => {
  logBody.innerHTML = '';
  allLogs.length = 0;
  errCount = 0;
  errBadge.textContent = '0 lỗi';
  errBadge.classList.add('zero');
};

document.getElementById('btnCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(allLogs.join('\n'));
    log('ok', 'debug', 'Đã copy log');
  } catch {
    log('err', 'debug', 'Copy fail');
  }
};

document.getElementById('btnReloadIcons').onclick = async () => {
  log('info', 'debug', 'Reload icons…');
  for (const id of Array.from(loadedIcons)) {
    if (map.hasImage(id)) map.removeImage(id);
  }
  loadedIcons.clear();
  failedIcons.clear();
  if (map.getSource('traffic-signs')) {
    const feats = map.querySourceFeatures('traffic-signs', { sourceLayer: 'traffic_sign' });
    const seen = new Set();
    for (const f of feats) {
      const v = f.properties.object_value || f.properties.value;
      if (v && !seen.has(v)) { seen.add(v); await loadIconForSign(v); }
    }
    log('ok', 'debug', `Đã reload ${seen.size} icon types`);
  }
};

document.getElementById('btnTest').onclick = async () => {
  log('info', 'test', '=== TEST API ===');
  const styleOk = map.isStyleLoaded();
  const sourceOk = !!map.getSource('traffic-signs');
  const layerOk = !!map.getLayer('traffic-signs-layer');
  log('info', 'test', `style=${styleOk} source=${sourceOk} layer=${layerOk} flag=${window._mapReady === true}`);
  if (!styleOk || !sourceOk || !layerOk) {
    log('err', 'test', 'Map/layer chưa sẵn sàng');
    return;
  }
  const feats = map.querySourceFeatures('traffic-signs', { sourceLayer: 'traffic_sign' });
  if (!feats.length) {
    log('warn', 'test', 'Không có sign nào trong view');
    return;
  }
  const f = feats[0];
  const id = f.properties.id;
  const signType = f.properties.object_value || f.properties.value;
  log('info', 'test', `Sign mẫu: id=${id} type=${signType}`);

  // icon test – dùng fetch để xem HTTP status, rồi thử decode bằng <img>
  try {
    const r = await fetch(`${SIGN_ICON_BASE}/${signType}.svg`);
    log(r.ok ? 'ok' : 'err', 'test', `  icon HTTP ${r.status}`);
    if (r.ok) {
      const txt = await r.text();
      log('info', 'test', `  ${txt.length} chars, bắt đầu: ${txt.slice(0, 60).replace(/\n/g, ' ')}`);
    }
  } catch (e) { log('err', 'test', `  icon fetch fail: ${e.message}`); }

  try {
    const r = await fetch(`https://graph.mapillary.com/${id}?access_token=${MAPILLARY_TOKEN}&fields=images`);
    const j = await r.json();
    log(r.ok ? 'ok' : 'err', 'test', `  Graph ${r.status} → images=${j.images?.length ?? '?'}`);
    if (j.images?.[0]) {
      const r2 = await fetch(`https://graph.mapillary.com/${j.images[0]}?access_token=${MAPILLARY_TOKEN}&fields=thumb_1024_url,captured_at,compass_angle`);
      const j2 = await r2.json();
      log(r2.ok ? 'ok' : 'err', 'test', `  Image ${r2.status} → ${j2.thumb_1024_url ? 'có thumb' : 'không thumb'}`);
    }
  } catch (e) { log('err', 'test', `  graph fail: ${e.message}`); }

  try {
    const z = Math.min(14, Math.floor(map.getZoom()));
    const { x, y } = lngLatToTile(map.getCenter(), z);
    const url = `https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/${z}/${x}/${y}?access_token=${MAPILLARY_TOKEN}`;
    const r = await fetch(url);
    const buf = await r.arrayBuffer();
    log(r.ok ? 'ok' : 'err', 'test', `  tile ${z}/${x}/${y} → ${r.status} (${buf.byteLength} bytes)`);
  } catch (e) { log('err', 'test', `  tile fail: ${e.message}`); }

  log('info', 'test', '=== HẾT ===');
};

document.getElementById('btnTestIcon').onclick = async () => {
  const v = prompt('object_value để test:', 'regulatory--stop--g1');
  if (!v) return;
  log('info', 'test', `Test icon: ${v}`);
  try {
    const r = await fetch(`${SIGN_ICON_BASE}/${v}.svg`);
    if (!r.ok) { log('err', 'test', `  HTTP ${r.status}`); return; }
    const txt = await r.text();
    log('ok', 'test', `  HTTP 200, ${txt.length} chars, ct=${r.headers.get('content-type')}`);
    // thử decode bằng <img>
    try {
      const img = await loadSvgAsImage(`${SIGN_ICON_BASE}/${v}.svg`);
      log('ok', 'test', `  Decode OK: ${img.naturalWidth}×${img.naturalHeight}`);
    } catch (e) {
      log('err', 'test', `  Decode fail: ${e.message}`);
    }
  } catch (e) { log('err', 'test', `  fetch fail: ${e.message}`); }
};

function lngLatToTile({ lng, lat }, z) {
  const n = Math.pow(2, z);
  const x = Math.floor(n * (lng + 180) / 360);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor(n * (1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2);
  return { x, y };
}

/* ============ 7. GRAPH API ============ */
async function fetchMapFeatureImages(id) {
  const url = `https://graph.mapillary.com/${id}?access_token=${MAPILLARY_TOKEN}&fields=images`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Map feature API ${r.status}`);
  return (await r.json()).images || [];
}
async function fetchImageThumbnail(id) {
  const url = `https://graph.mapillary.com/${id}?access_token=${MAPILLARY_TOKEN}&fields=thumb_1024_url,captured_at,compass_angle`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Image API ${r.status}`);
  return await r.json();
}
</script>

</body>
</html>
