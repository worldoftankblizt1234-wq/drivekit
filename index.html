<!DOCTYPE html>
<html>
<body>
    <h2>Kiểm tra Foursquare API Key</h2>
    <button onclick="testKey()">Bấm để Test Key</button>
    <pre id="result" style="background: #eee; padding: 10px; margin-top: 10px;">Chưa có kết quả...</pre>

    <script>
        async function testKey() {
            const key = 'OZ4V35PQYDWISQTVSR4PUQ4TAJDDRBKY4SON2UGWL333DX33';
            const url = 'https://places-api.foursquare.com/places/search?query=cafe&ll=21.0285,105.8542&limit=2';
            const resultEl = document.getElementById('result');
            
            resultEl.innerText = 'Đang gọi API...';

            try {
                const res = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + key,
                        'X-Places-Api-Version': '2025-06-17',
                        'Accept': 'application/json'
                    }
                });
                
                const text = await res.text();
                resultEl.innerText = 'Status Code: ' + res.status + '\n\nDữ liệu:\n' + text;
            } catch (e) {
                resultEl.innerText = 'Lỗi Fetch: ' + e.message;
            }
        }
    </script>
</body>
</html>
