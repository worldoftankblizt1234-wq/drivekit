<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapillary Traffic Signs Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        .leaflet-control-custom {
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .leaflet-control-custom:hover { background: #f0f0f0; }
        .status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-family: sans-serif;
            font-size: 13px;
            z-index: 1000;
            pointer-events: none;
        }
        .sign-icon {
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ----------------------------------------------------------------------
    // 1. Configuration
    // ----------------------------------------------------------------------
    const MAPILLARY_TOKEN = 'MLY|29249168751358312|a5696ee10fc78ffba69a9a34515c63a8';
    // Official Mapillary SVG source (the filenames are the object_value codes)
    const SVG_BASE = 'https://raw.githubusercontent.com/mapillary/mapillary_sprite_source/master/package_signs/';
    // Public OSM mirror (HOT style)
    const OSM_TILE_URL = 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png';
    const OSM_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles style by <a href="https://www.hotosm.org/">HOT</a>';

    // ----------------------------------------------------------------------
    // 2. Map setup
    // ----------------------------------------------------------------------
    const map = L.map('map').setView([51.505, -0.09], 14); // London default

    L.tileLayer(OSM_TILE_URL, {
        attribution: OSM_ATTRIBUTION,
        maxZoom: 19
    }).addTo(map);

    // Layer group to hold sign markers (so we can clear them easily)
    const signLayer = L.layerGroup().addTo(map);

    // ----------------------------------------------------------------------
    // 3. UI: custom control button
    // ----------------------------------------------------------------------
    const loadBtn = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function () {
            const div = L.DomUtil.create('div', 'leaflet-control-custom');
            div.innerHTML = '🚸 Load traffic signs in view';
            div.onclick = fetchSignsForView;
            return div;
        }
    });
    map.addControl(new loadBtn());

    // Status bar
    const statusEl = document.createElement('div');
    statusEl.className = 'status';
    statusEl.textContent = 'Ready';
    document.body.appendChild(statusEl);

    function setStatus(msg) {
        statusEl.textContent = msg;
    }

    // ----------------------------------------------------------------------
    // 4. Core: fetch signs for the current bounding box
    // ----------------------------------------------------------------------
    async function fetchSignsForView() {
        const bounds = map.getBounds();
        const sw = bounds.getSouthWest();
        const ne = bounds.getNorthEast();

        // bbox order: left, bottom, right, top (minLon, minLat, maxLon, maxLat)
        const bbox = `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`;

        // Check area size (Mapillary requires < 0.01 deg²)
        const area = (ne.lng - sw.lng) * (ne.lat - sw.lat);
        if (area > 0.01) {
            setStatus('⚠️ Area too large. Zoom in a bit more (bbox must be < 0.01 deg²).');
            return;
        }

        setStatus('⏳ Fetching traffic signs…');
        signLayer.clearLayers();

        const url = `https://graph.mapillary.com/map_features` +
                    `?access_token=${encodeURIComponent(MAPILLARY_TOKEN)}` +
                    `&fields=object_value,geometry` +
                    `&bbox=${bbox}` +
                    `&object_values=traffic_sign` +
                    `&limit=2000`;

        try {
            const resp = await fetch(url);
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`HTTP ${resp.status}: ${text}`);
            }
            const json = await resp.json();
            const features = json.data || [];

            if (features.length === 0) {
                setStatus('ℹ️ No traffic signs found in this area.');
                return;
            }

            // Add each sign as a marker with its SVG icon
            features.forEach(f => {
                const coords = f.geometry?.coordinates;
                if (!coords || coords.length < 2) return;
                const [lng, lat] = coords;
                const objectValue = f.object_value;

                // Build SVG URL
                const svgUrl = `${SVG_BASE}${objectValue}.svg`;

                // Create a custom icon
                const icon = L.icon({
                    iconUrl: svgUrl,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -16],
                    className: 'sign-icon'
                });

                const marker = L.marker([lat, lng], { icon: icon });
                marker.bindPopup(`<b>${objectValue}</b><br><img src="${svgUrl}" width="48" height="48" alt="${objectValue}">`);
                signLayer.addLayer(marker);
            });

            setStatus(`✅ Loaded ${features.length} traffic signs.`);
        } catch (err) {
            console.error(err);
            setStatus(`❌ Error: ${err.message}`);
        }
    }

    // ----------------------------------------------------------------------
    // 5. Optional: auto‑load when the map stops moving (if area is small enough)
    // ----------------------------------------------------------------------
    map.on('moveend', () => {
        const bounds = map.getBounds();
        const sw = bounds.getSouthWest();
        const ne = bounds.getNorthEast();
        const area = (ne.lng - sw.lng) * (ne.lat - sw.lat);
        if (area <= 0.01) {
            // Uncomment the next line if you want fully automatic loading
            // fetchSignsForView();
        }
    });
</script>
</body>
</html>
