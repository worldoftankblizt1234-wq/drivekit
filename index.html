<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1a73e8" />
<title>DriveKit Map — Bản đồ tài xế</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --primary: #1a73e8; --primary-dark: #1557b0; --danger: #e53935; --warn: #fb8c00;
    --bg: #ffffff; --text: #202124; --muted: #5f6368; --border: #e8eaed;
    --shadow: 0 4px 20px rgba(0,0,0,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text); }
  #map { position:absolute; inset:0; }
  button { font-family: inherit; }

  /* ============ AUTH SCREEN ============ */
  #auth-screen {
    position: fixed; inset:0; z-index:300;
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card {
    background:#fff; border-radius:16px; padding:28px;
    width:100%; max-width:400px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .auth-logo { font-size:36px; text-align:center; margin-bottom:8px; }
  .auth-card h1 { font-size:20px; margin:0 0 4px; text-align:center; }
  .auth-sub { font-size:13px; color: var(--muted); text-align:center; margin-bottom:20px; }

  .auth-tabs { display:flex; gap:4px; margin-bottom:16px; background:#f1f3f4; padding:4px; border-radius:8px; }
  .auth-tab { flex:1; padding:10px; border:none; background:transparent; border-radius:6px;
    cursor:pointer; font-size:13px; font-weight:500; color: var(--muted); transition: all .15s; }
  .auth-tab.active { background:#fff; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  .auth-form label { display:block; margin:10px 0; font-size:13px; font-weight:500; }
  .auth-form input {
    width:100%; padding:10px 12px; margin-top:4px; font-size:14px;
    border:1px solid var(--border); border-radius:8px; font-family: inherit;
    transition: border-color .15s;
  }
  .auth-form input:focus { outline:none; border-color: var(--primary); }

  .auth-divider { text-align:center; color: var(--muted); font-size:12px;
    margin:18px 0; position:relative; }
  .auth-divider::before, .auth-divider::after {
    content:""; position:absolute; top:50%; width:40%; height:1px; background: var(--border);
  }
  .auth-divider::before { left:0; }
  .auth-divider::after { right:0; }

  .btn-google {
    width:100%; padding:11px 14px; border:1px solid var(--border); background:#fff;
    border-radius:8px; cursor:pointer; font-size:14px; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition: background .15s;
  }
  .btn-google:hover { background:#f8f9fa; }
  .btn-google:disabled { opacity:.6; cursor:not-allowed; }

  .auth-error {
    color: var(--danger); font-size:12px; margin-top:12px;
    padding:8px; background:#fce8e6; border-radius:6px; display:none;
  }
  .auth-error.show { display:block; }

  /* ============ USER BADGE ============ */
  .user-badge {
    display:flex; align-items:center; gap:8px; padding:8px;
    background:#f8f9fa; border-radius:8px; margin-bottom:10px;
  }
  .user-avatar {
    width:36px; height:36px; border-radius:50%; background: var(--primary);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:14px; flex-shrink:0;
    background-size: cover; background-position: center;
  }
  .user-info { flex:1; min-width:0; }
  .user-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-email { font-size:11px; color: var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logout-btn {
    background:none; border:1px solid var(--border); padding:5px 10px;
    border-radius:6px; font-size:11px; cursor:pointer; color: var(--muted);
    white-space:nowrap;
  }
  .logout-btn:hover { background:#fce8e6; color: var(--danger); border-color:#fce8e6; }

  /* ============ PANELS ============ */
  .panel {
    position:absolute; z-index:10; background: rgba(255,255,255,.98);
    backdrop-filter: blur(10px);
    border-radius:12px; box-shadow: var(--shadow);
    font-size:13px; width:300px; max-height: calc(100vh - 24px);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel-left  { top:12px; left:12px; }
  .panel-right { top:12px; right:12px; }

  .panel-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; background:#f8f9fa; border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .panel-header h3 { margin:0; font-size:13px; text-transform:uppercase;
    letter-spacing:.5px; color: var(--muted); font-weight:600; }
  .panel-body { padding:12px 14px; overflow-y:auto; flex:1; }
  .panel h4 { margin:12px 0 6px; font-size:12px; color: var(--muted);
    text-transform:uppercase; font-weight:600; }
  .panel label { display:flex; align-items:center; gap:6px; margin:6px 0;
    cursor:pointer; user-select:none; }
  .panel label input[type=checkbox] { width:16px; height:16px; margin:0; accent-color: var(--primary); }
  .panel hr { border:0; border-top:1px solid var(--border); margin:12px 0; }
  .panel select, .panel input[type=text], .panel input:not([type]) {
    width:100%; padding:8px 10px; margin-top:4px;
    border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff;
  }
  .panel select:focus, .panel input:focus { outline:none; border-color: var(--primary); }

  .tabs { display:flex; gap:4px; margin-bottom:10px; }
  .tab { flex:1; padding:8px; background:#f1f3f4; border:none;
    border-radius:6px; cursor:pointer; font-size:12px; font-weight:500; color:var(--muted); }
  .tab.active { background: var(--primary); color:#fff; }

  .btn-primary, .btn-secondary, .btn-warn {
    padding:10px 14px; border-radius:6px; border:none; cursor:pointer;
    font-size:13px; font-weight:500; width:100%; margin-top:8px;
    transition: background .15s;
  }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-primary:disabled { background:#b0b8c4; cursor:not-allowed; }
  .btn-secondary { background:#f1f3f4; color: var(--text); }
  .btn-secondary:hover:not(:disabled) { background:#e4e7eb; }
  .btn-warn { background: var(--danger); color:#fff; }
  .btn-warn:hover:not(:disabled) { background:#c62828; }
  .icon-btn { background:none; border:none; font-size:18px; padding:2px 8px;
    cursor:pointer; color: var(--muted); border-radius:4px; }
  .icon-btn:hover { background:#e8eaed; }
  .btn-row { display:flex; gap:6px; }
  .btn-row button { flex:1; }

  .route-info {
    background:#e8f0fe; border-left:3px solid var(--primary);
    padding:8px 12px; margin:8px 0; border-radius:4px; font-size:12px; line-height:1.5;
  }
  .route-info b { color: var(--primary-dark); font-size:14px; }

  .item-list { max-height:280px; overflow-y:auto; }
  .item {
    padding:10px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:6px; display:flex; justify-content:space-between;
    align-items:center; gap:8px; background:#fff;
  }
  .item-title { font-weight:500; font-size:13px; margin-bottom:2px; }
  .item-sub { font-size:11px; color: var(--muted); }
  .item button { width:auto; margin:0; padding:6px 12px; font-size:12px; }
  .empty-state { padding:16px; text-align:center; color: var(--muted); font-size:12px; font-style:italic; }

  /* ============ MARKERS ============ */
  .dest-marker {
    width:20px; height:20px; background: var(--danger); border:3px solid #fff;
    border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,.5); cursor:pointer;
  }
  .user-marker {
    width:18px; height:18px; background: var(--primary); border:3px solid #fff;
    border-radius:50%; box-shadow:0 0 0 5px rgba(26,115,232,.25), 0 2px 6px rgba(0,0,0,.4);
  }
  .poi-marker, .alert-marker {
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer; transition: transform .15s;
  }
  .poi-marker:hover, .alert-marker:hover { transform: scale(1.15); }
  .member-marker {
    width:30px; height:30px; border-radius:50%; background: var(--warn);
    border:2px solid #fff; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer;
    background-size: cover; background-position: center;
  }

  .popup-content { min-width:200px; font-size:13px; }
  .popup-content b { display:block; margin-bottom:6px; font-size:14px; }
  .popup-content .coords { font-family: monospace; font-size:11px; color: var(--muted); margin:4px 0 8px; }
  .popup-content button { width:100%; margin-top:8px; padding:8px;
    border:none; border-radius:6px; background: var(--primary); color:#fff; cursor:pointer; font-weight:500; }

  /* ============ TOAST ============ */
  .toast {
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#202124; color:#fff; padding:12px 20px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s; z-index:50; max-width:90vw;
    text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============ MODAL ============ */
  .modal-bg {
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
    align-items:center; justify-content:center; z-index:100; padding:16px;
    backdrop-filter: blur(4px);
  }
  .modal {
    background:#fff; border-radius:12px; padding:20px;
    min-width:320px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { margin:0 0 16px; font-size:16px; }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }
  .modal-actions button { flex:1; }
  .modal label { display:block; margin:10px 0; font-size:13px; font-weight:500; }
  .modal input, .modal select, .modal textarea {
    width:100%; padding:8px 10px; margin-top:4px; font-size:14px;
    border:1px solid var(--border); border-radius:6px; font-family: inherit;
  }
  .modal textarea { resize: vertical; min-height:60px; }

  /* ============ CALL BAR ============ */
  #call-bar {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background: var(--primary); color:#fff; padding:12px 20px;
    border-radius:28px; display:flex; gap:12px; align-items:center;
    font-size:13px; z-index:50; box-shadow: 0 6px 24px rgba(26,115,232,.5);
  }
  #call-bar .icon-btn { color:#fff; background: rgba(255,255,255,.2); }

  /* ============ LOADER ============ */
  #loader {
    position:fixed; inset:0; background:rgba(255,255,255,.9);
    display:flex; align-items:center; justify-content:center;
    z-index:200; flex-direction:column; gap:12px;
  }
  .spinner {
    width:40px; height:40px; border:3px solid #e8eaed; border-top-color: var(--primary);
    border-radius:50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ MOBILE ============ */
  @media (max-width: 720px) {
    .panel { width: calc(100vw - 24px); max-width: 340px; }
    .panel-left { left:12px; right:12px; width:auto; max-width:none; }
    .panel-right { left:12px; right:12px; width:auto; max-width:none; top:auto; bottom:12px; max-height:50vh; }
    .auth-card { padding:24px 20px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">🚗</div>
    <h1>DriveKit Map</h1>
    <p class="auth-sub">Bản đồ cộng đồng cho tài xế Việt Nam</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login">Đăng nhập</button>
      <button class="auth-tab" data-auth-tab="register">Đăng ký</button>
    </div>

    <form class="auth-form" id="login-form">
      <label>Email
        <input type="email" id="login-email" autocomplete="email" required placeholder="ten@vidu.com" />
      </label>
      <label>Mật khẩu
        <input type="password" id="login-password" autocomplete="current-password" required minlength="6" placeholder="••••••" />
      </label>
      <button class="btn-primary" type="submit" id="login-submit">Đăng nhập</button>
    </form>

    <form class="auth-form" id="register-form" style="display:none">
      <label>Họ và tên
        <input type="text" id="register-name" autocomplete="name" required placeholder="Nguyễn Văn A" />
      </label>
      <label>Email
        <input type="email" id="register-email" autocomplete="email" required placeholder="ten@vidu.com" />
      </label>
      <label>Mật khẩu (≥6 ký tự)
        <input type="password" id="register-password" autocomplete="new-password" required minlength="6" placeholder="••••••" />
      </label>
      <button class="btn-primary" type="submit" id="register-submit">Tạo tài khoản</button>
    </form>

    <div class="auth-divider">hoặc</div>

    <button class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6C12.3 13 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.4 28.8c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6C.9 17.3 0 20.5 0 24s.9 6.7 2.6 10l7.8-5.2z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.6l-7.5-5.8c-2 1.4-4.7 2.3-7.8 2.3-6.4 0-11.7-3.5-13.6-8.2l-7.8 6C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Đăng nhập với Google
    </button>

    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ============ LOADER ============ -->
<div id="loader" class="show">
  <div class="spinner"></div>
  <div style="font-size:13px; color:#5f6368;">Đang tải…</div>
</div>

<!-- ============ LEFT PANEL ============ -->
<div class="panel panel-left" id="panel-left">
  <div class="panel-header">
    <h3>Điều khiển</h3>
    <button class="icon-btn" id="toggle-left">−</button>
  </div>
  <div class="panel-body">
    <div class="user-badge" id="user-badge" style="display:none;">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Tài xế</div>
        <div class="user-email" id="user-email">—</div>
      </div>
      <button class="logout-btn" id="logout-btn">Thoát</button>
    </div>

    <h4>Lớp bản đồ</h4>
    <label><input type="checkbox" id="tg-satellite" /> Ảnh vệ tinh (TrackAsia Hybrid)</label>
    <label><input type="checkbox" id="tg-mapillary" checked /> Ảnh đường phố Mapillary</label>
    <label><input type="checkbox" id="tg-traffic" /> Giao thông thời gian thực</label>

    <hr />
    <h4>Chỉ đường</h4>
    <label>Phương tiện
      <select id="profile-select">
        <option value="car">🚗 Ô tô</option>
        <option value="motorbike">🛵 Xe máy</option>
        <option value="walking">🚶 Đi bộ</option>
        <option value="truck">🚚 Xe tải</option>
      </select>
    </label>
    <div id="route-info" class="route-info" style="display:none;"></div>
    <button class="btn-secondary" id="clear-route" style="display:none;">Xóa tuyến</button>
    <button class="btn-secondary" id="share-route" style="display:none;">Chia sẻ tuyến đường</button>

    <hr />
    <button class="btn-primary" id="locate-me">📍 Định vị tôi</button>
  </div>
</div>

<!-- ============ RIGHT PANEL ============ -->
<div class="panel panel-right" id="panel-right">
  <div class="panel-header">
    <h3>Cộng đồng tài xế</h3>
    <button class="icon-btn" id="toggle-right">−</button>
  </div>
  <div class="panel-body">
    <div class="tabs">
      <button class="tab active" data-tab="poi">Địa điểm</button>
      <button class="tab" data-tab="alert">Cảnh báo</button>
      <button class="tab" data-tab="room">Phòng</button>
    </div>

    <div class="tab-content" data-tab="poi">
      <div class="btn-row"><button class="btn-primary" data-add="poi">+ Thêm địa điểm</button></div>
      <div id="poi-list" class="item-list" style="margin-top:10px;"></div>
    </div>

    <div class="tab-content" data-tab="alert" style="display:none">
      <div class="btn-row"><button class="btn-warn" data-add="alert">⚠ Báo cảnh báo</button></div>
      <div id="alert-list" class="item-list" style="margin-top:10px;"></div>
    </div>

    <div class="tab-content" data-tab="room" style="display:none">
      <div id="room-out">
        <h4 style="margin-top:0">Phòng công khai quanh đây (5km)</h4>
        <button class="btn-secondary" id="refresh-rooms">🔄 Làm mới</button>
        <div id="nearby-rooms" class="item-list" style="margin-top:8px;"></div>

        <h4>Tạo phòng mới</h4>
        <label>Tên phòng <input id="room-name" placeholder="VD: Đoàn đi Đà Lạt" /></label>
        <label><input type="checkbox" id="room-public" checked /> Công khai (bán kính 5km)</label>
        <button class="btn-primary" id="create-room">Tạo phòng</button>

        <h4>Tham gia bằng mã</h4>
        <input id="join-code" placeholder="Nhập mã 6 ký tự" maxlength="6"
               style="text-transform:uppercase; letter-spacing:2px; text-align:center; font-size:16px; font-weight:600;" />
        <button class="btn-secondary" id="join-room">Tham gia</button>

        <hr />
        <h4>Tài xế quanh đây</h4>
        <div id="nearby-users" class="item-list"></div>
      </div>

      <div id="room-in" style="display:none">
        <h4 style="margin-top:0" id="room-in-name">—</h4>
        <div id="room-in-info" class="route-info"></div>
        <h4>Thành viên</h4>
        <div id="room-members" class="item-list"></div>
        <button class="btn-secondary" id="leave-room">Rời phòng</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-bg" id="add-modal" style="display:none">
  <div class="modal">
    <h3 id="add-modal-title">Thêm</h3>
    <div id="add-modal-body"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="add-cancel">Hủy</button>
      <button class="btn-primary" id="add-confirm">Lưu</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="call-modal" style="display:none">
  <div class="modal">
    <h3 id="call-title">📞 Cuộc gọi đến</h3>
    <p id="call-desc" style="color:#5f6368;">—</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="call-reject">Từ chối</button>
      <button class="btn-primary" id="call-accept">Nghe</button>
    </div>
  </div>
</div>

<div id="call-bar" style="display:none">
  <span id="call-bar-text">Đang kết nối…</span>
  <button class="icon-btn" id="call-end">✖</button>
</div>

<audio id="remote-audio" autoplay></audio>
<div id="toast" class="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
/* ============================================================
   CẤU HÌNH
   ============================================================ */
const cfg = {
  trackasia: {
    key: "1792297789c0cf0ddb16e5446d7364580f",
    base: "https://maps.track-asia.com/styles/v2",
    styles: { streets: "streets", hybrid: "hybrid" }
  },
  mapillary: {
    token: "MLY|26842262835470842|df552a54c4d4735f048c7cccb365d6bb",
    tiles: "https://tiles.mapillary.com/maps/vtp/mly1_public/2/{z}/{x}/{y}"
  },
  tomtom: {
    key: "tG84Z1Yh4rauGWjz6pRn98rrWymLjTru",
    traffic: "https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png"
  },
  routing: {
    baseUrl: "https://alarming-crematorium-jjxv449rvxgghj6p5-8003.app.github.dev",
    profiles: { car:"driving", motorbike:"driving", walking:"walking", truck:"driving" },
    timeoutMs: 15000

/* ---------- presence ---------- */
function startPresence(uid, getPos) {
  onDisconnect(ref(db, `users/${uid}`)).remove();
  const push = () => {
    const pos = getPos();
    if (!pos) return;
    set(ref(db, `users/${uid}`), {
      lat: pos.lat, lng: pos.lng,
      displayName: myName(),
      photoURL: myPhoto(),
      geohash: geohashForLocation([pos.lat, pos.lng]),
      updatedAt: serverTimestamp()
    }).catch(() => {});
  };
  push();
  const timer = setInterval(push, 15000);
  return () => clearInterval(timer);
}

/* ---------- geo query ---------- */
async function queryGeo(node, center, radiusM) {
  const bounds = geohashQueryBounds([center.lat, center.lng], radiusM);
  const out = new Map();
  await Promise.all(bounds.map(async b => {
    const q = query(ref(db, node), orderByChild("geohash"), startAt(b[0]), endAt(b[1]));
    const snap = await get(q);
    snap.forEach(child => {
      const v = child.val();
      if (!v || v.lat == null || v.lng == null) return;
      const d = distanceBetween([v.lat, v.lng], [center.lat, center.lng]) * 1000;
      if (d <= radiusM) out.set(child.key, { id: child.key, ...v, _dist: d });
    });
  }));
  return [...out.values()];
}

/* ---------- rooms ---------- */
function newRoomCode() {
  const c = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  return Array.from({length:6}, () => c[Math.floor(Math.random()*c.length)]).join("");
}
async function createRoom(uid, { name, isPublic, lat, lng }) {
  const id = newRoomCode();
  await set(ref(db, `rooms/${id}`), {
    hostId: uid, hostName: myName(), hostOnline: true,
    name: name || "Phòng mới",
    isPublic: !!isPublic, lat, lng,
    geohash: geohashForLocation([lat, lng]),
    createdAt: Date.now()
  });
  await joinRoom(id, uid, lat, lng);
  return id;
}
async function joinRoom(roomId, uid, lat, lng) {
  await set(ref(db, `rooms/${roomId}/members/${uid}`), {
    lat, lng, displayName: myName(), photoURL: myPhoto(), joinedAt: Date.now()
  });
  onDisconnect(ref(db, `rooms/${roomId}/members/${uid}`)).remove();
  if (lat != null) set(ref(db, `users/${uid}/room`), roomId);
}
async function leaveRoom(roomId, uid) {
  await remove(ref(db, `rooms/${roomId}/members/${uid}`)).catch(() => {});
  await remove(ref(db, `users/${uid}/room`)).catch(() => {});
  const snap = await get(ref(db, `rooms/${roomId}/hostId`));
  if (snap.val() === uid) {
    await update(ref(db, `rooms/${roomId}`), { hostOnline: false }).catch(() => {});
  }
}
async function updateRoomLocation(roomId, uid, lat, lng) {
  await Promise.all([
    update(ref(db, `rooms/${roomId}/members/${uid}`), { lat, lng, updatedAt: Date.now() }).catch(() => {}),
    update(ref(db, `users/${uid}`), {
      lat, lng, geohash: geohashForLocation([lat, lng]), updatedAt: Date.now()
    }).catch(() => {})
  ]);
}
const getRoom = id => get(ref(db, `rooms/${id}`)).then(s => s.val());
const onRoom  = (id, cb) => onValue(ref(db, `rooms/${id}`), s => cb(s.val()));

/* ---------- calls ---------- */
const callIdFor = (a, b) => [a, b].sort().join("_");
const onCall = (id, cb) => onValue(ref(db, `calls/${id}`), s => cb(s.val()));
const writeCall = (id, p) => update(ref(db, `calls/${id}`), p);
async function endCall(id) {
  await update(ref(db, `calls/${id}`), { state: "ended" }).catch(() => {});
  await remove(ref(db, `calls/${id}`)).catch(() => {});
}
async function notifyCall(calleeUid, callId, fromName) {
  await set(ref(db, `inbox/${calleeUid}/${callId}`), {
    callId, from: myUid(), fromName: fromName || myName(), ts: Date.now()
  });
}
const clearNotify = (calleeUid, callId) =>
  remove(ref(db, `inbox/${calleeUid}/${callId}`)).catch(() => {});

/* ============================================================
   WEBRTC CALL MANAGER
   ============================================================ */
class CallManager {
  constructor(handlers = {}) {
    this.pc = null; this.callId = null; this.peerUid = null;
    this.unsub = null; this.handlers = handlers;
    this.audio = document.getElementById("remote-audio");
  }
  _createPC() {
    const pc = new RTCPeerConnection({ iceServers: cfg.iceServers });
    pc.onicecandidate = e => {
      if (e.candidate && this.callId) {
        writeCall(this.callId, {
          [`candidates/${myUid()}`]: JSON.stringify(e.candidate)
        }).catch(() => {});
      }
    };
    pc.ontrack = e => { this.audio.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") this.handlers.onState?.("Đã kết nối");
      else if (["failed","disconnected","closed"].includes(pc.connectionState)) this.end();
    };
    return pc;
  }
  async startCall(peerUid, peerName) {
    this.peerUid = peerUid;
    this.callId = callIdFor(myUid(), peerUid);
    this.pc = this._createPC();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    stream.getTracks().forEach(t => this.pc.addTrack(t, stream));
    const offer = await this.pc.createOffer();
    await this.pc.setLocalDescription(offer);
    await writeCall(this.callId, {
      from: myUid(), to: peerUid, fromName: myName(),
      offer: JSON.stringify(offer), state: "ringing", createdAt: Date.now()
    });
    await notifyCall(peerUid, this.callId, myName());
    this._listen();
    this.handlers.onState?.(`Đang gọi ${peerName || ""}…`);
  }
  async acceptCall(callData) {
    this.peerUid = callData.from;
    this.callId = callIdFor(callData.from, myUid());
    this.pc = this._createPC();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    stream.getTracks().forEach(t => this.pc.addTrack(t, stream));
    await this.pc.setRemoteDescription(JSON.parse(callData.offer));
    const answer = await this.pc.createAnswer();
    await this.pc.setLocalDescription(answer);
    await writeCall(this.callId, { answer: JSON.stringify(answer), state: "active" });
    if (callData.candidates?.[callData.from]) {
      try { await this.pc.addIceCandidate(JSON.parse(callData.candidates[callData.from])); } catch {}
    }
    this._listen();
    this.handlers.onState?.("Đã kết nối");
    await clearNotify(myUid(), this.callId);
  }
  _listen() {
    this.unsub = onCall(this.callId, async data => {
      if (!data) return;
      if (data.answer && this.pc?.signalingState === "have-local-offer") {
        try { await this.pc.setRemoteDescription(JSON.parse(data.answer)); } catch (e) { console.warn(e); }
      }
      const cand = data.candidates?.[this.peerUid];
      if (cand) {
        try {
          await this.pc.addIceCandidate(JSON.parse(cand));
          writeCall(this.callId, { [`candidates/${this.peerUid}`]: null }).catch(() => {});
        } catch {}
      }
      if (data.state === "ended") this._cleanup();
    });
  }
  end() {
    if (this.callId) {
      endCall(this.callId);
      if (this.peerUid) clearNotify(this.peerUid, this.callId);
    }
    this._cleanup();
  }
  _cleanup() {
    this.unsub?.(); this.unsub = null;
    if (this.pc) {
      this.pc.getSenders().forEach(s => s.track?.stop());
      this.pc.close();
    }
    this.pc = null; this.callId = null; this.peerUid = null;
    this.handlers.onEnd?.();
  }
}

function showAuthError(err) {
  const el = document.getElementById("auth-error");
  el.textContent = authErrorMsg(err);
  el.classList.add("show");
}
function clearAuthError() {
  document.getElementById("auth-error").classList.remove("show");
}
function setAuthBusy(busy) {
  ["login-submit","register-submit","google-btn"].forEach(id => {
    document.getElementById(id).disabled = busy;
  });
}

function setupAuthUI() {
  // Tab login/register
  document.querySelectorAll("[data-auth-tab]").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll("[data-auth-tab]").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      const tab = t.dataset.authTab;
      document.getElementById("login-form").style.display = tab === "login" ? "block" : "none";
      document.getElementById("register-form").style.display = tab === "register" ? "block" : "none";
      clearAuthError();
    };
  });

  // Login form
  document.getElementById("login-form").onsubmit = async e => {
    e.preventDefault();
    clearAuthError();
    setAuthBusy(true);
    try {
      const email = document.getElementById("login-email").value.trim();
      const pw = document.getElementById("login-password").value;
      await doLogin(email, pw);
      // onAuthStateChanged sẽ lo phần còn lại
    } catch (err) {
      console.error("[login]", err);
      showAuthError(err);
      setAuthBusy(false);
    }
  };

  // Register form
  document.getElementById("register-form").onsubmit = async e => {
    e.preventDefault();
    clearAuthError();
    setAuthBusy(true);
    try {
      const name = document.getElementById("register-name").value.trim();
      const email = document.getElementById("register-email").value.trim();
      const pw = document.getElementById("register-password").value;
      if (name.length < 2) throw { code: "custom/name", message: "Họ tên quá ngắn" };
      await doRegister(email, pw, name);
    } catch (err) {
      console.error("[register]", err);
      showAuthError(err);
      setAuthBusy(false);
    }
  };

  // Google
  document.getElementById("google-btn").onclick = async () => {
    clearAuthError();
    setAuthBusy(true);
    try {
      await doGoogleLogin();
    } catch (err) {
      console.error("[google]", err);
      showAuthError(err);
      setAuthBusy(false);
    }
  };

  // Logout
  document.getElementById("logout-btn").onclick = async () => {
    if (!confirm("Đăng xuất khỏi DriveKit?")) return;
    try {
      // Cleanup trước khi logout
      if (state.uid) {
        await remove(ref(db, `users/${state.uid}`)).catch(() => {});
        if (state.myRoom) await leaveRoom(state.myRoom, state.uid).catch(() => {});
      }
      state.presenceStop?.();
      await doLogout();
      location.reload();
    } catch (e) {
      toast("Lỗi đăng xuất: " + e.message);
    }
  };
}

const trackasiaStyle = name =>
  `${cfg.trackasia.base}/${name}.json?key=${cfg.trackasia.key}`;

function initMap() {
  if (state.appStarted) return;
  state.appStarted = true;

  state.map = new maplibregl.Map({
    container: "map",
    style: trackasiaStyle(cfg.trackasia.styles.streets),
    center: [105.8342, 21.0278],
    zoom: 13,
    attributionControl: false
  });

  state.map.addControl(new maplibregl.AttributionControl({
    compact: true, customAttribution: "© TrackAsia · © Mapillary · © TomTom"
  }), "bottom-right");
  state.map.addControl(new maplibregl.NavigationControl({
    showCompass: true, showZoom: true
  }), "bottom-left");

  state.map.on("load", () => {
    document.getElementById("loader").classList.remove("show");
    registerCustomLayers();
    setupClickHandler();
    setupUI();
    startLoops();
  });

  state.map.on("error", e => {
    if (e.error?.status === 0 || e.error?.message?.includes("Failed to fetch")) return;
    console.warn("[map error]", e.error);
  });

  state.map.on("styledata", () => {
    if (!state.map.isStyleLoaded()) return;
    if (!state.map.getSource("mapillary")) registerCustomLayers();
  });

  parseHash();
}

function registerCustomLayers() {
  const m = state.map;
  if (!m.getSource("traffic")) {
    m.addSource("traffic", {
      type: "raster",
      tiles: [`${cfg.tomtom.traffic}?key=${cfg.tomtom.key}`],
      tileSize: 256
    });
    m.addLayer({
      id: "traffic-layer", type: "raster", source: "traffic",
      layout: { visibility: state.trafficOn ? "visible" : "none" },
      paint: { "raster-opacity": 0.85 }
    });
  }
  if (!m.getSource("mapillary")) {
    m.addSource("mapillary", {
      type: "vector",
      tiles: [`${cfg.mapillary.tiles}?access_token=${encodeURIComponent(cfg.mapillary.token)}`],
      minzoom: 6, maxzoom: 14
    });
    m.addLayer({
      id: "mapillary-layer", type: "line", source: "mapillary",
      "source-layer": "sequence",
      layout: { visibility: state.mapillaryOn ? "visible" : "none" },
      paint: {
        "line-color": "#05cb63",
        "line-opacity": 0.65,
        "line-width": ["interpolate", ["linear"], ["zoom"], 6, 1, 14, 3]
      }
    });
  }
  if (!m.getSource("route")) {
    m.addSource("route", {
      type: "geojson",
      data: state.route
        ? { type: "Feature", geometry: state.route.geometry, properties: {} }
        : { type: "FeatureCollection", features: [] }
    });
    m.addLayer({
      id: "route-casing", type: "line", source: "route",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#000", "line-width": 8, "line-opacity": 0.3 }
    });
    m.addLayer({
      id: "route-line", type: "line", source: "route",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": "#1a73e8", "line-width": 5 }
    });
  }
}

async function switchBaseStyle(useSatellite) {
  if (state.styleSwapping) return;
  state.styleSwapping = true;
  document.getElementById("loader").classList.add("show");
  const styleName = useSatellite ? cfg.trackasia.styles.hybrid : cfg.trackasia.styles.streets;
  await new Promise(resolve => {
    const onLoad = () => { state.map.off("style.load", onLoad); resolve(); };
    state.map.on("style.load", onLoad);
    state.map.setStyle(trackasiaStyle(styleName));
  });
  registerCustomLayers();
  if (state.route) {
    state.map.getSource("route")?.setData({
      type: "Feature", geometry: state.route.geometry, properties: {}
    });
  }
  state.styleSwapping = false;
  document.getElementById("loader").classList.remove("show");
}

async function routeToSelected() {
  if (!state.selectedPoint) return toast("Chưa chọn điểm đích");
  const origin = state.userLocation || { lng: 105.8342, lat: 21.0278 };
  const dest = state.selectedPoint;
  try {
    toast("Đang tính tuyến đường…", 10000);
    const route = await fetchRoute(origin, dest, state.profile);
    drawRoute(route, origin, dest);
    toast("Đã tìm thấy tuyến");
  } catch (err) {
    console.error("[routing]", err);
    toast("Lỗi: " + err.message, 4000);
  }
}
async function fetchRoute(origin, dest, profile) {
  // OSRM yêu cầu {lng},{lat}
  const coords = `${origin.lng},${origin.lat};${dest.lng},${dest.lat}`;
  const osrmProfile = cfg.routing.profiles[profile] || "driving";
  const url = `${cfg.routing.baseUrl}/route/v1/${osrmProfile}/${coords}?overview=full&geometries=geojson&alternatives=false&steps=false`;
  console.log("[routing] GET", url);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), cfg.routing.timeoutMs);
  let res;
  try { res = await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(timer); }
  if (!res.ok) throw new Error(`Máy chủ định tuyến trả về HTTP ${res.status}`);
  const data = await res.json();
  console.log("[routing] response", data);
  if (!data.routes?.[0]) throw new Error(data.message || "Không tìm được tuyến đường");
  const r = data.routes[0];
  const distKm = r.distance / 1000;
  const straight = haversineKm(origin, dest);
  if (distKm > 500 && distKm > straight * 20) {
    console.warn(`[routing] ⚠ Bất thường: route=${distKm.toFixed(1)}km, thẳng=${straight.toFixed(1)}km`);
    if (!confirm(`Tuyến dài ${distKm.toFixed(0)} km — có vẻ sai.\n(Tuyến thẳng chỉ ${straight.toFixed(1)} km)\n\nVẫn tiếp tục?`)) {
      throw new Error("Đã hủy");
    }
  }
  return r;
}
function drawRoute(route, origin, dest) {
  const src = state.map.getSource("route");
  if (!src) return;
  state.route = {
    from: origin, to: dest, profile: state.profile,
    distance: route.distance, duration: route.duration, geometry: route.geometry
  };
  src.setData({ type: "Feature", geometry: route.geometry, properties: {} });
  const coords = route.geometry.coordinates;
  const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
  state.map.fitBounds(bounds, { padding: 80, duration: 800 });
  const distKm = (route.distance / 1000).toFixed(2);
  const durMin = Math.round(route.duration / 60);
  const veh = { car:"Ô tô", motorbike:"Xe máy", walking:"Đi bộ", truck:"Xe tải" }[state.profile];
  const ri = document.getElementById("route-info");
  ri.style.display = "block";
  ri.innerHTML = `<b>${distKm} km</b> · ~${durMin} phút<br><span style="color:#5f6368">${veh}</span>`;
  document.getElementById("clear-route").style.display = "block";
  document.getElementById("share-route").style.display = "block";
}
function clearRoute() {
  state.map.getSource("route")?.setData({ type: "FeatureCollection", features: [] });
  state.route = null;
  ["route-info","clear-route","share-route"].forEach(id => document.getElementById(id).style.display = "none");
  if (state.selectedMarker) { state.selectedMarker.remove(); state.selectedMarker = null; }
  state.selectedPoint = null;
  history.replaceState(null, "", location.pathname);
}

function togglePanel(id) {

  else { body.style.display = "none"; btn.textContent = "+"; }

/* ============================================================
   GEOLOCATION
   ============================================================ */
function applyGeo(lng, lat, fly = true) {
  state.userLocation = { lng, lat };
  if (fly && state.map) state.map.flyTo({ center: [lng, lat], zoom: 15 });
  if (state.userMarker) state.userMarker.remove();
  const el = document.createElement("div");
  el.className = "user-marker";
  state.userMarker = new maplibregl.Marker({ element: el })
    .setLngLat([lng, lat]).addTo(state.map);
}
function locateMe() {
  if (!navigator.geolocation) return toast("Trình duyệt không hỗ trợ định vị");
  toast("Đang định vị…");
  navigator.geolocation.getCurrentPosition(
    pos => { applyGeo(pos.coords.longitude, pos.coords.latitude); toast("Đã xác định vị trí"); },
    err => toast("Không lấy được vị trí: " + err.message),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function refreshCommunity() {
  const c = state.userLocation || { lng: 105.8342, lat: 21.0278 };
  try {
    const [pois, alerts] = await Promise.all([
      queryGeo("pois", c, 10000),
      queryGeo("alerts", c, 10000)
    ]);
    renderPois(pois);
    renderAlerts(alerts.filter(a => !a.expiresAt || a.expiresAt > Date.now()));
  } catch (e) { console.warn("[community]", e); }
}

function renderPois(pois) {
  const seen = new Set();
  const list = document.getElementById("poi-list");
  list.innerHTML = "";
  pois.forEach(p => {
    seen.add(p.id);
    if (!state.poiMarkers.has(p.id)) {
      const t = cfg.poiTypes[p.type] || cfg.poiTypes.other;
      const el = document.createElement("div");
      el.className = "poi-marker";
      el.style.background = t.color;
      el.textContent = t.icon;
      const mk = new maplibregl.Marker({ element: el })
        .setLngLat([p.lng, p.lat])
        .setPopup(new maplibregl.Popup({ offset: 20 }).setHTML(`
          <div class="popup-content">
            <b>${t.icon} ${escapeHtml(p.name)}</b>
            <div>${escapeHtml(p.description || "")}</div>
            <div class="coords">Thêm bởi ${escapeHtml(p.createdByName || "Tài xế")}</div>
            <button onclick="window.__sharePoi('${p.id}')">📤 Chia sẻ địa điểm</button>
          </div>`))
        .addTo(state.map);
      state.poiMarkers.set(p.id, mk);
    }
    const t = cfg.poiTypes[p.type] || cfg.poiTypes.other;
    list.innerHTML += `<div class="item"><div>
      <div class="item-title">${t.icon} ${escapeHtml(p.name)}</div>
      <div class="item-sub">${t.label} · ${fmtDist(p._dist)}</div>
    </div></div>`;
  });
  if (pois.length === 0) list.innerHTML = `<div class="empty-state">Chưa có địa điểm nào trong 10km</div>`;
  for (const [id, m] of state.poiMarkers) if (!seen.has(id)) { m.remove(); state.poiMarkers.delete(id); }
}

function renderAlerts(alerts) {
  const seen = new Set();
  const list = document.getElementById("alert-list");
  list.innerHTML = "";
  alerts.forEach(a => {
    seen.add(a.id);
    if (!state.alertMarkers.has(a.id)) {
      const t = cfg.alertTypes[a.type] || cfg.alertTypes.traffic;
      const el = document.createElement("div");
      el.className = "alert-marker";
      el.style.background = t.color;
      el.textContent = t.icon;
      const mk = new maplibregl.Marker({ element: el })
        .setLngLat([a.lng, a.lat])
        .setPopup(new maplibregl.Popup({ offset: 20 }).setHTML(`
          <div class="popup-content">
            <b>${t.icon} ${t.label}</b>
            <div>${escapeHtml(a.description || "Không có mô tả")}</div>
            <div class="coords">Bởi ${escapeHtml(a.createdByName || "Tài xế")} · ${new Date(a.expiresAt).toLocaleString("vi-VN")}</div>
          </div>`))
        .addTo(state.map);
      state.alertMarkers.set(a.id, mk);
    }
    const t = cfg.alertTypes[a.type] || cfg.alertTypes.traffic;
    list.innerHTML += `<div class="item"><div>
      <div class="item-title">${t.icon} ${t.label}</div>
      <div class="item-sub">${fmtDist(a._dist)} · ${escapeHtml(a.description || "")}</div>
    </div></div>`;
  });
  if (alerts.length === 0) list.innerHTML = `<div class="empty-state">Không có cảnh báo nào trong 10km</div>`;
  for (const [id, m] of state.alertMarkers) if (!seen.has(id)) { m.remove(); state.alertMarkers.delete(id); }

  modal.dataset.lng = lng;

function closeAddModal() { document.getElementById("add-modal").style.display = "none"; }
async function confirmAdd() {
  const modal = document.getElementById("add-modal");
  const kind = modal.dataset.kind;
  const lng = parseFloat(modal.dataset.lng);
  const lat = parseFloat(modal.dataset.lat);
  const type = document.getElementById("add-type").value;
  const desc = document.getElementById("add-desc").value.trim();
  try {
    if (kind === "poi") {
      const name = document.getElementById("add-name").value.trim() || "Không tên";
      await addPoi({ type, name, description: desc, lat, lng });
      toast("Đã thêm địa điểm");
    } else {
      const ttlHours = parseFloat(document.getElementById("add-ttl").value) || 2;
      await addAlert({ type, description: desc, lat, lng, ttlHours });
      toast("Đã thêm cảnh báo");
    }
    closeAddModal();
    refreshCommunity();
  } catch (e) {
    console.error(e);
    toast("Lỗi: " + e.message, 4000);
  }
}

async function refreshNearbyUsers() {
  const c = state.userLocation || { lng: 105.8342, lat: 21.0278 };
  try {
    const users = await queryGeo("users", c, 5000);
    const list = document.getElementById("nearby-users");
    const seen = new Set();
    const others = users.filter(u => u.id !== state.uid);
    list.innerHTML = others.map(u => {
      seen.add(u.id);
      const name = u.displayName || u.id.slice(0, 6);
      const initial = name.slice(0, 2).toUpperCase();
      const avatar = u.photoURL
        ? `<div class="user-avatar" style="width:28px;height:28px;background-image:url('${u.photoURL}')"></div>`
        : `<div class="user-avatar" style="width:28px;height:28px;font-size:11px">${initial}</div>`;
      const inRoom = u.room ? ` · 🏠 ${u.room}` : "";
      return `<div class="item" style="padding:8px">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          ${avatar}
          <div style="min-width:0">
            <div class="item-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(name)}${inRoom}</div>
            <div class="item-sub">${fmtDist(u._dist)}</div>
          </div>
        </div>
        <button class="btn-secondary"
          onclick="window.__callUser('${u.id}','${escapeAttr(name)}','${u.room||""}')">📞</button>
      </div>`;
    }).join("") || `<div class="empty-state">Không có tài xế nào trong 5km</div>`;

    others.forEach(u => {
      if (!state.userMarkers.has(u.id)) {
        const el = document.createElement("div");
        el.className = "member-marker";
        const name = u.displayName || u.id.slice(0, 2);
        if (u.photoURL) {
          el.style.backgroundImage = `url("${u.photoURL}")`;
        } else {
          el.textContent = name.slice(0, 2).toUpperCase();
        }
        el.title = name;
        const mk = new maplibregl.Marker({ element: el })
          .setLngLat([u.lng, u.lat]).addTo(state.map);
        state.userMarkers.set(u.id, mk);
      } else {
        state.userMarkers.get(u.id).setLngLat([u.lng, u.lat]);
      }
    });
    for (const [id, m] of state.userMarkers) if (!seen.has(id)) { m.remove(); state.userMarkers.delete(id); }
  } catch (e) { console.warn("[nearby]", e); }
}

window.__callUser = async (peerUid, peerName, roomId) => {
  if (roomId) {
    const room = await getRoom(roomId);
    if (!room || !room.hostOnline) return toast("Không thể gọi: host phòng đang offline");
  }
  startOutgoingCall(peerUid, peerName);
};

  } catch (e) { console.warn(e); toast("Lỗi tìm phòng"); }

window.__joinRoom = id => doJoinRoom(id);

async function createRoomUI() {
  if (!state.userLocation) return toast("Cần bật định vị trước khi tạo phòng");
  const name = document.getElementById("room-name").value.trim() || "Phòng mới";
  const isPublic = document.getElementById("room-public").checked;
  try {
    const id = await createRoom(state.uid, {
      name, isPublic, lat: state.userLocation.lat, lng: state.userLocation.lng
    });
    enterRoom(id);
    toast(`Đã tạo phòng: ${id}`);
  } catch (e) { toast("Lỗi tạo phòng: " + e.message); }
}
async function joinRoomByCode() {
  const code = document.getElementById("join-code").value.trim().toUpperCase();
  if (!code) return toast("Nhập mã phòng");
  doJoinRoom(code);
}
async function doJoinRoom(roomId) {
  if (!state.userLocation) return toast("Cần bật định vị trước");
  const room = await getRoom(roomId);
  if (!room) return toast("Phòng không tồn tại hoặc đã đóng");
  await joinRoom(roomId, state.uid, state.userLocation.lat, state.userLocation.lng);
  enterRoom(roomId);
  toast(`Đã vào phòng ${roomId}`);
}
function enterRoom(roomId) {
  state.myRoom = roomId;
  document.getElementById("room-out").style.display = "none";
  document.getElementById("room-in").style.display = "block";
  state.roomUnsub?.();
  state.roomUnsub = onRoom(roomId, room => {
    if (!room) { leaveMyRoom(); return; }
    document.getElementById("room-in-name").textContent = `🏠 ${room.name}`;
    document.getElementById("room-in-info").innerHTML = `
      Mã phòng: <b>${roomId}</b><br>
      Host: ${room.hostId === state.uid ? "Bạn" : escapeHtml(room.hostName || room.hostId.slice(0, 6))} · 
      ${room.isPublic ? "Công khai" : "Riêng tư"} · 
      ${room.hostOnline ? "🟢 Online" : "🔴 Offline"}`;
    renderRoomMembers(room);
  });
}
function renderRoomMembers(room) {
  const members = room.members || {};
  const list = document.getElementById("room-members");
  const seen = new Set();
  const entries = Object.entries(members);
  list.innerHTML = entries.map(([uid, m]) => {
    const isMe = uid === state.uid;
    const isHost = uid === room.hostId;
    const name = isMe ? "Bạn" : (m.displayName || uid.slice(0, 6));
    return `<div class="item"><div>
      <div class="item-title">👤 ${escapeHtml(name)} ${isHost ? "👑" : ""}</div>
      <div class="item-sub">${m.lat != null ? m.lat.toFixed(4) + ", " + m.lng.toFixed(4) : "—"}</div>
    </div>
    ${!isMe ? `<button class="btn-secondary" onclick="window.__callUser('${uid}','${escapeAttr(m.displayName || uid.slice(0,6))}','${state.myRoom}')">📞</button>` : ""}
    </div>`;
  }).join("");
  entries.forEach(([uid, m]) => {
    if (uid === state.uid || !m.lat) return;
    seen.add(uid);
    if (!state.memberMarkers.has(uid)) {
      const el = document.createElement("div");
      el.className = "member-marker";
      const name = m.displayName || uid.slice(0, 2);
      if (m.photoURL) el.style.backgroundImage = `url("${m.photoURL}")`;
      else el.textContent = name.slice(0, 2).toUpperCase();
      el.title = name;
      const mk = new maplibregl.Marker({ element: el })
        .setLngLat([m.lng, m.lat]).addTo(state.map);
      state.memberMarkers.set(uid, mk);
    } else {
      state.memberMarkers.get(uid).setLngLat([m.lng, m.lat]);
    }
  });
  for (const [id, m] of state.memberMarkers) if (!seen.has(id)) { m.remove(); state.memberMarkers.delete(id); }
}
async function leaveMyRoom() {
  if (!state.myRoom) return;
  const roomId = state.myRoom;
  await leaveRoom(roomId, state.uid).catch(() => {});
  state.roomUnsub?.();
  state.roomUnsub = null;
  state.myRoom = null;
  document.getElementById("room-in").style.display = "none";
  document.getElementById("room-out").style.display = "block";
  for (const [, m] of state.memberMarkers) m.remove();
  state.memberMarkers.clear();
  toast("Đã rời phòng");
}

function getCallManager() {
  if (state.callManager) return state.callManager;
  state.callManager = new CallManager({
    onState: text => {
      document.getElementById("call-bar").style.display = "flex";
      document.getElementById("call-bar-text").textContent = text;
    },
    onEnd: () => {
      document.getElementById("call-bar").style.display = "none";
      state.callManager = null;
    }
  });
  return state.callManager;
}
async function startOutgoingCall(peerUid, peerName) {
  try {
    toast(`Đang gọi ${peerName}…`);
    await getCallManager().startCall(peerUid, peerName);
  } catch (e) {
    console.error(e);
    toast("Lỗi gọi: " + e.message);
  }
}
function endActiveCall() {
  state.callManager?.end();
  state.callManager = null;
  document.getElementById("call-bar").style.display = "none";
}
function watchInbox() {
  state.inboxUnsub?.();
  state.inboxUnsub = onValue(ref(db, `inbox/${state.uid}`), snap => {
    if (state.callManager || state.pendingIncoming) return;
    let incoming = null;
    snap.forEach(child => { if (!incoming) incoming = { callId: child.key, ...child.val() }; });
    if (incoming) { state.pendingIncoming = incoming; showIncomingCall(incoming); }
  });
}
function showIncomingCall(data) {
  document.getElementById("call-title").textContent = "📞 Cuộc gọi đến";
  document.getElementById("call-desc").textContent = `${data.fromName || "Tài xế"} đang gọi bạn`;
  document.getElementById("call-modal").style.display = "flex";
}
async function acceptIncomingCall() {
  document.getElementById("call-modal").style.display = "none";
  if (!state.pendingIncoming) return;
  try {
    const snap = await get(ref(db, `calls/${state.pendingIncoming.callId}`));
    const callData = snap.val();
    if (!callData) { toast("Cuộc gọi đã kết thúc"); state.pendingIncoming = null; return; }
    await getCallManager().acceptCall(callData);
    state.pendingIncoming = null;
    document.getElementById("call-bar").style.display = "flex";
    document.getElementById("call-bar-text").textContent = "Đang trong cuộc gọi";
  } catch (e) {
    console.error(e);
    toast("Lỗi: " + e.message);
    state.pendingIncoming = null;
  }
}
async function rejectIncomingCall() {
  document.getElementById("call-modal").style.display = "none";
  if (state.pendingIncoming) {
    await endCall(state.pendingIncoming.callId).catch(() => {});
    await clearNotify(state.uid, state.pendingIncoming.callId).catch(() => {});
    state.pendingIncoming = null;
  }
}

/* ============================================================
   SHARE / DEEP LINK
   ============================================================ */
function shareRoute() {
  if (!state.route) return;
  const { from, to, profile } = state.route;
  const url = `${location.origin}${location.pathname}#route=${from.lng},${from.lat},${to.lng},${to.lat},${profile}`;
  navigator.clipboard.writeText(url).then(() => toast("Đã copy link tuyến đường"));
}
function parseHash() {
  const h = location.hash.slice(1);
  if (h.startsWith("route=")) {
    const [lng1, lat1, lng2, lat2, profile] = h.slice(6).split(",");
    if (lng1 && lat2) {
      state.profile = profile || "car";
      const sel = document.getElementById("profile-select");
      if (sel) sel.value = state.profile;
      setTimeout(() => {
        state.map?.flyTo({ center: [+lng2, +lat2], zoom: 13 });
        setSelectedPoint(+lng2, +lat2);
      }, 1000);
    }
  } else if (h.startsWith("poi=")) {
    const id = h.slice(4);
    getPoi(id).then(p => {
      if (!p) return toast("Địa điểm không tồn tại");
      state.map?.flyTo({ center: [p.lng, p.lat], zoom: 16 });
      setTimeout(() => setSelectedPoint(p.lng, p.lat), 800);
    });
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function toast(msg, ms = 2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), ms);
}
function haversineKm(a, b) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmtDist(m) {
  if (m == null) return "—";
  return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function escapeAttr(s) {
  return String(s ?? "").replace(/'/g, "\\'").replace(/"/g, '\\"');
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
function onUserSignedIn(user) {
  state.uid = user.uid;
  renderUserBadge(user);
  hideAuthScreen();

  // Geolocation sớm
  navigator.geolocation?.getCurrentPosition(
    pos => applyGeo(pos.coords.longitude, pos.coords.latitude, false),
    () => {},
    { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
  );

  state.presenceStop?.();
  state.presenceStop = startPresence(user.uid, () => state.userLocation);

  watchInbox();
  initMap();
}

function onUserSignedOut() {
  state.uid = null;
  state.presenceStop?.();
  state.presenceStop = null;
  state.inboxUnsub?.();
  state.inboxUnsub = null;
  state.callManager?.end();
  state.callManager = null;
  showAuthScreen();
  setAuthBusy(false);
}

function bootstrap() {
  setupAuthUI();

  // Ẩn loader, hiện auth screen ngay lập tức trong lúc chờ Firebase
  document.getElementById("loader").classList.remove("show");
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("panel-left").style.display = "none";
  document.getElementById("panel-right").style.display = "none";

  onAuthStateChanged(auth, user => {
    if (user) onUserSignedIn(user);
    else onUserSignedOut();
  });
}

bootstrap();
</script>
