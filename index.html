<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>DriveKit — Mọi hành trình, một giải pháp</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Fira+Code:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
<script>
  if (window.location.search.includes('debug=1')) window.vConsole = new window.VConsole();
</script>

<style>
/* === RESET & BIẾN === */
:root {
  --bg: #0f172a; --card: #1e293b; --card-2: #334155; --border: #334155;
  --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; --success: #10b981;
  --danger: #ef4444; --warning: #f59e0b; --voice: #8b5cf6;
  --font: 'Be Vietnam Pro', sans-serif; --mono: 'Fira Code', monospace;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.light-mode { --bg: #f8fafc; --card: #fff; --card-2: #f1f5f9; --border: #cbd5e1; --text: #0f172a; --muted: #64748b; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); background: var(--bg); color: var(--text); user-select: none; transition: 0.3s; }
button, input { font-family: inherit; outline: none; border: none; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* === FAB BUTTONS === */
.fab { position: fixed; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: 0.2s; }
.fab:active { transform: scale(0.92); }
.fab.primary { background: var(--primary); color: #fff; bottom: calc(20px + var(--safe-bottom)); right: 16px; }
.fab.white { background: var(--card); border: 1px solid var(--border); color: var(--text); bottom: calc(20px + var(--safe-bottom)); left: 16px; }
.fab.layers { background: var(--card); border: 1px solid var(--border); color: var(--text); bottom: calc(80px + var(--safe-bottom)); left: 16px; }
.fab.pin { background: var(--success); color: #fff; bottom: calc(140px + var(--safe-bottom)); right: 16px; }
.fab.report { background: linear-gradient(135deg, var(--danger), #f97316); color: #fff; bottom: calc(80px + var(--safe-bottom)); right: 16px; }
.fab.bed { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; bottom: calc(200px + var(--safe-bottom)); right: 16px; border: 2px solid #fff; }
.fab.bed.active { background: linear-gradient(135deg, #10b981, #059669); }

/* === MAP & OVERLAYS === */
#map { position: fixed; inset: 0; z-index: 1; background: #e5e5e5; touch-action: none !important; }
.leaflet-popup-content-wrapper { background: var(--card) !important; color: var(--text) !important; border-radius: 12px !important; border: 1px solid var(--border) !important; }
.leaflet-popup-tip { background: var(--card) !important; }

/* === SEARCH BAR === */
.search-bar { position: fixed; top: calc(16px + var(--safe-top)); left: 16px; right: 60px; z-index: 1000; background: var(--card); border-radius: 24px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--border); }
.search-bar input { flex: 1; background: transparent; color: var(--text); font-size: 0.9rem; font-weight: 600; }
.search-bar i { color: var(--primary); font-size: 1.1rem; }
.btn-menu-top { position: fixed; top: calc(16px + var(--safe-top)); right: 16px; z-index: 1000; width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

/* === SUGGESTIONS === */
.sug-box { position: fixed; top: calc(70px + var(--safe-top)); left: 16px; right: 16px; z-index: 1200; background: var(--card); border-radius: 12px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border); display: none; }
.sug-box.show { display: block; }
.sug-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--text); cursor: pointer; }
.sug-item:hover { background: var(--card-2); }
.sug-title { padding: 8px 16px; font-size: 0.7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; background: var(--card-2); border-bottom: 1px solid var(--border); }

/* === DIRECTION SHEET === */
.dir-sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1500; background: var(--card); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 12px 16px calc(12px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 -10px 30px rgba(0,0,0,0.2); }
.dir-sheet.open { transform: translateY(0); }
.dir-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 12px; }
.input-group { display: flex; align-items: center; gap: 10px; background: var(--card-2); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
.input-group input { flex: 1; background: transparent; color: var(--text); font-size: 0.9rem; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.start { background: var(--success); }
.dot.end { background: var(--danger); }
.btn-close-input { color: var(--muted); font-size: 0.9rem; padding: 4px; }

/* === VEHICLE TABS === */
.v-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin: 8px 0; scrollbar-width: none; }
.v-tabs::-webkit-scrollbar { display: none; }
.v-btn { flex-shrink: 0; padding: 8px 12px; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-weight: 700; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.v-btn.active { background: var(--primary); color: #fff; border-color: transparent; }

/* === ROUTE OPTIONS === */
.modal-sheet { position: fixed; inset: 0; z-index: 2500; background: var(--bg); display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease-in-out; }
.modal-sheet.open { transform: translateY(0); }
.modal-header { padding: calc(20px + var(--safe-top)) 20px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); }
.modal-body { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.route-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
.route-card.active { border-color: var(--primary); }
.route-card h3 { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
.route-card p { font-size: 0.85rem; color: var(--muted); }

/* === HUD (NAVIGATION) === */
.hud-top { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: calc(10px + var(--safe-top)) 12px 10px; display: flex; gap: 8px; pointer-events: none; }
.hud-stat { flex: 1; background: rgba(15,23,42,0.9); border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; pointer-events: auto; }
.hud-stat .label { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.hud-stat .val { font-size: 0.95rem; font-weight: 800; font-family: var(--mono); }
.hud-btn-end { background: var(--danger); color: #fff; border-radius: 12px; padding: 6px 10px; font-size: 0.6rem; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
.hud-next { position: fixed; top: calc(70px + var(--safe-top)); left: 12px; right: 12px; z-index: 500; background: linear-gradient(135deg, var(--primary), var(--voice)); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; pointer-events: auto; color: #fff; }
.hud-next .arrow { font-size: 1.8rem; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); border-radius: 8px; }
.hud-next .dist { font-size: 0.7rem; font-weight: 800; }
.hud-next .instr { font-size: 0.95rem; font-weight: 700; }
.hud-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 500; padding: 10px 12px calc(10px + var(--safe-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; pointer-events: auto; }
.hud-info { flex: 1; min-width: 0; }
.hud-info .name { font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-info .sub { font-size: 0.75rem; color: var(--warning); font-family: var(--mono); }
.hud-actions { display: flex; gap: 8px; }
.hud-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card-2); color: var(--text); font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }

/* === OTHER MODALS (PROFILE, REPORT, SAVE PLACE) === */
.modal-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-overlay.open { display: flex; }
.overlay-box { background: var(--card); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; border: 1px solid var(--border); }
.profile-modal { position: fixed; inset: 0; z-index: 2500; background: var(--bg); transform: translateX(100%); transition: 0.3s; display: flex; flex-direction: column; }
.profile-modal.open { transform: translateX(0); }
.profile-header { padding: calc(24px + var(--safe-top)) 24px 20px; background: linear-gradient(135deg, var(--primary), var(--voice)); color: #fff; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; position: relative; }
.profile-body { flex: 1; overflow-y: auto; padding: 20px; }
.profile-btn { width: 100%; padding: 14px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); color: var(--text); font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="loadingScreen" style="position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;">
  <div style="width:50px;height:50px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;"></div>
  <h2 style="color:var(--text);">DriveKit</h2>
  <p id="loadText" style="color:var(--muted);font-size:0.9rem;">Đang khởi tạo...</p>
  <div id="loadPercent" style="font-size:2.5rem;color:var(--primary);font-weight:900;font-family:var(--mono);">0%</div>
</div>

<div id="authScreen" class="hidden" style="position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px;">
  <div style="background:var(--card);padding:32px 24px;border-radius:24px;border:1px solid var(--border);">
    <h2 id="authTitle" style="font-size:1.8rem;font-weight:900;text-align:center;margin-bottom:8px;color:var(--text);">DriveKit 🚌</h2>
    <p id="authSubtitle" style="text-align:center;color:var(--muted);margin-bottom:24px;font-size:0.9rem;">Mọi hành trình, một giải pháp</p>
    <button id="btnGoogleAuth" style="width:100%;padding:14px;border-radius:12px;font-weight:800;background:#fff;color:#333;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px;"><i class="fab fa-google"></i> Đăng nhập bằng Google</button>
    <div style="text-align:center;color:var(--muted);margin:16px 0;font-size:0.85rem;">hoặc dùng Email</div>
    <div id="authError" style="color:var(--danger);font-size:0.85rem;margin-bottom:10px;display:none;text-align:center;font-weight:600;"></div>
    <input type="email" id="authEmail" placeholder="Email" style="width:100%;padding:14px;background:var(--card-2);border:1px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:12px;">
    <input type="password" id="authPassword" placeholder="Mật khẩu" style="width:100%;padding:14px;background:var(--card-2);border:1px solid var(--border);border-radius:12px;color:var(--text);margin-bottom:12px;">
    <button id="btnSubmitAuth" style="width:100%;padding:14px;border-radius:12px;font-weight:800;background:var(--primary);color:#fff;">Đăng nhập</button>
  </div>
</div>

<div id="appUI" class="hidden">
  <div id="map"></div>

  <div class="search-bar" id="searchBar">
    <i class="fas fa-search"></i>
    <input type="text" id="searchInput" placeholder="Tìm địa điểm hoặc dán link Google Maps..." />
    <i class="fas fa-times hidden" id="searchClearBtn" style="color:var(--muted);cursor:pointer;"></i>
  </div>
  <button class="btn-menu-top" id="mainMenuBtn"><i class="fas fa-bars"></i></button>
  <button class="fab white" id="mainLocateBtn"><i class="fas fa-location-arrow"></i></button>
  <button class="fab layers" id="btnLayerMenu"><i class="fas fa-layer-group"></i></button>
  <button class="fab pin" id="btnQuickPin"><i class="fas fa-map-marker-alt"></i></button>
  <button class="fab bed" id="btnRestStopFilter"><i class="fas fa-bed"></i></button>
  <button class="fab report" id="btnReport"><i class="fas fa-exclamation-triangle"></i></button>
  <button class="fab primary" id="mainDirBtn"><i class="fas fa-directions"></i></button>

  <div class="sug-box" id="sugBox"></div>

  <div class="dir-sheet" id="dirSheet">
    <div class="dir-handle"></div>
    <div class="input-group">
      <div class="dot start"></div>
      <input type="text" id="dirStartInput" placeholder="Điểm đi (Mặc định GPS)" readonly onclick="App.activateSearch('start')" />
      <i class="fas fa-times btn-close-input hidden" id="btnClearStart"></i>
    </div>
    <div class="input-group">
      <div class="dot end"></div>
      <input type="text" id="dirEndInput" placeholder="Điểm đến" readonly onclick="App.activateSearch('end')" />
      <i class="fas fa-times btn-close-input hidden" id="btnClearEnd"></i>
    </div>
    
    <div class="v-tabs">
      <button class="v-btn active" data-mode="driving"><i class="fas fa-car"></i> Ô tô</button>
      <button class="v-btn" data-mode="driving-traffic"><i class="fas fa-car-side"></i> Kẹt xe</button>
      <button class="v-btn" data-mode="motorcycle"><i class="fas fa-motorcycle"></i> Xe máy</button>
      <button class="v-btn" data-mode="truck"><i class="fas fa-truck"></i> Xe tải</button>
      <button class="v-btn" data-mode="walking"><i class="fas fa-walking"></i> Đi bộ</button>
      <button class="v-btn" data-mode="bicycle"><i class="fas fa-bicycle"></i> Xe đạp</button>
    </div>

    <button id="btnFindRoutes" style="width:100%;padding:14px;border-radius:12px;font-weight:800;background:var(--primary);color:#fff;margin-top:10px;">
      <i class="fas fa-search-location"></i> Xem tất cả tuyến đường
    </button>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-stat"><span class="label">Còn lại</span><span class="val" id="hudRemainDist">—</span></div>
      <div class="hud-stat"><span class="label">Đến nơi</span><span class="val" id="hudRemainTime">—</span></div>
      <div class="hud-stat"><span class="label">Tốc độ</span><span class="val" id="hudSpeed" style="color:var(--success);">0 km/h</span></div>
      <button class="hud-btn-end" id="hudBtnEnd"><i class="fas fa-flag-checkered"></i><span>Kết thúc</span></button>
    </div>
    <div class="hud-next">
      <div class="arrow" id="hudArrow">↑</div>
      <div><div class="dist" id="hudDist">—</div><div class="instr" id="hudInstr">Đang tải...</div></div>
    </div>
    <div class="hud-bottom">
      <div class="hud-info">
        <div class="name" id="hudDestName">—</div>
        <div class="sub" id="hudDestDist">—</div>
      </div>
      <div class="hud-actions">
        <button class="hud-btn" id="hudBtnAltRoute"><i class="fas fa-random"></i></button>
        <button class="hud-btn" id="hudBtnVoice"><i class="fas fa-volume-up"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="modal-sheet" id="routeSheet">
  <div class="modal-header">
    <h2><i class="fas fa-route"></i> Tuyến đường</h2>
    <button onclick="document.getElementById('routeSheet').classList.remove('open')" style="background:var(--card-2);color:var(--text);width:32px;height:32px;border-radius:50%;"><i class="fas fa-times"></i></button>
  </div>
  <div class="modal-body" id="routeList"></div>
</div>

<div class="profile-modal" id="profileModal">
  <div class="profile-header">
    <button onclick="document.getElementById('profileModal').classList.remove('open')" style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.2);color:#fff;width:32px;height:32px;border-radius:50%;"><i class="fas fa-times"></i></button>
    <div style="width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.2);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:12px;" id="profileAvatar"><i class="fas fa-user"></i></div>
    <div style="font-size:1.4rem;font-weight:800;" id="profileName">Đang tải...</div>
    <div style="font-size:0.85rem;opacity:0.8;" id="profileEmail">...</div>
  </div>
  <div class="profile-body">
    <button class="profile-btn" onclick="App.startLiveTracking()"><span><i class="fas fa-satellite-dish"></i> Chia sẻ vị trí Realtime</span><i class="fas fa-chevron-right"></i></button>
    <button class="profile-btn" onclick="App.shareRoute()"><span><i class="fas fa-share-alt"></i> Chia sẻ lộ trình</span><i class="fas fa-chevron-right"></i></button>
    <button class="profile-btn" onclick="App.logout()"><span><i class="fas fa-sign-out-alt"></i> Đăng xuất</span></button>
  </div>
</div>

<div class="modal-overlay" id="reportModal">
  <div class="overlay-box">
    <h2 style="text-align:center;margin-bottom:16px;">Báo cáo sự cố</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button onclick="App.submitReport('police')" style="padding:12px;background:var(--card-2);color:var(--text);border-radius:10px;"><i class="fas fa-shield-alt" style="color:#3b82f6;"></i> CSGT</button>
      <button onclick="App.submitReport('accident')" style="padding:12px;background:var(--card-2);color:var(--text);border-radius:10px;"><i class="fas fa-car-crash" style="color:#ef4444;"></i> Tai nạn</button>
      <button onclick="App.submitReport('pothole')" style="padding:12px;background:var(--card-2);color:var(--text);border-radius:10px;"><i class="fas fa-exclamation-circle" style="color:#f59e0b;"></i> Ổ gà</button>
      <button onclick="App.submitReport('flood')" style="padding:12px;background:var(--card-2);color:var(--text);border-radius:10px;"><i class="fas fa-water" style="color:#06b6d4;"></i> Ngập nước</button>
    </div>
    <button onclick="document.getElementById('reportModal').classList.remove('open')" style="width:100%;margin-top:16px;padding:12px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--muted);">Đóng</button>
  </div>
</div>

const $ = id => document.getElementById(id);
let loadP = 0;
function updateLoad(p, txt) { if(p > loadP) { loadP = p; $('loadPercent').textContent = `${Math.floor(p)}%`; if(txt) $('loadText').textContent = txt; } }
function startLoad() {
  const int = setInterval(() => { if(loadP < 90) updateLoad(loadP + 2); else clearInterval(int); }, 100);
  setTimeout(() => { if(loadP < 100) { updateLoad(100); $('loadingScreen').classList.add('hidden'); if(App.user) showApp(); else $('authScreen').classList.remove('hidden'); } }, 3500);
}

onAuthStateChanged(auth, (user) => {
  App.user = user;
  if(user) {
    $('profileName').textContent = user.displayName || user.email.split('@')[0];
    $('profileEmail').textContent = user.email;
    navigator.geolocation.getCurrentPosition(
      pos => { App.lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }; updateLoad(95, "Đã lấy GPS"); },
      () => updateLoad(95, "Không lấy được GPS")
    );
  } else updateLoad(95, "Chưa đăng nhập");
});

function showApp() {
  $('appUI').classList.remove('hidden');
  initMap();
  initListeners();
  if(App.lastPos) {
    App.startPoint = { ...App.lastPos, name: 'Vị trí của tôi' };
    $('dirStartInput').value = 'Vị trí của tôi (GPS)';
    App.updateUserMarker();
  }
}

// === MAP & LỚP ===
function initMap() {
  if(App.map) return;
  App.map = L.map('map', { center: [App.lastPos?.lat || 21.0285, App.lastPos?.lng || 105.8542], zoom: 16, zoomControl: false });
  
  const layerMap = {
    trackasia: `${WORKER_URL}/trackasia-tiles/v2/streets/{z}/{x}/{y}.png`,
    mapbox: `${WORKER_URL}/mapbox-tiles/{z}/{x}/{y}`,
    thunderforest: `${WORKER_URL}/tf-tiles/{z}/{x}/{y}`,
    satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
  };
  
  L.tileLayer(layerMap.trackasia, { maxZoom: 19 }).addTo(App.map);

  App.map.on('click', () => { $('dirSheet').classList.remove('open'); closeSearch(); });
  App.map.on('zoomend', () => { renderPois(); });
  
  // Long press / click map
  let pressTimer;
  App.map.on('mousedown touchstart', (e) => {
    pressTimer = setTimeout(() => {
      const latlng = e.latlng;
      if(navigator.vibrate) navigator.vibrate(50);
      showMapPopup(latlng);
    }, 500);
  });
  App.map.on('mouseup touchend dragstart zoomstart', () => clearTimeout(pressTimer));
}

async function showMapPopup(latlng) {
  const res = await fetchW(`/reverse-geocode?lat=${latlng.lat}&lng=${latlng.lng}`).catch(()=>({}));
  const name = res.display_name ? res.display_name.split(',').slice(0,3).join(', ') : `Tọa độ: ${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`;
  
  const html = `
    <div style="font-weight:800;margin-bottom:8px;">${name}</div>
    <button onclick="App.goToPoint(${latlng.lat}, ${latlng.lng}, '${name.replace(/'/g,"\\'")}')" style="width:100%;padding:10px;background:var(--primary);color:#fff;border-radius:8px;margin-bottom:6px;"><i class="fas fa-location-arrow"></i> Tới chỗ này</button>
    <button onclick="App.saveQuickPin(${latlng.lat}, ${latlng.lng}, '${name.replace(/'/g,"\\'")}')" style="width:100%;padding:10px;background:var(--success);color:#fff;border-radius:8px;"><i class="fas fa-bookmark"></i> Lưu địa điểm</button>
  `;
  L.popup().setLatLng(latlng).setContent(html).openOn(App.map);
}

// === LISTENERS ===
function initListeners() {
  $('mainDirBtn').onclick = () => $('dirSheet').classList.add('open');
  $('mainLocateBtn').onclick = () => App.map.flyTo([App.lastPos.lat, App.lastPos.lng], 16);
  $('mainMenuBtn').onclick = () => $('profileModal').classList.add('open');
  $('btnReport').onclick = () => $('reportModal').classList.add('open');
  $('hudBtnEnd').onclick = () => { if(confirm('Kết thúc chuyến đi?')) endTrip(); };
  $('btnFindRoutes').onclick = () => fetchRoutes();
  
  document.querySelectorAll('.v-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.v-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      App.vehicleMode = btn.dataset.mode;
    };
  });

  $('searchInput').oninput = (e) => {
    const q = e.target.value.trim();
    $('searchClearBtn').classList.toggle('hidden', q.length === 0);
    if(q.length >= 2) { clearTimeout(window._st); window._st = setTimeout(() => doSearch(q), 500); }
  };
  $('searchClearBtn').onclick = () => { $('searchInput').value = ''; $('searchClearBtn').classList.add('hidden'); closeSearch(); };

  $('btnGoogleAuth').onclick = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { $('authError').textContent = 'Lỗi Google Auth'; $('authError').style.display = 'block'; } };
  $('btnSubmitAuth').onclick = async () => {
    try { await signInWithEmailAndPassword(auth, $('authEmail').value, $('authPassword').value); } 
    catch(e) { $('authError').textContent = 'Sai email hoặc mật khẩu'; $('authError').style.display = 'block'; }
  };
}

// === SEARCH ===
function activateSearch(mode) {
  App.searchMode = mode;
  $('searchInput').focus();
  $('searchInput').value = mode === 'start' ? App.startPoint?.name || '' : mode === 'end' ? App.endPoint?.name || '' : '';
}

async function doSearch(q) {
  const box = $('sugBox');
  box.innerHTML = '<div class="sug-item"><i class="fas fa-spinner fa-spin"></i> Đang tìm...</div>';
  box.classList.add('show');

  try {
    const data = await fetchW(`/mapbox-search?query=${encodeURIComponent(q)}`);
    box.innerHTML = '';
    if(data.results && data.results.length > 0) {
      data.results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'sug-item';
        div.innerHTML = `<i class="fas fa-map-marker-alt"></i><div>${r.formatted_address || r.name}</div>`;
        div.onclick = () => selectLocation(r.geometry.location.lat, r.geometry.location.lng, r.formatted_address || r.name);
        box.appendChild(div);
      });
    } else {
      box.innerHTML = '<div class="sug-item">Không tìm thấy kết quả</div>';
    }
  } catch(e) { box.innerHTML = '<div class="sug-item">Lỗi kết nối</div>'; }
}

function selectLocation(lat, lng, name) {
  closeSearch();
  $('searchInput').value = name;
  App.map.flyTo([lat, lng], 16);
  
  if(App.searchMode === 'start') { App.startPoint = { lat, lng, name }; $('dirStartInput').value = name; }
  else if(App.searchMode === 'end') { App.endPoint = { lat, lng, name }; $('dirEndInput').value = name; }
  else { App.goToPoint(lat, lng, name); }
}

function closeSearch() { $('sugBox').classList.remove('show'); $('searchInput').blur(); }

// === ROUTING ===
async function fetchRoutes() {
  if(!App.startPoint || !App.endPoint) return alert('Chọn đủ Điểm đi và Điểm đến!');
  $('routeSheet').classList.add('open');
  $('routeList').innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

  try {
    const data = await fetchW(`/trackasia-route?origin=${App.startPoint.lat},${App.startPoint.lng}&destination=${App.endPoint.lat},${App.endPoint.lng}&mode=${App.vehicleMode}`);
    if(data.status === 'ZERO_RESULTS' || !data.routes) throw new Error(data.error || 'Không tìm thấy đường');
    
    App.altRoutes = data.routes;
    $('routeList').innerHTML = data.routes.map((r, i) => `
      <div class="route-card ${i===0?'active':''}" onclick="App.selectRoute(${i})">
        <h3>Tuyến ${i+1} ${i===0?'(Đề xuất)':''}</h3>
        <p><i class="fas fa-road"></i> ${(r.legs[0].distance.value/1000).toFixed(1)} km • <i class="fas fa-clock"></i> ${Math.round(r.legs[0].duration.value/60)} phút</p>
      </div>
    `).join('');
  } catch(e) {
    $('routeList').innerHTML = `<div style="color:var(--danger);text-align:center;">${e.message}</div>`;
  }
}

// === NAVIGATION & HUD ===
App.selectRoute = (idx) => {
  const r = App.altRoutes[idx];
  App.routeData = r;
  $('routeSheet').classList.remove('open');
  $('dirSheet').classList.remove('open');
  startNav();
};

function startNav() {
  App.isNavigating = true;
  $('hud').classList.remove('hidden');
  document.body.classList.add('navigating');
  App.voiceSteps = App.routeData.legs[0].steps || [];
  App.voiceIndex = 0;
  
  if(App.routeLayer) App.map.removeLayer(App.routeLayer);
  App.routeLayer = L.polyline(App.routeData.geometry.coordinates.map(c => [c[1], c[0]]), { color: 'var(--primary)', weight: 8 }).addTo(App.map);
  App.map.fitBounds(App.routeLayer.getBounds());
  
  $('hudDestName').textContent = App.endPoint.name;
  $('hudRemainDist').textContent = (App.routeData.legs[0].distance.value/1000).toFixed(1) + ' km';
  $('hudRemainTime').textContent = Math.round(App.routeData.legs[0].duration.value/60) + ' phút';
  
  if(App.watchId) navigator.geolocation.clearWatch(App.watchId);
  App.watchId = navigator.geolocation.watchPosition(onPosUpdate, null, { enableHighAccuracy: true });
  
  App.speak('Bắt đầu dẫn đường');
  App.voiceTimer = setInterval(checkVoice, 3000);
}

function onPosUpdate(pos) {
  if(!App.isNavigating) return;
  const lat = pos.coords.latitude, lng = pos.coords.longitude;
  App.lastPos = { lat, lng, accuracy: pos.coords.accuracy };
  
  $('hudSpeed').textContent = Math.round((pos.coords.speed || 0) * 3.6) + ' km/h';
  App.map.panTo([lat, lng]);
  App.updateUserMarker();

  // Check Off-route & Arrival
  const distToEnd = App.calcDist(lat, lng, App.endPoint.lat, App.endPoint.lng);
  if(distToEnd < 20 && !App.arrivalHandled) {
    App.arrivalHandled = true;
    App.speak('Đã đến nơi');
    alert('Đã đến nơi!');
    endTrip();
  }
  
  // Update HUD Next Turn
  if(App.voiceSteps[App.voiceIndex]) {
    const step = App.voiceSteps[App.voiceIndex];
    if(step.maneuver && step.maneuver.location) {
      const d = App.calcDist(lat, lng, step.maneuver.location[1], step.maneuver.location[0]);
      $('hudDist').textContent = d > 1000 ? (d/1000).toFixed(1)+' km' : Math.round(d)+' m';
      $('hudInstr').textContent = step.maneuver.instruction || 'Đi thẳng';
      if(d < 50) { App.speak(step.maneuver.instruction); App.voiceIndex++; }
    }
  }
}

function endTrip() {
  App.isNavigating = false;
  $('hud').classList.add('hidden');
  document.body.classList.remove('navigating');
  if(App.watchId) navigator.geolocation.clearWatch(App.watchId);
  clearInterval(App.voiceTimer);
  if(App.routeLayer) App.map.removeLayer(App.routeLayer);
  App.routeLayer = null;
  App.routeData = null;
}

function checkVoice() {
  // Logic đã gộp vào onPosUpdate
}

// === TIỆN ÍCH ===
App.updateUserMarker = () => {
  if(!App.lastPos) return;
  const icon = L.divIcon({ html: '<div style="width:20px;height:20px;background:#10b981;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px #10b981;"></div>', iconSize:[20,20], iconAnchor:[10,10] });
  if(App.userMarker) App.userMarker.setLatLng([App.lastPos.lat, App.lastPos.lng]);
  else App.userMarker = L.marker([App.lastPos.lat, App.lastPos.lng], { icon }).addTo(App.map);
  
  if(App.gpsCircle) App.gpsCircle.setLatLng([App.lastPos.lat, App.lastPos.lng]);
  else App.gpsCircle = L.circle([App.lastPos.lat, App.lastPos.lng], { radius: App.lastPos.accuracy || 10, color: '#10b981', fillOpacity: 0.1 }).addTo(App.map);
};

App.goToPoint = (lat, lng, name) => {
  App.endPoint = { lat, lng, name };
  $('dirEndInput').value = name;
  $('dirSheet').classList.add('open');
};

App.calcDist = (lat1, lng1, lat2, lng2) => {
  const R = 6371e3, p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180, dp = (lat2-lat1)*Math.PI/180, dl = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
};

App.speak = (txt) => {
  if(!App.synth) return;
  App.synth.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'vi-VN';
  App.synth.speak(u);
};

App.submitReport = async (type) => {
  if(!App.lastPos) return alert('Chưa có GPS');
  await push(ref(db, 'reports'), { lat: App.lastPos.lat, lng: App.lastPos.lng, type, timestamp: Date.now(), expiresAt: Date.now() + 3600000 });
  $('reportModal').classList.remove('open');
  alert('Đã gửi báo cáo!');
};

App.shareRoute = () => {
  if(!App.startPoint || !App.endPoint) return alert('Chưa có lộ trình');
  const url = `${window.location.origin}?fromLat=${App.startPoint.lat}&fromLng=${App.startPoint.lng}&toLat=${App.endPoint.lat}&toLng=${App.endPoint.lng}`;
  navigator.clipboard.writeText(url).then(() => alert('Đã copy link chia sẻ!'));
};

App.logout = () => { signOut(auth); window.location.reload(); };

// Bắt đầu load
startLoad();
setTimeout(() => { if(!App.user) { $('loadingScreen').classList.add('hidden'); $('authScreen').classList.remove('hidden'); } else showApp(); }, 4000);

window.App = App;
</script>
