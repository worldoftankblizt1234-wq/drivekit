<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demo MapLibre 360°</title>
<!-- Nạp CSS MapLibre -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  
  /* Nút Reset Bắc */
  .reset-btn {
    position: absolute; bottom: 30px; right: 30px; z-index: 1000;
    background: #1e293b; color: white; border: 1px solid #334155;
    padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: bold;
    cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.2s, background 0.2s;
  }
  .reset-btn:active { transform: scale(0.95); background: #3b82f6; }
  
  /* Góc trên trái thông báo */
  .hint {
    position: absolute; top: 20px; left: 20px; z-index: 1000;
    background: rgba(15, 23, 42, 0.85); color: white; backdrop-filter: blur(5px);
    padding: 10px 16px; border-radius: 12px; font-size: 13px; border: 1px solid #334155;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="hint">
  💡 Kéo chuột phải (PC) hoặc 2 ngón tay (Mobile) để xoay 360° & nghiêng 3D
</div>

<button class="reset-btn" id="resetBtn">
  🧭 Xoay về Bắc
</button>

<!-- Nạp JS MapLibre -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // Key MapTiler của bạn
  const MAPTILER_KEY = 'aEzMCP0ANRz52vd1RvrW';
  const MAPTILER_STYLE = `https://api.maptiler.com/maps/streets-v4/style.json?key=${MAPTILER_KEY}`;

  // Khởi tạo bản đồ
  const map = new maplibregl.Map({
    container: 'map',
    style: MAPTILER_STYLE,
    center: [105.8542, 21.0285], // Toạ độ Hồ Hoàn Kiếm, Hà Nội (MapLibre dùng [Lng, Lat])
    zoom: 16,
    pitch: 45,        // Nghiêng 3D một chút để thấy rõ
    bearing: -20,     // Xoay lệch đi một chút
    maxPitch: 85      // Cho phép nghiêng tối đa
  });

  // Thêm nút điều hướng (Zoom, Xoay, Nghiêng) mặc định của MapLibre
  map.addControl(new maplibregl.NavigationControl({
    visualizePitch: true,
    showZoom: true,
    showCompass: true
  }), 'top-right');

  // Thêm 1 Marker để test xem có bị văng không khi xoay
  new maplibregl.Marker({ color: '#ef4444' })
    .setLngLat([105.8542, 21.0285])
    .setPopup(new maplibregl.Popup().setHTML("<b>Điểm test Marker</b><br>Xoay map thử xem marker có dính chặt không!"))
    .addTo(map);

  // Thêm một cột 3D (Polygon) để test hiệu ứng nghiêng
  map.on('load', () => {
    map.addSource('3d-building', {
      type: 'geojson',
      data: {
        type: 'Feature',
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [105.8540, 21.0280],
            [105.8545, 21.0280],
            [105.8545, 21.0285],
            [105.8540, 21.0285],
            [105.8540, 21.0280]
          ]]
        }
      }
    });

    map.addLayer({
      id: '3d-building-layer',
      type: 'fill-extrusion',
      source: '3d-building',
      paint: {
        'fill-extrusion-color': '#3b82f6',
        'fill-extrusion-height': 100,
        'fill-extrusion-base': 0,
        'fill-extrusion-opacity': 0.8
      }
    });
  });

  // Xử lý nút Reset Bắc
  document.getElementById('resetBtn').addEventListener('click', () => {
    // easeTo giúp xoay mượt mà về 0 độ, đồng thời hạ góc nghiêng xuống
    map.easeTo({
      bearing: 0,
      pitch: 0,
      duration: 1000 // Xoay trong 1 giây
    });
  });
</script>

</body>
</html>
