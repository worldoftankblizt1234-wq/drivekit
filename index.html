<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<title>DriveKit — Dẫn đường chuyên nghiệp</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

  window.vConsole = new window.VConsole();

<style>
/* CSS TỐI ƯU CHO MOBILE APP */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f172a; --bg-2: #1e293b; --card: #1e293b; --card-2: #334155;
  --border: #334155; --text: #f1f5f9; --text-muted: #94a3b8;
  --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --voice: #8b5cf6;
  --font-main: 'Be Vietnam Pro', sans-serif; --font-mono: 'Fira Code', monospace;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-main); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; }
button, input { font-family: inherit; outline: none; border: none; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* MAP */
#map { position: fixed; inset: 0; z-index: 1; background: var(--bg); }
.leaflet-container { font-family: var(--font-main) !important; }
.leaflet-control-attribution { font-size: 9px !important; background: rgba(15,23,42,0.7) !important; color: #94a3b8 !important; }
.leaflet-control-attribution a { color: #60a5fa !important; }
.leaflet-bar a { background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important; }

/* HUD */
.hud-top { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: calc(10px + var(--safe-top)) 12px 10px; display: flex; gap: 8px; pointer-events: none; }
.hud-stat { flex: 1; background: rgba(15,23,42,0.88); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; pointer-events: auto; }
.hud-stat .label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.hud-stat .value { font-size: 1.05rem; font-weight: 800; font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }
.hud-stat.speed .value { color: var(--success); }

.hud-next { position: fixed; top: calc(80px + var(--safe-top)); left: 12px; right: 12px; z-index: 500; background: linear-gradient(135deg, var(--primary), var(--voice)); border-radius: 14px; padding: 12px; display: flex; align-items: center; gap: 14px; pointer-events: auto; }
.hud-next .arrow { font-size: 2rem; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); border-radius: 10px; }
.hud-next .dist { font-size: 0.75rem; font-weight: 800; color: rgba(255,255,255,0.9); }
.hud-next .instr { font-size: 1rem; font-weight: 700; line-height: 1.3; }

.hud-bottom { position: fixed; bottom: 0; left: 0; right: 0; z-index: 500; padding: 12px 12px calc(12px + var(--safe-bottom)); background: rgba(15,23,42,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; pointer-events: auto; }
.hud-next-stop { flex: 1; }
.hud-next-stop .name { font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-next-stop .dist { font-size: 0.8rem; font-weight: 700; color: var(--warning); font-family: var(--font-mono); margin-top: 2px; }
.hud-btn { width: 50px; height: 50px; border-radius: 14px; background: var(--card-2); color: var(--text); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.hud-btn.active { background: var(--success); color: white; border-color: transparent; animation: voicePulse 2s infinite; }
.hud-btn.stop { background: var(--danger); color: white; }
@keyframes voicePulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 100% { box-shadow: 0 0 0 10px rgba(16,185,129,0); } }

/* UI OVERLAYS */
.floating-search { position: fixed; top: calc(16px + var(--safe-top)); left: 16px; right: 60px; z-index: 1000; background: var(--card); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border: 1px solid var(--border); }
.floating-search input { flex: 1; background: transparent; color: var(--text); font-size: 0.95rem; font-weight: 600; }
.floating-search i { color: var(--primary); }

.fab-menu { position: fixed; top: calc(16px + var(--safe-top)); right: 16px; z-index: 1000; width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.fab-directions { position: fixed; bottom: calc(30px + var(--safe-bottom)); right: 16px; z-index: 1000; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 6px 24px rgba(59,130,246,0.5); transition: 0.2s; }
.fab-directions:active { transform: scale(0.92); }

.fab-locate { position: fixed; bottom: calc(30px + var(--safe-bottom)); left: 16px; z-index: 1000; width: 56px; height: 56px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: 0.2s; }
.fab-locate:active { transform: scale(0.92); }
.fab-locate.loading { color: var(--primary); animation: spin 1s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* DIRECTION SHEET */
.dir-sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1500; background: var(--card); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px 16px calc(16px + var(--safe-bottom)); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 -10px 40px rgba(0,0,0,0.6); }
.dir-sheet.open { transform: translateY(0); }
.dir-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.input-group { display: flex; align-items: center; gap: 12px; background: var(--bg-2); padding: 10px 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
.input-group .dot { width: 10px; height: 10px; border-radius: 50%; }
.input-group .dot.start { background: var(--success); }
.input-group .dot.end { background: var(--danger); }
.input-group input { flex: 1; background: transparent; color: var(--text); font-size: 0.95rem; font-weight: 600; }

/* SUGGESTIONS */
.suggestions-box { position: fixed; top: 76px; left: 16px; right: 16px; z-index: 1200; background: var(--card-2); border-radius: 12px; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); display: none; }
.suggestions-box.show { display: block; }
.sug-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.sug-item:active { background: var(--primary); }
.sug-item i { color: var(--primary); }

/* AUTH SCREEN */
.auth-screen { position: fixed; inset: 0; z-index: 3000; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 24px; }
.auth-box { background: var(--card); padding: 32px 24px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.auth-box h2 { font-size: 1.8rem; font-weight: 900; text-align: center; margin-bottom: 8px; }
.auth-box p { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem; }
.auth-input { width: 100%; padding: 14px 16px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); margin-bottom: 12px; font-size: 1rem; }
.btn-auth { width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn-google { background: white; color: #333; }
.btn-email { background: var(--primary); color: white; }

/* HISTORY MODAL */
.history-modal { position: fixed; inset: 0; z-index: 2500; background: rgba(15,23,42,0.9); backdrop-filter: blur(5px); display: flex; flex-direction: column; padding: 20px; }
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.history-header h2 { font-size: 1.5rem; }
.history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.history-item { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
.history-item .time { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; }
.history-item .route { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.history-item .route i { color: var(--success); font-size: 0.6rem; }
.history-item .route .end { color: var(--danger); }

.loading-screen { position: fixed; inset: 0; z-index: 5000; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
.spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Đang tải DriveKit...</p>
</div>

<!-- AUTH SCREEN -->
<div class="auth-screen hidden" id="authScreen">
  <div class="auth-box">
    <h2 id="authTitle">DriveKit 🚌</h2>
    <p id="authSubtitle">Đăng nhập để lưu lịch sử chuyến đi</p>
    
    <button class="btn-auth btn-google" id="btnGoogleAuth">
      <i class="fab fa-google"></i> Đăng nhập bằng Google
    </button>
    
    <div style="text-align:center; color:var(--text-muted); margin: 16px 0; font-size:0.85rem;">hoặc dùng Email</div>
    
    <div id="authError" style="color:var(--danger); font-size:0.85rem; margin-bottom:10px; display:none; text-align:center; font-weight:600;"></div>

    <input type="email" id="authEmail" class="auth-input" placeholder="Email" />
    <input type="password" id="authPassword" class="auth-input" placeholder="Mật khẩu" />
    
    <button class="btn-auth btn-email" id="btnSubmitAuth">Đăng nhập</button>
    
    <div style="text-align:center; margin-top:16px; font-size:0.9rem;">
      <span id="authToggleText" style="color:var(--text-muted);">Chưa có tài khoản?</span>
      <a href="#" id="authToggleBtn" style="color:var(--primary); font-weight:700; text-decoration:none; margin-left:5px;">Đăng ký ngay</a>
    </div>
  </div>
</div>

<!-- MAIN MAP & UI -->
<div id="appUI" class="hidden">
  <div id="map"></div>

  <!-- Thanh Search Trên Cùng -->
  <div class="floating-search" id="searchBar" onclick="openSearchMode()">
    <i class="fas fa-search"></i>
    <input type="text" id="topSearchInput" placeholder="Tìm địa điểm..." readonly />
  </div>
  
  <!-- Icon Menu -->
  <button class="fab-menu" onclick="openMenu()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Icon Chỉ đường -->
  <button class="fab-directions" onclick="openDirections()">
    <i class="fas fa-directions"></i>
  </button>

  <!-- Nút Locate Me -->
  <button class="fab-locate" id="btnLocateMe" onclick="centerToLocation()">
    <i class="fas fa-location-arrow"></i>
  </button>

  <!-- Directions Sheet -->
  <div class="dir-sheet" id="dirSheet">
    <div class="dir-handle"></div>
    <div class="input-group">
      <div class="dot start"></div>
      <input type="text" id="dirInputStart" placeholder="Điểm đi (Mặc định GPS)" readonly onclick="activateSearch('start')" />
      <button onclick="refreshGPS()"><i class="fas fa-location-arrow" style="color:var(--primary)"></i></button>
    </div>
    <div class="input-group">
      <div class="dot end"></div>
      <input type="text" id="dirInputEnd" placeholder="Điểm đến" readonly onclick="activateSearch('end')" />
    </div>
    <button class="btn-auth btn-email" style="margin-top:10px; margin-bottom:0;" onclick="startRouteFromSheet()">
      <i class="fas fa-play"></i> Bắt đầu dẫn đường
    </button>
  </div>

  <!-- Suggestions Box -->
  <div class="suggestions-box" id="suggestionsBox"></div>

  <!-- HUD Khi đang chạy -->
  <div class="hidden" id="hud">
    <div class="hud-top">
      <div class="hud-stat"><span class="label">Còn lại</span><span class="value" id="hudRemainDist">—</span></div>
      <div class="hud-stat"><span class="label">Đến nơi</span><span class="value" id="hudRemainTime">—</span></div>
      <div class="hud-stat speed"><span class="label">Tốc độ</span><span class="value" id="hudSpeed">0 km/h</span></div>
    </div>
    <div class="hud-next">
      <div class="arrow" id="hudNextArrow">↑</div>
      <div class="info"><div class="dist" id="hudNextDist">—</div><div class="instr" id="hudNextInstr">Đang tải...</div></div>
    </div>
    <div class="hud-bottom">
      <div class="hud-next-stop">
        <div class="name" id="hudNextStopName">—</div>
        <div class="dist" id="hudNextStopDist">—</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="hud-btn" id="hudBtnVoice"><i class="fas fa-volume-up"></i></button>
        <button class="hud-btn stop" onclick="stopRoute()"><i class="fas fa-stop"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="history-modal hidden" id="historyModal">
  <div class="history-header">
    <h2>Lịch sử chuyến đi</h2>
    <button onclick="closeMenu()" style="background:none; color:white; font-size:1.5rem;"><i class="fas fa-times"></i></button>
  </div>
  <div class="history-list" id="historyList"></div>
  <button class="btn-auth btn-email" style="margin-top:20px; background:var(--danger);" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i> Đăng xuất
  </button>
</div>

<!-- FIREBASE & LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYxZYEnoxtzpUMaYfQXYWF3lojUX51R48",
  authDomain: "drivekit-c88ef.firebaseapp.com",
  projectId: "drivekit-c88ef",
  storageBucket: "drivekit-c88ef.firebasestorage.app",
  messagingSenderId: "1073887619343",
  appId: "1:1073887619343:web:d89a872968bc4ee871f67a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const WORKER_URL = 'https://map-birthday.anhminhadof123.workers.dev';
const TRACKASIA_KEY = '1792297789c0cf0ddb16e5446d7364580f'; 

// --- STATE ---
let map = null;
let currentUser = null;
let startPoint = null;
let endPoint = null;
let userMarker = null;
let currentRouteLayer = null;
let watchId = null;
let lastUserPos = null;
let isSearchingFor = 'end'; 

// --- VOICE STATE ---
let voiceEnabled = true;
let voiceRouteSteps = null;
let voiceStepIndex = 0;
let voiceCheckTimer = null;

// ==========================================
// AUTHENTICATION LOGIC
// ==========================================
function getAuthErrorMessage(errorCode) {
  switch (errorCode) {
    case 'auth/invalid-email': return 'Email không đúng định dạng.';
    case 'auth/user-disabled': return 'Tài khoản này đã bị khóa.';
    case 'auth/user-not-found': return 'Tài khoản không tồn tại. Vui lòng đăng ký.';
    case 'auth/wrong-password': return 'Mật khẩu không chính xác.';
    case 'auth/invalid-credential': return 'Tài khoản hoặc mật khẩu không đúng.';
    case 'auth/email-already-in-use': return 'Email này đã được đăng ký. Vui lòng đăng nhập.';
    case 'auth/weak-password': return 'Mật khẩu quá yếu (phải từ 6 ký tự).';
    case 'auth/too-many-requests': return 'Bạn thử quá nhiều lần. Vui lòng đợi 1 lát rồi thử lại.';
    case 'auth/network-request-failed': return 'Lỗi kết nối mạng. Vui lòng kiểm tra internet.';
    default: return 'Có lỗi xảy ra. Vui lòng thử lại sau.';
  }
}

let isRegisterMode = false;
const authTitle = document.getElementById('authTitle');
const authSubtitle = document.getElementById('authSubtitle');
const btnSubmitAuth = document.getElementById('btnSubmitAuth');
const authToggleText = document.getElementById('authToggleText');
const authToggleBtn = document.getElementById('authToggleBtn');
const authError = document.getElementById('authError');

authToggleBtn.addEventListener('click', (e) => {
  e.preventDefault();
  isRegisterMode = !isRegisterMode;
  authError.style.display = 'none';
  
  if (isRegisterMode) {
    authTitle.textContent = 'Tạo tài khoản 📝';
    authSubtitle.textContent = 'Đăng ký để bắt đầu hành trình';
    btnSubmitAuth.textContent = 'Đăng ký tài khoản';
    authToggleText.textContent = 'Đã có tài khoản?';
    authToggleBtn.textContent = 'Đăng nhập';
  } else {
    authTitle.textContent = 'DriveKit 🚌';
    authSubtitle.textContent = 'Đăng nhập để lưu lịch sử chuyến đi';
    btnSubmitAuth.textContent = 'Đăng nhập';
    authToggleText.textContent = 'Chưa có tài khoản?';
    authToggleBtn.textContent = 'Đăng ký ngay';
  }
});

btnSubmitAuth.addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value;
  const pass = document.getElementById('authPassword').value;
  
  if (!email || !pass) {
    authError.textContent = 'Vui lòng nhập đầy đủ Email và Mật khẩu.';
    authError.style.display = 'block';
    return;
  }

  btnSubmitAuth.disabled = true;
  btnSubmitAuth.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
  authError.style.display = 'none';

  try {
    if (isRegisterMode) {
      await createUserWithEmailAndPassword(auth, email, pass);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    authError.textContent = getAuthErrorMessage(err.code);
    authError.style.display = 'block';
  } finally {
    btnSubmitAuth.disabled = false;
    btnSubmitAuth.textContent = isRegisterMode ? 'Đăng ký tài khoản' : 'Đăng nhập';
  }
});

document.getElementById('btnGoogleAuth').addEventListener('click', async () => {
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    authError.textContent = getAuthErrorMessage(e.code);
    authError.style.display = 'block';
  }
});

onAuthStateChanged(auth, (user) => {
  document.getElementById('loadingScreen').classList.add('hidden');
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appUI').classList.remove('hidden');
    authError.style.display = 'none';
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
    initMap();
    refreshGPS(); 
  } else {
    currentUser = null;
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('appUI').classList.add('hidden');
  }
});

function logout() {
  signOut(auth);
  closeMenu();
}

// ==========================================
// MAP & UI LOGIC (BAO GỒM NHẤN GIỮ 2S)
// ==========================================
function initMap() {
  if (map) return;
  
  map = L.map('map', { center: [21.0285, 105.8542], zoom: 13, zoomControl: false });
  
  // TrackAsia Vector Tiles
  const trackasiaStyleUrl = `https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_KEY}`;
  try {
    L.trackasiaGL({ style: trackasiaStyleUrl }).addTo(map);
  } catch (error) {
    console.error('❌ Lỗi tải TrackAsia GL:', error);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  }

  // ==========================================
  // TÍNH NĂNG NHẤN GIỮ 2S ĐỂ HIỆN POPUP
  // ==========================================
  let pressTimer = null;
  let touchMarker = null;

  // Tạo vòng tròn đếm ngược
  const pressIndicator = document.createElement('div');
  pressIndicator.style.cssText = `
    position: fixed; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(59,130,246,0.4); border: 2px solid #3b82f6;
    transform: translate(-50%, -50%) scale(0); transition: transform 0.3s, opacity 0.3s;
    pointer-events: none; z-index: 9999; opacity: 0;
  `;
  document.body.appendChild(pressIndicator);

  function startPress(e) {
    // Bỏ qua nếu đang mở bảng chỉ đường hoặc đang gõ tìm kiếm
    if (document.getElementById('dirSheet').classList.contains('open') || 
        document.getElementById('suggestionsBox').classList.contains('show')) return;

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    // Tính tọa độ lat/lng
    const latlng = map.containerPointToLatLng([clientX - map.getContainer().getBoundingClientRect().left, clientY - map.getContainer().getBoundingClientRect().top]);

    pressIndicator.style.left = clientX + 'px';
    pressIndicator.style.top = clientY + 'px';
    pressIndicator.style.transform = 'translate(-50%, -50%) scale(1)';
    pressIndicator.style.opacity = '1';

    pressTimer = setTimeout(() => {
      pressIndicator.style.opacity = '0';
      if (navigator.vibrate) navigator.vibrate(50); // Rung
      showLongPressPopup(latlng);
    }, 2000); // 2 giây
  }

  function cancelPress() {
    clearTimeout(pressTimer);
    pressIndicator.style.transform = 'translate(-50%, -50%) scale(0)';
    pressIndicator.style.opacity = '0';
  }

  map.on('mousedown', startPress);
  map.on('touchstart', startPress);
  map.on('mouseup', cancelPress);
  map.on('touchend', cancelPress);
  map.on('mouseout', cancelPress);
  map.on('dragstart', cancelPress);
  map.on('zoomstart', cancelPress);

  async function showLongPressPopup(latlng) {
    if (touchMarker) map.removeLayer(touchMarker);
    
    const icon = L.divIcon({ html: '<div style="width:24px;height:24px;border-radius:50%;background:#ef4444;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>', iconSize: [24,24] });
    touchMarker = L.marker(latlng, { icon }).addTo(map);

    const popupContent = document.createElement('div');
    popupContent.innerHTML = `<div style="text-align:center; padding:5px;"><i class="fas fa-spinner fa-spin"></i> Đang lấy địa chỉ...</div>`;
    touchMarker.bindPopup(popupContent).openPopup();

    let name = '';
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json&accept-language=vi`);
      const data = await res.json();
      if (data.display_name) {
        name = data.display_name.split(',').slice(0, 2).join(', ');
      }
    } catch (e) {
      console.warn('Reverse geocode error', e);
    }

    const displayName = name || `Tọa độ: ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;

    popupContent.innerHTML = `
      <div style="min-width: 180px;">
        <div style="font-weight: 800; font-size: 0.9rem; margin-bottom: 8px; line-height: 1.3; color: #0f172a;">${displayName}</div>
        <button onclick="goToLongPressLocation(${latlng.lat}, ${latlng.lng}, '${escapeHtml(displayName).replace(/'/g, "\\'")}')" 
                style="width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <i class="fas fa-location-arrow"></i> Tới chỗ này
        </button>
      </div>
    `;
    touchMarker.setPopupContent(popupContent).openPopup();
  }
}

// Hàm xử lý khi bấm "Tới chỗ này"
window.goToLongPressLocation = function(lat, lng, name) {
  endPoint = { lat, lng, name };
  
  document.getElementById('dirInputEnd').value = name;
  document.getElementById('topSearchInput').value = name;
  
  if (userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({ html: '<div style="width:24px;height:24px;border-radius:50%;background:#ef4444;border:3px solid white;"></div>', iconSize: [24,24] });
  userMarker = L.marker([lat, lng], { icon }).addTo(map);
  
  map.closePopup();
  openDirections();
  
  if (!startPoint) {
    refreshGPS();
  }
};

// Hàm escape HTML
function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function centerToLocation() {
  if (lastUserPos) {
    map.setView([lastUserPos.lat, lastUserPos.lng], 16);
  } else {
    refreshGPS();
  }
}

function openDirections() { document.getElementById('dirSheet').classList.add('open'); }
function closeDirections() { document.getElementById('dirSheet').classList.remove('open'); }
function openMenu() {
  document.getElementById('historyModal').classList.remove('hidden');
  loadHistory();
}
function closeMenu() { document.getElementById('historyModal').classList.add('hidden'); }
function openSearchMode() {
  openDirections();
  setTimeout(() => activateSearch('end'), 300);
}

function activateSearch(type) {
  isSearchingFor = type;
  const box = document.getElementById('suggestionsBox');
  box.classList.add('show');
  box.innerHTML = '<div class="sug-item">Nhập để tìm kiếm...</div>';
  
  const input = document.getElementById('topSearchInput');
  input.readOnly = false;
  input.value = '';
  input.focus();
  
  input.oninput = (e) => {
    const q = e.target.value.trim();
    if (q.length < 2) return;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => doSearch(q), 500);
  };
}

function closeSearch() {
  document.getElementById('suggestionsBox').classList.remove('show');
  document.getElementById('topSearchInput').readOnly = true;
}

async function doSearch(query) {
  const box = document.getElementById('suggestionsBox');
  box.innerHTML = '<div class="sug-item"><i class="fas fa-spinner fa-spin"></i> Đang tìm...</div>';

  try {
    const res = await fetch(`${WORKER_URL}/trackasia-search?query=${encodeURIComponent(query)}`);
    const data = await res.json();

    const results = data.results || data.predictions || [];
    
    if (results.length > 0) {
      box.innerHTML = '';
      results.slice(0, 5).forEach(r => {
        const div = document.createElement('div');
        div.className = 'sug-item';
        
        const name = r.formatted_address || r.name || r.description || 'Không tên';
        const lat = r.geometry?.location?.lat || r.lat;
        const lng = r.geometry?.location?.lng || r.lng || r.lon;
        
        div.innerHTML = `<i class="fas fa-map-marker-alt"></i><div>${name}</div>`;
        div.onclick = () => selectLocation(lat, lng, name);
        box.appendChild(div);
      });
    } else {
      box.innerHTML = '<div class="sug-item">Không tìm thấy kết quả</div>';
    }
  } catch (e) {
    console.error('Lỗi tìm kiếm TrackAsia:', e);
    box.innerHTML = '<div class="sug-item" style="color:var(--danger)">Lỗi kết nối máy chủ</div>';
  }
}

async function reverseGeocode(lat, lng) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
    const data = await res.json();
    const name = data.display_name ? data.display_name.split(',').slice(0, 2).join(', ') : 'Điểm đã chọn';
    selectLocation(lat, lng, name);
  } catch {
    selectLocation(lat, lng, 'Điểm đã chọn');
  }
}

function selectLocation(lat, lng, name) {
  if (isSearchingFor === 'start') {
    startPoint = { lat, lng, name };
    document.getElementById('dirInputStart').value = name;
  } else {
    endPoint = { lat, lng, name };
    document.getElementById('dirInputEnd').value = name;
  }
  
  document.getElementById('topSearchInput').value = name;
  document.getElementById('topSearchInput').readOnly = true;
  closeSearch();
  
  if (userMarker) map.removeLayer(userMarker);
  const icon = L.divIcon({ html: '<div style="width:24px;height:24px;border-radius:50%;background:#ef4444;border:3px solid white;"></div>', iconSize: [24,24] });
  userMarker = L.marker([lat, lng], { icon }).addTo(map);
  map.setView([lat, lng], 16);
}

function refreshGPS() {
  if (!navigator.geolocation) return;
  const btn = document.getElementById('btnLocateMe');
  if (btn) btn.classList.add('loading');
  
  navigator.geolocation.getCurrentPosition(pos => {
    if (btn) btn.classList.remove('loading');
    startPoint = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: 'Vị trí của tôi' };
    document.getElementById('dirInputStart').value = 'Vị trí của tôi (GPS)';
    
    lastUserPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    
    if (userMarker) map.removeLayer(userMarker);
    const icon = L.divIcon({ html: '<div style="width:20px;height:20px;border-radius:50%;background:#3b82f6;border:3px solid white;box-shadow:0 0 10px rgba(59,130,246,0.5);"></div>', iconSize: [20,20] });
    userMarker = L.marker([pos.coords.latitude, pos.coords.longitude], { icon }).addTo(map);
  }, (err) => {
    if (btn) btn.classList.remove('loading');
    console.warn('Lỗi GPS:', err);
    alert('Không thể lấy vị trí. Vui lòng bật GPS!');
  });
}

// ==========================================
// ROUTING & VOICE
// ==========================================
async function startRouteFromSheet() {
  if (!startPoint || !endPoint) return alert('Vui lòng chọn đủ Điểm đi và Điểm đến!');
  
  closeDirections();
  document.getElementById('hud').classList.remove('hidden');
  
  const fromStr = `${startPoint.lng},${startPoint.lat}`;
  const toStr = `${endPoint.lng},${endPoint.lat}`;
  const url = `${WORKER_URL}/mapbox-route?from=${fromStr}&to=${toStr}`;
  
  try {
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.code !== 'Ok' || !data.routes || data.routes.length === 0) {
      throw new Error(data.message || 'Không tìm thấy đường đi');
    }
    
    const r = data.routes[0];
    voiceRouteSteps = r.legs[0].steps || [];
    voiceStepIndex = 0;
    
    const routeCoords = r.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    
    if (currentRouteLayer) {
      map.removeLayer(currentRouteLayer);
    }
    
    currentRouteLayer = L.polyline(routeCoords, { color: '#3b82f6', weight: 8 }).addTo(map);
    map.fitBounds(L.latLngBounds(routeCoords), { padding: [50, 50] });
    
    document.getElementById('hudRemainDist').textContent = (r.distance/1000).toFixed(1) + ' km';
    document.getElementById('hudRemainTime').textContent = Math.round(r.duration/60) + ' phút';
    document.getElementById('hudNextStopName').textContent = endPoint.name;
    
    startWatching();
    startVoice();
    
    saveHistory(startPoint, endPoint, r.distance);
    
  } catch (e) {
    console.error('Lỗi lấy đường:', e);
    alert('Lỗi lấy đường: ' + e.message);
    document.getElementById('hud').classList.add('hidden');
  }
}

function startWatching() {
  if (watchId) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(pos => {
    lastUserPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, speed: pos.coords.speed || 0 };
    document.getElementById('hudSpeed').textContent = Math.round(lastUserPos.speed * 3.6) + ' km/h';
    if (map) map.panTo([lastUserPos.lat, lastUserPos.lng], { animate: true });
  }, null, { enableHighAccuracy: true });
}

function stopRoute() {
  document.getElementById('hud').classList.add('hidden');
  if (watchId) navigator.geolocation.clearWatch(watchId);
  if (voiceCheckTimer) clearInterval(voiceCheckTimer);
  location.reload(); 
}

function speak(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN';
  speechSynthesis.speak(u);
}

function startVoice() {
  speak('Bắt đầu dẫn đường.');
  document.getElementById('hudBtnVoice').classList.add('active');
  voiceCheckTimer = setInterval(() => {
    if (!lastUserPos || !voiceRouteSteps) return;
    const step = voiceRouteSteps[voiceStepIndex];
    if (!step) return;
    
    const d = calcDist(lastUserPos.lat, lastUserPos.lng, step.maneuver.location[1], step.maneuver.location[0]);
    if (d < 50) {
      speak(step.maneuver.instruction);
      voiceStepIndex++;
    }
  }, 3000);
}

function calcDist(lat1, lng1, lat2, lng2) {
  const R = 6371e3; const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
  const dp = (lat2-lat1) * Math.PI/180; const dl = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ==========================================
// HISTORY (FIREBASE)
// ==========================================
async function saveHistory(start, end, distance) {
  if (!currentUser) return;
  const historyRef = ref(db, `users/${currentUser.uid}/history`);
  const newHistoryRef = push(historyRef);
  await set(newHistoryRef, {
    startName: start.name,
    endName: end.name,
    distance: distance,
    timestamp: Date.now()
  });
}

async function loadHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i></div>';
  
  try {
    const dbRef = ref(db);
    const snapshot = await get(child(dbRef, `users/${currentUser.uid}/history`));
    if (snapshot.exists()) {
      const data = snapshot.val();
      const items = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);
      list.innerHTML = '';
      items.forEach(item => {
        const date = new Date(item.timestamp).toLocaleString('vi-VN');
        list.innerHTML += `
          <div class="history-item">
            <div class="time">${date}</div>
            <div class="route">
              <i class="fas fa-circle"></i> ${item.startName}
            </div>
            <div class="route" style="margin-top:6px;">
              <i class="fas fa-circle end"></i> ${item.endName}
            </div>
            <div style="margin-top:8px; font-size:0.8rem; color:var(--text-muted);">${(item.distance/1000).toFixed(1)} km</div>
          </div>
        `;
      });
    } else {
      list.innerHTML = '<div style="text-align:center; color:var(--text-muted);">Chưa có chuyến đi nào.</div>';
    }
  } catch (e) {
    console.error('Lỗi tải lịch sử:', e);
    list.innerHTML = 'Lỗi tải lịch sử.';
  }
}

// Expose functions to global
window.openSearchMode = openSearchMode;
window.openDirections = openDirections;
window.activateSearch = activateSearch;
window.refreshGPS = refreshGPS;
window.centerToLocation = centerToLocation;
window.startRouteFromSheet = startRouteFromSheet;
window.stopRoute = stopRoute;
window.openMenu = openMenu;
window.closeMenu = closeMenu;
window.logout = logout;

</script>
