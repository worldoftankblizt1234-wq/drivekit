<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>So sánh Nearby: TomTom vs Geoapify</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f1f5f9; }
    
    #sidebar { width: 350px; background: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto;}
    #map { flex: 1; }

    h1 { font-size: 1.2rem; color: #60a5fa; }
    .desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; margin-bottom: 10px; }
    
    .legend { display: flex; gap: 15px; background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px;}
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; }
    .dot.tomtom { background: #ef4444; }
    .dot.geoapify { background: #3b82f6; }
    .dot.center { background: #10b981; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    button {
        padding: 12px; border: none; border-radius: 8px;
        background: #334155; color: white; font-weight: bold; font-size: 0.95rem;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; justify-content: center;
    }
    button:hover { background: #475569; }
    button.primary { background: #3b82f6; }
    button.primary:hover { background: #2563eb; }
    button.locate { background: #10b981; margin-bottom: 5px; border: 1px solid #059669;}
    button.locate:hover { background: #059669; }

    .stats-box {
        background: #0f172a; border: 1px solid #334155; border-radius: 8px;
        padding: 15px; font-size: 0.9rem; margin-top: 10px; display: none;
    }
    .stats-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .stats-row:last-child { margin-bottom: 0; }
    .stats-val { font-weight: bold; font-family: monospace; font-size: 1rem; }
    .val-tomtom { color: #ef4444; }
    .val-geoapify { color: #3b82f6; }
</style>
</head>
<body>

<div id="sidebar">
    <h1><i class="fas fa-street-view"></i> Test Nearby APIs</h1>
    <p class="desc">So sánh dữ liệu địa điểm giữa TomTom và Geoapify.</p>
    
    <div class="legend">
        <div class="legend-item"><div class="dot tomtom"></div> TomTom</div>
        <div class="legend-item"><div class="dot geoapify"></div> Geoapify</div>
        <div class="legend-item"><div class="dot center"></div> Tâm</div>
    </div>

    <div class="btn-group">
        <button class="locate" onclick="locateMe()"><i class="fas fa-location-arrow"></i> Định vị tôi (GPS)</button>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 5px 0;">
        <button class="primary" onclick="searchBoth('cafe')"><i class="fas fa-coffee"></i> Tìm Quán Cafe</button>
        <button class="primary" onclick="searchBoth('restaurant')"><i class="fas fa-utensils"></i> Tìm Nhà hàng</button>
        <button class="primary" onclick="searchBoth('hotel')"><i class="fas fa-hotel"></i> Tìm Khách sạn</button>
        <button class="primary" onclick="searchBoth('gas_station')"><i class="fas fa-gas-pump"></i> Tìm Trạm xăng</button>
        <button onclick="clearMarkers()" style="margin-top: 10px; background: #ef4444;"><i class="fas fa-trash"></i> Xóa tất cả Marker</button>
    </div>

    <div class="stats-box" id="statsBox">
        <h3 style="font-size:1rem; margin-bottom:10px; color:#94a3b8;">Kết quả trả về:</h3>
        <div class="stats-row"><span>TomTom (Đỏ):</span> <span class="stats-val val-tomtom" id="countTomTom">0</span></div>
        <div class="stats-row"><span>Geoapify (Xanh):</span> <span class="stats-val val-geoapify" id="countGeoapify">0</span></div>
    </div>
</div>

<div id="map"></div>

<script>
    // ===== CẤU HÌNH =====
    const TOMTOM_KEY = 'tG84Z1Yh4rauGWjz6pRn98rrWymLjTru';
    const GEOAPIFY_KEY = '4e7d216f24a14d54a8e667e28ca80989';
    
    // Tâm bản đồ mặc định (sẽ bị thay đổi khi bấm Định vị)
    let CENTER_LAT = 21.0285;
    let CENTER_LNG = 105.8542;
    const RADIUS = 1500; // Bán kính 1.5km

    // Ánh xạ danh mục
    const CATEGORIES = {
        'cafe': { tomtom: '7315', geoapify: 'catering.cafe' },
        'restaurant': { tomtom: '7314', geoapify: 'catering.restaurant' },
        'hotel': { tomtom: '7314', geoapify: 'accommodation.hotel' },
        'gas_station': { tomtom: '7313', geoapify: 'service.vehicle.fuel' }
    };

    let tomtomMarkers = [];
    let geoapifyMarkers = [];
    let centerMarker = null; // Marker màu xanh ở giữa

    // Khởi tạo bản đồ
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [CENTER_LNG, CENTER_LAT],
        zoom: 15
    });
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // Hàm vẽ lại điểm tâm bản đồ
    function drawCenterMarker() {
        if (centerMarker) centerMarker.remove();
        const centerEl = document.createElement('div');
        centerEl.innerHTML = `<div style="background:#10b981; width:16px; height:16px; border-radius:50%; border:3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.5);"></div>`;
        centerMarker = new maplibregl.Marker({ element: centerEl }).setLngLat([CENTER_LNG, CENTER_LAT]).addTo(map);
    }

    // Khởi tạo điểm tâm ban đầu
    drawCenterMarker();

    // Hàm Định vị GPS
    function locateMe() {
        if (!navigator.geolocation) {
            alert("Trình duyệt của bạn không hỗ trợ GPS!");
            return;
        }
        
        // Hiệu ứng loading trên nút
        const btn = document.querySelector('button.locate');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tìm...';
        
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                CENTER_LAT = pos.coords.latitude;
                CENTER_LNG = pos.coords.longitude;
                
                // Bay tới vị trí mới
                map.flyTo({ center: [CENTER_LNG, CENTER_LAT], zoom: 16 });
                drawCenterMarker();
                clearMarkers(); // Xoá kết quả cũ vì đã đổi vị trí
                
                btn.innerHTML = '<i class="fas fa-location-arrow"></i> Định vị tôi (GPS)';
            },
            (err) => {
                alert("Không lấy được vị trí. Hãy kiểm tra quyền truy cập GPS.");
                console.error(err);
                btn.innerHTML = '<i class="fas fa-location-arrow"></i> Định vị tôi (GPS)';
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    function clearMarkers() {
        tomtomMarkers.forEach(m => m.remove());
        geoapifyMarkers.forEach(m => m.remove());
        tomtomMarkers = [];
        geoapifyMarkers = [];
        document.getElementById('statsBox').style.display = 'none';
    }

    function createPin(color, label) {
        const el = document.createElement('div');
        el.style.width = '24px';
        el.style.height = '24px';
        el.style.background = color;
        el.style.borderRadius = '50%';
        el.style.border = '2px solid white';
        el.style.boxShadow = '0 3px 6px rgba(0,0,0,0.4)';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'center';
        el.style.fontSize = '10px';
        el.style.color = 'white';
        el.innerHTML = `<i class="fas ${label}"></i>`;
        return el;
    }

    async function searchBoth(type) {
        clearMarkers();
        const btnBox = document.getElementById('statsBox');
        btnBox.style.display = 'block';
        document.getElementById('countTomTom').textContent = '...';
        document.getElementById('countGeoapify').textContent = '...';

        const cat = CATEGORIES[type];
        const iconLabel = type === 'cafe' ? 'fa-coffee' : type === 'hotel' ? 'fa-hotel' : type === 'restaurant' ? 'fa-utensils' : 'fa-gas-pump';

        // ==========================================
        // 1. GỌI TOMTOM
        // ==========================================
        try {
            const ttUrl = `https://api.tomtom.com/search/2/nearbySearch/.json?key=${TOMTOM_KEY}&lat=${CENTER_LAT}&lon=${CENTER_LNG}&radius=${RADIUS}&categorySet=${cat.tomtom}&limit=30`;
            const res = await fetch(ttUrl);
            const data = await res.json();
            
            if (data.results) {
                data.results.forEach(poi => {
                    const name = poi.poi?.name || 'Không tên';
                    const lat = poi.position.lat;
                    const lng = poi.position.lon;
                    
                    const el = createPin('#ef4444', iconLabel);
                    const popup = new maplibregl.Popup({ offset: 15 }).setHTML(`<b style="color:#ef4444;">TomTom</b><br>${name}`);
                    const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).setPopup(popup).addTo(map);
                    tomtomMarkers.push(marker);
                });
                document.getElementById('countTomTom').textContent = data.results.length;
            } else {
                document.getElementById('countTomTom').textContent = '0';
            }
        } catch (e) {
            console.error('TomTom Error:', e);
            document.getElementById('countTomTom').textContent = 'Lỗi';
        }

        // ==========================================
        // 2. GỌI GEOAPIFY
        // ==========================================
        try {
            const geoUrl = `https://api.geoapify.com/v2/places?categories=${cat.geoapify}&filter=circle:${CENTER_LNG},${CENTER_LAT},${RADIUS}&bias=proximity:${CENTER_LNG},${CENTER_LAT}&limit=30&apiKey=${GEOAPIFY_KEY}`;
            const res = await fetch(geoUrl);
            const data = await res.json();
            
            if (data.features) {
                data.features.forEach(poi => {
                    const name = poi.properties.name || poi.properties.address_line1 || 'Không tên';
                    const lat = poi.properties.lat;
                    const lng = poi.properties.lon;
                    
                    const el = createPin('#3b82f6', iconLabel);
                    const popup = new maplibregl.Popup({ offset: 15 }).setHTML(`<b style="color:#3b82f6;">Geoapify</b><br>${name}`);
                    const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).setPopup(popup).addTo(map);
                    geoapifyMarkers.push(marker);
                });
                document.getElementById('countGeoapify').textContent = data.features.length;
            } else {
                document.getElementById('countGeoapify').textContent = '0';
            }
        } catch (e) {
            console.error('Geoapify Error:', e);
            document.getElementById('countGeoapify').textContent = 'Lỗi';
        }
    }
</script>
</body>
</html>
