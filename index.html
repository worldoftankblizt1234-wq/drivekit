<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DriveKit Preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#0b1220;--surface:#1e293b;--surface-2:#334155;--surface-3:#475569;--primary:#3b82f6;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--text:#f1f5f9;--muted:#94a3b8;--border:rgba(255,255,255,.08);--safe-top:env(safe-area-inset-top,0);--safe-bot:env(safe-area-inset-bottom,0)}
body.light{--bg:#f8fafc;--surface:#fff;--surface-2:#e2e8f0;--surface-3:#cbd5e1;--text:#0f172a;--muted:#64748b;--border:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.hidden{display:none!important}.full{width:100%}.mt{margin-top:12px}.mb{margin-bottom:12px}.muted{color:var(--muted);font-size:.85rem}
.fullscreen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.logo-pulse{font-size:4rem;color:var(--primary);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.95)}}
.brand{font-size:2rem;font-weight:900;margin:16px 0}
.progress-track{width:220px;height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--success));transition:width .3s;width:0}
.loading-text{color:var(--muted);font-size:.85rem}
.auth-card{width:100%;max-width:400px;background:var(--surface);padding:32px 24px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-card h1{text-align:center;font-size:1.8rem;margin-bottom:6px}
.auth-card p{text-align:center;color:var(--muted);margin-bottom:24px;font-size:.9rem}
.auth-card input{width:100%;padding:14px;margin-bottom:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem;outline:none}
.auth-error{color:var(--danger);font-size:.85rem;margin-bottom:12px;display:none}
.auth-toggle{text-align:center;font-size:.9rem;margin-top:16px;color:var(--muted)}
.auth-toggle a{color:var(--primary);text-decoration:none;font-weight:700;margin-left:4px}
.btn{padding:13px 16px;border-radius:10px;border:none;font-weight:700;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s;width:100%}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-google{background:#fff;color:#1f2937;border:1px solid var(--border)}
#map{position:fixed;inset:0;width:100%;height:100%}
.search-bar{position:fixed;top:calc(12px + var(--safe-top));left:12px;right:12px;display:flex;gap:8px;z-index:100}
.search-field{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.search-field i{color:var(--muted)}
.search-field input{flex:1;border:none;background:transparent;color:var(--text);font-size:.95rem;outline:none}
.fab-btn{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.fab-btn:active{transform:scale(.94)}
.fab-btn.primary,.fab-btn.active{background:var(--primary);color:#fff;border-color:transparent}
.clear-btn{width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem}
.fab-stack{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:100}
.suggestions{position:fixed;top:calc(72px + var(--safe-top));left:12px;right:12px;max-height:55vh;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;z-index:150}
.suggestions.show{display:block}
.sug-item{padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.9rem}
.sug-item:last-child{border-bottom:none}.sug-item:hover{background:var(--surface-2)}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.4);z-index:300;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:var(--safe-bot)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--surface-3);border-radius:2px;margin:10px auto 0}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.sheet-header h2{font-size:1.1rem;font-weight:800}
.close-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-body{padding:12px 18px 20px;overflow-y:auto;flex:1}
.dir-inputs{display:flex;flex-direction:column;gap:10px}
.dir-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 14px}
.dir-row i{width:18px;text-align:center;font-size:.75rem}
.dot-start{color:var(--success)}.dot-end{color:var(--danger);font-size:.9rem}
.dir-row input{flex:1;border:none;background:transparent;color:var(--text);outline:none;font-size:.95rem}
.section-label{font-size:.75rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;letter-spacing:.5px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip-row.wrap{flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.active{background:var(--primary);color:#fff;border-color:transparent}
.route-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.route-card:hover{background:var(--surface-2)}
.route-card.active{border-color:var(--primary);background:rgba(59,130,246,.1)}
.route-card h3{font-size:.95rem;margin-bottom:4px}
.route-card p{font-size:.8rem;color:var(--muted)}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--muted);overflow:hidden}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--bg);border-radius:10px;margin-bottom:16px}
.toggle-row input[type="checkbox"]{width:42px;height:24px;appearance:none;background:var(--surface-2);border-radius:12px;position:relative;cursor:pointer;transition:background .2s}
.toggle-row input[type="checkbox"]::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle-row input[type="checkbox"]:checked{background:var(--primary)}
.toggle-row input[type="checkbox"]:checked::after{transform:translateX(18px)}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px}
.list-item .time{font-size:.7rem;color:var(--muted);margin-bottom:6px}
.list-item .line{font-size:.85rem;display:flex;align-items:center;gap:6px;margin-top:3px}
.list-item .line i{font-size:.6rem}
.list-item .line .start{color:var(--success)}
.list-item .line .end{color:var(--danger)}
.list-item .meta{font-size:.75rem;color:var(--muted);margin-top:6px}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.report-btn{padding:16px 8px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;font-weight:700}
.report-btn:hover{background:var(--surface-2)}
.report-btn i{font-size:1.3rem;color:var(--primary)}
.hud{position:fixed;top:calc(12px + var(--safe-top));left:12px;right:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:14px;z-index:200}
.hud-main{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.hud-arrow{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#2563eb);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hud-info{flex:1;min-width:0}
.hud-dist{font-size:1.05rem;font-weight:800;color:var(--primary);margin-bottom:2px}
.hud-instr{font-size:.85rem;line-height:1.3}
.hud-stats{display:flex;gap:16px;padding-top:10px;border-top:1px solid var(--border);font-size:.8rem}
.hud-stats i{color:var(--muted);margin-right:4px}
.hud-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.hud-actions .fab-btn{width:40px;height:40px}
.popup-menu{position:fixed;right:70px;top:50%;transform:translateY(-50%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:8px;display:none;z-index:200;min-width:180px}
.popup-menu.show{display:block}
.popup-item{padding:12px 16px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.9rem}
.popup-item:hover{background:var(--surface-2)}
.popup-item.active{background:var(--primary);color:#fff}
.rotate-controls{position:fixed;right:12px;bottom:calc(20px + var(--safe-bot));display:flex;flex-direction:column;gap:8px;z-index:90}
.rotate-btn,.compass{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.compass{border-radius:50%;position:relative}
.compass-arrow{width:2px;height:22px;background:linear-gradient(to bottom,var(--danger) 50%,var(--muted) 50%);border-radius:1px;transition:transform .3s;position:relative}
.compass-arrow::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--danger)}
.rotate-btn.active{background:var(--primary);color:#fff}
.toast-container{position:fixed;top:calc(80px + var(--safe-top));left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:.85rem;font-weight:600;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;animation:slide .3s ease-out;max-width:300px}
.toast.success{border-color:var(--success)}.toast.success i{color:var(--success)}
.toast.error{border-color:var(--danger)}.toast.error i{color:var(--danger)}
.toast.warning{border-color:var(--warning)}.toast.warning i{color:var(--warning)}
@keyframes slide{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);padding:14px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700}
.stat i{font-size:1.2rem;color:var(--primary)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<div id="loadingScreen" class="fullscreen">
  <div class="logo-pulse"><i class="fas fa-route"></i></div>
  <h1 class="brand">DriveKit</h1>
  <div class="progress-track"><div id="loadingPercent" class="progress-fill"></div></div>
  <p id="loadingText" class="loading-text">Đang khởi tạo...</p>
</div>

<div id="authScreen" class="fullscreen hidden">
  <div class="auth-card">
    <h1 id="authTitle">DriveKit 🚌</h1>
    <p id="authSubtitle">Mọi hành trình, một giải pháp</p>
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPassword" type="password" placeholder="Mật khẩu">
    <div id="authError" class="auth-error"></div>
    <button id="btnSubmitAuth" class="btn btn-primary" style="margin-bottom:8px">Đăng nhập</button>
    <button id="btnGoogleAuth" class="btn btn-google"><i class="fab fa-google"></i> Google</button>
    <div class="auth-toggle">
      <span id="authToggleText">Chưa có tài khoản?</span>
      <a href="#" id="authToggleBtn">Đăng ký</a>
    </div>
  </div>
</div>

<div id="appUI" class="hidden">
  <div id="map"></div>

  <div id="searchBar" class="search-bar">
    <div class="search-field" onclick="window.activateSearch('view')">
      <i class="fas fa-search"></i>
      <input id="topSearchInput" readonly placeholder="Tìm địa điểm...">
      <button id="searchClearBtn" class="clear-btn hidden" onclick="event.stopPropagation();window.clearTopSearch()"><i class="fas fa-times"></i></button>
    </div>
    <button class="fab-btn" onclick="window.openMenu()"><i class="fas fa-user"></i></button>
  </div>

  <div id="suggestionsBox" class="suggestions"></div>

  <div id="fabStack" class="fab-stack">
    <button class="fab-btn" onclick="window.toggleLayerMenu()"><i class="fas fa-layer-group"></i></button>
    <button class="fab-btn" id="btn3D" onclick="window.toggle3D()"><i class="fas fa-cube"></i></button>
    <button class="fab-btn" onclick="window.openReportMenu()"><i class="fas fa-exclamation-triangle"></i></button>
    <button class="fab-btn" onclick="window.centerToLocation()"><i class="fas fa-crosshairs"></i></button>
    <button class="fab-btn primary" onclick="window.openDirections()"><i class="fas fa-directions"></i></button>
  </div>

  <div id="layerMenu" class="popup-menu">
    <div class="popup-item active" data-layer="trackasia" onclick="window.setMapLayer('trackasia',this)"><i class="fas fa-map"></i> TrackAsia</div>
    <div class="popup-item" data-layer="carto" onclick="window.setMapLayer('carto',this)"><i class="fas fa-map-marked-alt"></i> Carto Light</div>
    <div class="popup-item" data-layer="satellite" onclick="window.setMapLayer('satellite',this)"><i class="fas fa-satellite"></i> Vệ tinh</div>
  </div>

  <div id="dirSheet" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Chỉ đường</h2><button class="close-btn" onclick="window.closeDirections()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div class="dir-inputs">
        <div class="dir-row">
          <i class="fas fa-circle dot-start"></i>
          <input id="dirInputStart" readonly placeholder="Điểm đi" onclick="window.activateSearch('start')">
          <button class="clear-btn" onclick="window.clearPoint('start')"><i class="fas fa-times"></i></button>
        </div>
        <div class="dir-row">
          <i class="fas fa-map-marker-alt dot-end"></i>
          <input id="dirInputEnd" readonly placeholder="Điểm đến" onclick="window.activateSearch('end')">
          <button class="clear-btn" onclick="window.clearPoint('end')"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div class="section-label">Phương tiện</div>
      <div class="chip-row" id="vehicleModes">
        <button class="chip active" data-mode="motorcycle" onclick="window.setVehicleMode('motorcycle',this)"><i class="fas fa-motorcycle"></i> Xe máy</button>
        <button class="chip" data-mode="car" onclick="window.setVehicleMode('car',this)"><i class="fas fa-car"></i> Xe hơi</button>
        <button class="chip" data-mode="truck" onclick="window.setVehicleMode('truck',this)"><i class="fas fa-truck"></i> Xe tải</button>
        <button class="chip" data-mode="bicycle" onclick="window.setVehicleMode('bicycle',this)"><i class="fas fa-bicycle"></i> Xe đạp</button>
        <button class="chip" data-mode="walking" onclick="window.setVehicleMode('walking',this)"><i class="fas fa-walking"></i> Đi bộ</button>
      </div>
      <button class="btn btn-primary full mt" onclick="window.fetchAndShowRoute()"><i class="fas fa-search"></i> Tìm tuyến đường</button>
    </div>
  </div>

  <div id="routeOptionsModal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Chọn tuyến</h2><button class="close-btn" onclick="window.closeRouteOptions()"><i class="fas fa-times"></i></button></div>
    <div id="routeOptionsBody" class="sheet-body"></div>
  </div>

  <div id="profileModal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Tài khoản</h2><button class="close-btn" onclick="window.closeMenu()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div class="profile-head">
        <div id="profileAvatar" class="avatar"><i class="fas fa-user"></i></div>
        <div style="flex:1"><div id="profileName" style="font-weight:800">--</div><div id="profileEmail" class="muted">--</div></div>
      </div>
      <div class="toggle-row">
        <span><i class="fas fa-moon"></i> Chế độ sáng</span>
        <input type="checkbox" id="themeToggle" onchange="window.toggleTheme()">
      </div>
      <div class="section-label">Lịch sử chuyến đi</div>
      <div id="historyList" class="list" style="max-height:40vh;overflow-y:auto"></div>
      <button class="btn btn-primary full mt" onclick="window.logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
    </div>
  </div>

  <div id="reportModal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Báo cáo sự cố</h2><button class="close-btn" onclick="window.closeReportMenu()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div class="report-grid">
        <button class="report-btn" onclick="window.submitReport('police')"><i class="fas fa-shield-alt"></i> CSGT</button>
        <button class="report-btn" onclick="window.submitReport('accident')"><i class="fas fa-car-crash"></i> Tai nạn</button>
        <button class="report-btn" onclick="window.submitReport('traffic')"><i class="fas fa-traffic-light"></i> Kẹt xe</button>
        <button class="report-btn" onclick="window.submitReport('pothole')"><i class="fas fa-exclamation-circle"></i> Ổ gà</button>
        <button class="report-btn" onclick="window.submitReport('flood')"><i class="fas fa-water"></i> Ngập</button>
        <button class="report-btn" onclick="window.submitReport('bridge_collapse')"><i class="fas fa-road-circle-xmark"></i> Sập cầu</button>
        <button class="report-btn" onclick="window.submitReport('road_collapse')"><i class="fas fa-triangle-exclamation"></i> Sập đường</button>
      </div>
    </div>
  </div>

  <div id="savePlaceModal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Ghim địa điểm</h2><button class="close-btn" onclick="window.closeSavePlaceModal()"><i class="fas fa-times"></i></button></div>
    <div class="sheet-body">
      <div id="savePlaceAddress" class="muted mb">--</div>
      <div class="report-grid">
        <button class="report-btn" onclick="window.submitSavePlace('home')"><i class="fas fa-home"></i> Nhà</button>
        <button class="report-btn" onclick="window.submitSavePlace('company')"><i class="fas fa-building"></i> Công ty</button>
        <button class="report-btn" onclick="window.submitSavePlace('school')"><i class="fas fa-school"></i> Trường</button>
        <button class="report-btn" onclick="window.submitSavePlace('cafe')"><i class="fas fa-coffee"></i> Cafe</button>
        <button class="report-btn" onclick="window.submitSavePlace('restaurant')"><i class="fas fa-utensils"></i> Quán ăn</button>
        <button class="report-btn" onclick="window.submitSavePlace('other')"><i class="fas fa-map-marker-alt"></i> Khác</button>
      </div>
    </div>
  </div>

  <div id="endTripModal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h2>Kết thúc chuyến đi</h2></div>
    <div class="sheet-body">
      <div class="stats-grid">
        <div class="stat"><i class="fas fa-road"></i><span id="endTripDist">--</span></div>
        <div class="stat"><i class="fas fa-clock"></i><span id="endTripTime">--</span></div>
        <div class="stat"><i class="fas fa-tachometer-alt"></i><span id="endTripAvgSpeed">--</span></div>
        <div class="stat"><i class="fas fa-flag-checkered"></i><span id="endTripDest">--</span></div>
      </div>
      <div class="row-2 mt">
        <button class="btn btn-secondary" onclick="window.endTrip(false)">Không lưu</button>
        <button class="btn btn-primary" onclick="window.endTrip(true)"><i class="fas fa-save"></i> Lưu tuyến</button>
      </div>
    </div>
  </div>

  <div id="hud" class="hud hidden">
    <div class="hud-main">
      <div id="hudNextArrow" class="hud-arrow"><i class="fas fa-arrow-up"></i></div>
      <div class="hud-info">

// ═══════════════ GPS ═══════════════
function askPositionOnce() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude: lat, longitude: lng, heading } = pos.coords;
      state.lastUserPos = { lat, lng, speed: pos.coords.speed || 0 };
      state.lastHeading = heading || 0;
      updateUserMarker(lat, lng, state.lastHeading);
      state.map.flyTo({ center: [lng, lat], zoom: 16 });
      if (!state.startPoint) {
        state.startPoint = { lat, lng, name: 'Vị trí của tôi' };
        $('dirInputStart').value = 'Vị trí của tôi';
      }
    },
    (err) => console.warn('GPS once:', err),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function startGPSWatch() {
  if (!navigator.geolocation) return;
  state.watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude: lat, longitude: lng, heading, speed } = pos.coords;
      state.lastUserPos = { lat, lng, speed: speed || 0 };
      if (heading != null) state.lastHeading = heading;
      updateUserMarker(lat, lng, state.lastHeading);
      if (state.isNavigating) updateNavigation();
    },
    (err) => console.warn('GPS watch:', err),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
}

function updateUserMarker(lat, lng, heading) {
  if (!state.map) return;
  const html = `<div style="transform:rotate(${heading || 0}deg);width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2L22 20L12 16L2 20L12 2Z" fill="#10b981" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg></div>`;
  if (state.userMarker) {
    state.userMarker.setLngLat([lng, lat]);
    state.userMarker.getElement().innerHTML = html;
  } else {
    const el = document.createElement('div');
    el.innerHTML = html;
    state.userMarker = new maplibregl.Marker({ element: el.firstElementChild })
      .setLngLat([lng, lat]).addTo(state.map);
  }
}

window.centerToLocation = () => {
  if (!state.lastUserPos) return showToast('Chưa có GPS', 'warning');

};

// ═══════════════ SEARCH ═══════════════
window.activateSearch = (context) => {

  box.classList.add('show');

  const inp = $('topSearchInput');
  inp.readOnly = false; inp.value = ''; inp.focus();
  $('searchClearBtn').classList.add('hidden');
  inp.oninput = (e) => {
    const q = e.target.value.trim();
    $('searchClearBtn').classList.toggle('hidden', !q);
    if (q.length < 2) return;

    state.searchTimer = setTimeout(() => doSearch(q), 400);
  };

window.clearTopSearch = () => {
  $('topSearchInput').value = ''; $('topSearchInput').readOnly = true;
  $('searchClearBtn').classList.add('hidden');
  $('suggestionsBox').classList.remove('show');

async function doSearch(q) {
  const box = $('suggestionsBox');
  box.innerHTML = '<div class="sug-item"><i class="fas fa-spinner fa-spin"></i> Đang tìm...</div>';
  try {
    const url = `https://maps.track-asia.com/api/v2/place/textsearch/json?query=${encodeURIComponent(q)}&key=${TRACKASIA_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const results = data.results || data.predictions || [];
    if (!results.length) { box.innerHTML = '<div class="sug-item">Không tìm thấy</div>'; return; }
    box.innerHTML = '';
    results.slice(0, 15).forEach(r => {
      const name = r.name || r.formatted_address || 'Không tên';
      const addr = r.formatted_address || '';
      const lat = r.geometry?.location?.lat ?? r.lat;
      const lng = r.geometry?.location?.lng ?? r.lng;
      if (lat == null || lng == null) return;
      const div = document.createElement('div');
      div.className = 'sug-item';
      div.innerHTML = `<i class="fas fa-map-marker-alt" style="color:var(--primary)"></i><div style="flex:1"><div style="font-weight:700">${escapeHtml(name)}</div><div style="font-size:.75rem;color:var(--muted)">${escapeHtml(addr)}</div></div>`;
      div.onclick = () => selectLocation(lat, lng, name);
      box.appendChild(div);
    });
  } catch (e) {
    box.innerHTML = `<div class="sug-item" style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(e.message)}<br><small>CORS có thể chặn — sẽ fix bằng Worker</small></div>`;
  }
}

async function selectLocation(lat, lng, name) {
  $('topSearchInput').value = name; $('topSearchInput').readOnly = true;
  $('suggestionsBox').classList.remove('show');
  state.map.flyTo({ center: [lng, lat], zoom: 16 });
  if (state.searchContext === 'start') { state.startPoint = { lat, lng, name }; $('dirInputStart').value = name; }
  else if (state.searchContext === 'end') { state.endPoint = { lat, lng, name }; $('dirInputEnd').value = name; }
}

window.clearPoint = (w) => {
  if (w === 'start') { state.startPoint = null; $('dirInputStart').value = ''; }
  else { state.endPoint = null; $('dirInputEnd').value = ''; }
};

async function reverseGeocode(lat, lng) {
  try {
    const url = `https://maps.track-asia.com/api/v2/geocode/json?latlng=${lat},${lng}&key=${TRACKASIA_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    return data.results?.[0]?.formatted_address || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch { return `${lat.toFixed(5)}, ${lng.toFixed(5)}`; }
}

// ═══════════════ ROUTING ═══════════════
window.openDirections = () => {
  $('dirSheet').classList.add('open');

window.setVehicleMode = (m, btn) => {

window.fetchAndShowRoute = async () => {
  if (!state.startPoint || !state.endPoint) return showToast('Chọn đủ điểm đi và đến', 'warning');
  const body = $('routeOptionsBody');
  body.innerHTML = '<div style="text-align:center;padding:30px"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary)"></i><p style="margin-top:10px;color:var(--muted)">Đang tìm tuyến...</p></div>';
  $('routeOptionsModal').classList.add('open');
  try {
    const route = await fetchRoute(state.startPoint, state.endPoint, state.vehicleMode);
    state.currentRoute = route;
    drawRouteLine(route.coords);
    const lngs = route.coords.map(c => c[0]), lats = route.coords.map(c => c[1]);
    state.map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]], { padding: 80 });
    const dist = (route.distance / 1000).toFixed(1), dur = Math.round(route.duration / 60);
    body.innerHTML = `
      <div class="route-card active">
        <div style="flex:1"><h3><i class="fas fa-route"></i> Tuyến đường</h3><p><i class="fas fa-road"></i> ${dist} km • <i class="fas fa-clock"></i> ${dur} phút</p></div>
      </div>
      <button class="btn btn-primary full mt" onclick="window.startNavigation()"><i class="fas fa-play"></i> Bắt đầu dẫn đường</button>
      <button class="btn btn-secondary full mt" onclick="window.closeRouteOptions()">Đóng</button>`;
  } catch (e) {
    body.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger)"><i class="fas fa-exclamation-triangle" style="font-size:2rem"></i><p style="margin-top:10px">${escapeHtml(e.message)}</p><p style="font-size:.75rem;color:var(--muted);margin-top:6px">Có thể API TrackAsia bị chặn CORS — cần dùng Worker proxy</p></div>`;
  }
};

async function fetchRoute(from, to, mode) {
  const vehicle = { motorcycle: 'bike', car: 'car', truck: 'truck', bicycle: 'bike', walking: 'foot' }[mode] || 'car';
  const url = `https://maps.track-asia.com/api/v2/direction?origin=${from.lat},${from.lng}&destination=${to.lat},${to.lng}&vehicle=${vehicle}&key=${TRACKASIA_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  console.log('[Route resp]', data);
  const r = data.routes?.[0];
  if (!r) throw new Error(data.error?.message || 'Không tìm được tuyến');
  let coords = [];
  if (r.geometry?.coordinates) coords = r.geometry.coordinates;
  else if (r.overview_polyline?.points) coords = decodePolyline(r.overview_polyline.points);
  const leg = r.legs?.[0] || {};
  return { coords, distance: leg.distance?.value || 0, duration: leg.duration?.value || 0, steps: leg.steps || [] };
}

function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0, out = [];
  while (i < str.length) {
    let b, sh = 0, r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    sh = 0; r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lng += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push([lng / 1e5, lat / 1e5]);
  }
  return out;
}

function drawRouteLine(coords) {
  if (state.map.getLayer('route-line')) state.map.removeLayer('route-line');
  if (state.map.getSource('route')) state.map.removeSource('route');
  state.map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
  state.map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#3b82f6', 'line-width': 6, 'line-opacity': 0.9 }
  });
}

window.closeRouteOptions = () => $('routeOptionsModal').classList.remove('open');

// ═══════════════ NAVIGATION ═══════════════
window.startNavigation = () => {
  if (!state.currentRoute) return;
  state.isNavigating = true;
  state.tripStartTime = Date.now();
  $('routeOptionsModal').classList.remove('open');
  $('dirSheet').classList.remove('open');
  $('hud').classList.remove('hidden');
  $('fabStack').classList.add('hidden');
  $('hudRemainDist').textContent = (state.currentRoute.distance / 1000).toFixed(1) + ' km';
  $('hudRemainTime').textContent = Math.round(state.currentRoute.duration / 60) + ' phút';
  if (state.lastUserPos) state.map.easeTo({ center: [state.lastUserPos.lng, state.lastUserPos.lat], zoom: 17, duration: 500 });
  updateNavigation();
};

function updateNavigation() {
  if (!state.isNavigating || !state.lastUserPos) return;
  if (state.lastHeading != null) state.map.easeTo({ bearing: state.lastHeading, duration: 500 });
  $('hudSpeed').textContent = Math.round((state.lastUserPos.speed || 0) * 3.6) + ' km/h';
  const steps = state.currentRoute?.steps || [];
  if (!steps.length) {
    $('hudNextDist').textContent = 'Đi thẳng';
    $('hudNextInstr').textContent = 'Tiếp tục đến đích';
    return;
  }
  let next = null, minD = Infinity;
  steps.forEach(s => {
    const lat = s.location?.lat ?? s.maneuver?.location?.[1];
    const lng = s.location?.lng ?? s.maneuver?.location?.[0];
    if (lat == null || lng == null) return;
    const d = haversine(state.lastUserPos.lat, state.lastUserPos.lng, lat, lng);
    if (d > 5 && d < minD) { minD = d; next = s; }
  });
  if (next) {
    $('hudNextDist').textContent = minD > 1000 ? (minD / 1000).toFixed(1) + ' km' : Math.round(minD) + ' m';
    $('hudNextInstr').textContent = next.instruction || 'Tiếp tục';
  }
}

window.openEndTripModal = () => {
  if (!state.currentRoute) return;
  const el = state.tripStartTime ? (Date.now() - state.tripStartTime) / 1000 : 0;
  $('endTripDist').textContent = (state.currentRoute.distance / 1000).toFixed(1) + ' km';
  $('endTripTime').textContent = Math.max(1, Math.round(el / 60)) + ' phút';
  $('endTripAvgSpeed').textContent = el > 5 ? ((state.currentRoute.distance / 1000) / (el / 3600)).toFixed(1) + ' km/h' : '--';
  $('endTripDest').textContent = state.endPoint?.name || '--';
  $('endTripModal').classList.add('open');
};

window.endTrip = async (save) => {
  if (save && state.user && state.currentRoute) {
    try {
      const r = push(ref(db, `users/${state.user.uid}/history`));
      await set(r, {
        startName: state.startPoint?.name || '',
        endName: state.endPoint?.name || '',
        distance: state.currentRoute.distance,
        duration: state.currentRoute.duration,
        timestamp: Date.now()
      });
      showToast('Đã lưu chuyến đi', 'success');
    } catch (e) { showToast('Lỗi lưu: ' + e.message, 'error'); }
  }
  state.isNavigating = false;
  state.currentRoute = null;
  state.tripStartTime = null;
  $('endTripModal').classList.remove('open');
  $('hud').classList.add('hidden');
  $('fabStack').classList.remove('hidden');
  $('dirInputEnd').value = '';
  state.endPoint = null;
  if (state.map.getLayer('route-line')) state.map.removeLayer('route-line');
  if (state.map.getSource('route')) state.map.removeSource('route');
  state.map.easeTo({ bearing: 0, pitch: 0, duration: 500 });
};

// ═══════════════ LAYER / 3D / ROTATE ═══════════════
window.toggleLayerMenu = () => $('layerMenu').classList.toggle('show');

window.setMapLayer = (name, item) => {
  document.querySelectorAll('.popup-item').forEach(i => i.classList.remove('active'));
  item.classList.add('active');
  $('layerMenu').classList.remove('show');
  state.currentLayer = name;
  if (name === 'trackasia') {
    state.map.setStyle(`https://maps.track-asia.com/styles/v2/streets.json?key=${TRACKASIA_KEY}`);
    $('mapRotateControls').style.display = 'flex';
  } else if (name === 'carto') {
    state.map.setStyle('https://basemaps.cartocdn.com/gl/positron-gl-style/style.json');
    $('mapRotateControls').style.display = 'none';
  } else if (name === 'satellite') {
    state.map.setStyle({
      version: 8,
      sources: { sat: { type: 'raster', tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize: 256 } },
      layers: [{ id: 'sat', type: 'raster', source: 'sat' }]
    });
    $('mapRotateControls').style.display = 'none';
  }
};

window.toggle3D = () => {
  state.is3D = !state.is3D;
  state.map.easeTo({ pitch: state.is3D ? 55 : 0, duration: 500 });
  $('btn3D').classList.toggle('active', state.is3D);
};
window.rotateMap = (d) => {
  state.bearing = (state.bearing + d + 360) % 360;
  state.map.easeTo({ bearing: state.bearing, duration: 300 });
};
window.resetNorth = () => { state.bearing = 0; state.map.easeTo({ bearing: 0, duration: 500 }); };
window.toggleTilt = () => {
  state.pitch = state.pitch > 10 ? 0 : 45;
  state.map.easeTo({ pitch: state.pitch, duration: 500 });
  $('tiltBtn').classList.toggle('active', state.pitch > 10);
};

// ═══════════════ REPORTS ═══════════════
window.openReportMenu = () => $('reportModal').classList.add('open');
window.closeReportMenu = () => $('reportModal').classList.remove('open');

window.submitReport = async (type) => {
  if (!state.user || !state.lastUserPos) return showToast('Chưa có GPS', 'warning');
  const ttl = { pothole: 86400000, flood: 10800000, traffic: 1800000, bridge_collapse: 604800000, road_collapse: 604800000 }[type] || 3600000;
  try {
    const r = push(ref(db, 'reports'));
    await set(r, { lat: state.lastUserPos.lat, lng: state.lastUserPos.lng, type, timestamp: Date.now(), expiresAt: Date.now() + ttl, uid: state.user.uid });
    showToast('Đã gửi báo cáo', 'success');
    closeReportMenu();
  } catch (e) { showToast('Lỗi: ' + e.message, 'error'); }
};

function subscribeReports() {
  onValue(ref(db, 'reports'), (snap) => { state.allReports = snap.val() || {}; renderReports(); });
}

function renderReports() {
  document.querySelectorAll('.report-marker').forEach(m => m.remove());
  const now = Date.now();
  Object.values(state.allReports).forEach(r => {
    if (now > r.expiresAt) return;
    const el = document.createElement('div');
    el.className = 'report-marker';
    el.style.cssText = 'width:30px;height:30px;background:#ef4444;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.4)';
    el.innerHTML = '<i class="fas fa-exclamation"></i>';
    new maplibregl.Marker(el).setLngLat([r.lng, r.lat]).addTo(state.map);
  });
}

// ═══════════════ SAVE PLACE ═══════════════
window.showSavePlace = (lat, lng, name) => {
  state.tempPin = { lat, lng, name };
  $('savePlaceAddress').textContent = name;
  $('savePlaceModal').classList.add('open');
};
window.closeSavePlaceModal = () => $('savePlaceModal').classList.remove('open');

window.submitSavePlace = async (type) => {
  if (!state.user || !state.tempPin) return;
  try {
    const r = push(ref(db, `users/${state.user.uid}/savedPlaces`));
    await set(r, { lat: state.tempPin.lat, lng: state.tempPin.lng, address: state.tempPin.name, type, timestamp: Date.now() });
    showToast('Đã ghim địa điểm', 'success');
    closeSavePlaceModal();
  } catch (e) { showToast('Lỗi: ' + e.message, 'error'); }
};

function subscribeSavedPlaces() {
  if (!state.user) return;
  onValue(ref(db, `users/${state.user.uid}/savedPlaces`), (snap) => {
    state.allSavedPlaces = snap.val() || {};
    renderSavedPlaces();
  });
}

function renderSavedPlaces() {
  document.querySelectorAll('.saved-marker').forEach(m => m.remove());
  const icons = { home: 'fa-home', company: 'fa-building', school: 'fa-school', cafe: 'fa-coffee', restaurant: 'fa-utensils', other: 'fa-map-marker-alt' };
  const colors = { home: '#10b981', company: '#3b82f6', school: '#8b5cf6', cafe: '#f59e0b', restaurant: '#ef4444', other: '#64748b' };
  Object.values(state.allSavedPlaces).forEach(p => {
    const el = document.createElement('div');
    el.className = 'saved-marker';
    el.style.cssText = `width:32px;height:32px;background:${colors[p.type] || '#64748b'};border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;color:white;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer`;
    el.innerHTML = `<i class="fas ${icons[p.type] || 'fa-map-marker-alt'}"></i>`;
    el.onclick = () => showToast(p.address, 'info');
    new maplibregl.Marker(el).setLngLat([p.lng, p.lat]).addTo(state.map);
  });
}

// ═══════════════ HISTORY ═══════════════
function loadHistoryRTDB() {
  if (!state.user) return;
  onValue(ref(db, `users/${state.user.uid}/history`), (snap) => {
    const data = snap.val() || {};
    state.allHistory = Object.entries(data).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
    renderHistory();
  });
}

function renderHistory() {
  const list = $('historyList');
  if (!state.allHistory.length) {
    list.innerHTML = '<div class="muted" style="text-align:center;padding:16px">Chưa có chuyến đi nào</div>';
    return;
  }
  list.innerHTML = state.allHistory.map(h => `
    <div class="list-item">
      <div class="time">${new Date(h.timestamp).toLocaleString('vi-VN')}</div>
      <div class="line"><i class="fas fa-circle start"></i> ${escapeHtml(h.startName || '')}</div>
      <div class="line"><i class="fas fa-map-marker-alt end"></i> ${escapeHtml(h.endName || '')}</div>
      <div class="meta">${((h.distance || 0) / 1000).toFixed(1)} km • ${Math.round((h.duration || 0) / 60)} phút</div>
    </div>`).join('');
}

// ═══════════════ MENU / THEME ═══════════════
window.openMenu = () => $('profileModal').classList.add('open');
window.closeMenu = () => $('profileModal').classList.remove('open');
window.toggleTheme = () => {
  const on = $('themeToggle').checked;
  document.body.classList.toggle('light', on);
  localStorage.setItem('theme', on ? 'light' : 'dark');
};

// ═══════════════ UTILS ═══════════════
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  const dp = (lat2 - lat1) * Math.PI / 180, dl = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function showToast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle' }[type] || 'fa-info-circle';
  el.innerHTML = `<i class="fas ${icon}"></i><span>${escapeHtml(msg)}</span>`;
  $('toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}
