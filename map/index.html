<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Hiển thị Biển báo Giao thông Mapillary trên Mapbox</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Mapbox GL JS CSS -->
    <link href="https://mapbox.com" rel="stylesheet">
    <script src="https://mapbox.com"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Thay thế bằng Token của bạn
    const MAPBOX_TOKEN = 'pk.eyJ1IjoibWluaGFkb2YyIiwiYSI6ImNtdnMwNDBhdzAwbnozNXExaHczb3ZndWcifQ.iVKGNbnj_pUxT6B_gqazEw'; 
    const MAPILLARY_TOKEN = 'MLY|30124595887140717|6f7fa14af38d34316e4f6ba9388e1be4'; 

    mapboxgl.accessToken = MAPBOX_TOKEN;

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12', // Bản đồ nền dạng đường phố
        center: [106.660172, 10.762622], // Tọa độ mặc định (Ví dụ: TP.HCM)
        zoom: 15 // Cần zoom đủ gần để nhìn thấy biển báo rõ hơn
    });

    // Danh sách lưu các icon đã được load thành công để tránh load đè
    const loadedIcons = new Set();

    map.on('load', () => {
        // 2. Thêm nguồn dữ liệu Vector Tiles của Mapillary (Lớp chứa biển báo giao thông - 'traffic_signs')
        map.addSource('mapillary-signs', {
            'type': 'vector',
            'tiles': [
                `https://mapillary.com{z}/{x}/{y}.mvt?access_token=${MAPILLARY_TOKEN}`
            ],
            'minzoom': 14, // Giới hạn zoom tối thiểu để tối ưu hiệu năng tải dữ liệu
            'maxzoom': 14
        });

        // 3. Tạo một Layer rỗng để hiển thị các ký hiệu (Symbol) biển báo
        map.addLayer({
            'id': 'mapillary-signs-layer',
            'type': 'symbol',
            'source': 'mapillary-signs',
            'source-layer': 'traffic_sign', // Tên layer gốc trong file vector của Mapillary
            'layout': {
                // Sử dụng tính năng "data-driven" để tự động lấy giá trị 'value' của biển báo làm ID Icon
                'icon-image': ['get', 'value'], 
                'icon-size': 0.4, // Thay đổi kích thước icon hiển thị (tùy thuộc độ phân giải của file SVG)
                'icon-allow-overlap': true // Cho phép các biển báo nằm đè lên nhau nếu quá dày đặc
            }
        });

        // 4. Lắng nghe sự kiện render của bản đồ để tự động tải icon SVG còn thiếu từ CDN về
        map.on('render', () => {
            // Kiểm tra xem layer đã tồn tại trên bản đồ chưa
            if (!map.getLayer('mapillary-signs-layer')) return;

            // Truy vấn các feature (biển báo) đang hiển thị trong khung nhìn hiện tại của màn hình
            const features = map.queryRenderedFeatures({ layers: ['mapillary-signs-layer'] });

            features.forEach((feature) => {
                const signValue = feature.properties.value; // Ví dụ: 'regulatory--stop--g1'

                // Nếu icon này chưa từng được load, tiến hành tải ảnh từ CDN của Mapillary
                if (signValue && !loadedIcons.has(signValue)) {
                    loadedIcons.add(signValue); // Đánh dấu đã load

                    const iconUrl = `https://jsdelivr.net{signValue}.svg`;

                    map.loadImage(iconUrl, (error, image) => {
                        // Nếu CDN có file SVG hợp lệ và bản đồ chưa bị hủy
                        if (!error && image && map.getStyle()) {
                            // Nạp icon vào bộ nhớ Mapbox với ID chính là tên của nó
                            map.addImage(signValue, image);
                        }
                    });
                }
            });
        });

        // 5. Thêm Popup tương tác khi người dùng click vào biển báo
        map.on('click', 'mapillary-signs-layer', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const description = e.features[0].properties.value; // Tên biển báo tiếng Anh

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(`<strong>Loại biển báo:</strong> ${description}`)
                .addTo(map);
        });

        // Thay đổi con trỏ chuột khi rê qua biển báo
        map.on('mouseenter', 'mapillary-signs-layer', () => {
            map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'mapillary-signs-layer', () => {
            map.getCanvas().style.cursor = '';
        });
    });
</script>

</body>
</html>
