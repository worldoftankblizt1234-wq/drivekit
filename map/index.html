<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Biển báo Giao thông Thông minh</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        #filter-panel {
            position: absolute; top: 15px; left: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            z-index: 10; font-size: 14px; backdrop-filter: blur(5px);
            max-width: 250px;
        }
        #filter-panel h3 { margin: 0 0 12px 0; font-size: 16px; color: #1f2937; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px;}
        .filter-group { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .filter-group input { margin-right: 10px; cursor: pointer; width: 16px; height: 16px; accent-color: #0d6efd; }
        .filter-group label { cursor: pointer; color: #374151; font-weight: 500; }
        
        .maplibregl-popup-content {
            padding: 0; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 13px; line-height: 1.5;
            max-width: 280px;
        }
        .popup-header { background: #0d6efd; color: #fff; padding: 10px 15px; font-weight: bold; font-size: 14px; }
        .popup-body { padding: 12px 15px; background: #fff; }
        .popup-row { margin-bottom: 6px; display: flex; justify-content: space-between; border-bottom: 1px dashed #e5e7eb; padding-bottom: 4px;}
        .popup-row:last-child { border-bottom: none; }
        .popup-label { color: #6b7280; font-weight: 600; }
        .popup-value { color: #111827; font-family: monospace; text-align: right; word-break: break-all; font-size: 11px;}
        .popup-img-container { margin-top: 10px; text-align: center; background: #f3f4f6; border-radius: 8px; min-height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        .popup-img-container img { width: 100%; height: auto; display: block; }
        .loading-text { font-size: 11px; color: #9ca3af; font-style: italic; }
    </style>
</head>
<body>

    <div id="filter-panel">
        <h3>🚦 Bộ lọc biển báo</h3>
        <div class="filter-group"><input type="checkbox" id="filter-warning" checked><label for="filter-warning">⚠️ Cảnh báo</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-regulatory" checked><label for="filter-regulatory">🛑 Cấm / Hiệu lệnh</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-information" checked><label for="filter-information">ℹ️ Chỉ dẫn</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-other" checked><label for="filter-other">🔹 Loại khác</label></div>
    </div>

    <div id="map"></div>

    <script>
        const MAPTILER_KEY = 'aEzMCP0ANRz52vd1RvrW';
        const MAPILLARY_TOKEN = 'MLY|30124595887140717|6f7fa14af38d34316e4f6ba9388e1be4';

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v4/style.json?key=${MAPTILER_KEY}`,
            center: [105.8542, 21.0285], 
            zoom: 16,
            minZoom: 3
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // ==========================================
        // TỪ ĐIỂN DỊCH MÃ MAPILLARY SANG TIẾNG VIỆT
        // ==========================================
        function translateMapillaryCode(code) {
            if (!code) return 'Biển báo không xác định';
            const c = code.toLowerCase();

            // 1. Các biển Cảnh báo (Warning)
            if (c.includes('junction-with-a-side-road-perpendicular-right')) return 'Giao lộ với đường nhánh vuông góc bên phải';
            if (c.includes('junction-with-a-side-road-perpendicular-left')) return 'Giao lộ với đường nhánh vuông góc bên trái';
            if (c.includes('pedestrian-crossing')) return 'Đường dành cho người đi bộ cắt ngang';
            if (c.includes('children')) return 'Cảnh báo trẻ em qua đường';
            if (c.includes('curve-to-right')) return 'Đường cong sang phải';
            if (c.includes('curve-to-left')) return 'Đường cong sang trái';
            if (c.includes('slippery')) return 'Đường trơn trượt';
            if (c.includes('steep-hill')) return 'Dốc nguy hiểm';
            if (c.includes('road-narrows')) return 'Đường bị thu hẹp';
            if (c.includes('warning')) return 'Cảnh báo nguy hiểm khác';

            // 2. Các biển Cấm / Hiệu lệnh (Regulatory)
            if (c.includes('stop')) return 'Dừng lại (STOP)';
            if (c.includes('yield') || c.includes('give-way')) return 'Nhường đường';
            if (c.includes('no-entry')) return 'Cấm đi vào (Đường một chiều)';
            if (c.includes('no-parking')) return 'Cấm đỗ xe';
            if (c.includes('no-stopping')) return 'Cấm dừng xe';
            if (c.includes('no-left-turn')) return 'Cấm rẽ trái';
            if (c.includes('no-right-turn')) return 'Cấm rẽ phải';
            if (c.includes('no-u-turn')) return 'Cấm quay đầu';
            if (c.includes('maximum-speed-limit')) {
                const match = c.match(/\d+/);
                return match ? `Tốc độ tối đa ${match[0]} km/h` : 'Giới hạn tốc độ';
            }
            if (c.includes('regulatory')) return 'Biển hiệu lệnh khác';

            // 3. Biển Thông tin (Information)
            if (c.includes('information')) return 'Biển chỉ dẫn thông tin';

            return code.replace(/--/g, ' ').replace(/-/g, ' ').toUpperCase();
        }

        // ==========================================
        // BỘ ICON SVG (Vẽ thêm icon đường nhánh)
        // ==========================================
        const svgToDataUrl = (svg) => `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        const ICONS = {
            'stop': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><text x="16" y="21" text-anchor="middle" font-size="9" font-weight="900" font-family="Arial" fill="#fff">STOP</text></svg>`),
            'no-entry': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><rect x="7" y="13" width="18" height="6" fill="#fff"/></svg>`),
            'speed-empty': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#dc2626" stroke-width="4"/></svg>`),
            'no-left': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#dc2626" stroke-width="3"/><path d="M20 22V14a4 4 0 0 0-4-4h-4m0 0l3-3m-3 3l3 3" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="6" y1="6" x2="26" y2="26" stroke="#dc2626" stroke-width="3"/></svg>`),
            'no-right': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#dc2626" stroke-width="3"/><path d="M12 22V14a4 4 0 0 1 4-4h4m0 0l-3-3m3 3l-3 3" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><line x1="6" y1="6" x2="26" y2="26" stroke="#dc2626" stroke-width="3"/></svg>`),
            // ICON ĐƯỜNG NHÁNH (Dành riêng cho mã bạn hỏi)
            'junction-right': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><polygon points="16,3 30,29 2,29" fill="#f59e0b" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M16 26V14h8" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M16 26V10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg>`),
            'warning': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><polygon points="16,3 30,29 2,29" fill="#f59e0b" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><text x="16" y="26" text-anchor="middle" font-size="16" font-weight="900" font-family="Arial" fill="#111">!</text></svg>`),
            'info': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#0d6efd" stroke="#fff" stroke-width="2"/><text x="16" y="24" text-anchor="middle" font-size="20" font-weight="900" font-family="Arial" fill="#fff">i</text></svg>`),
            'fallback': svgToDataUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#6b7280" stroke="#fff" stroke-width="2"/><text x="16" y="23" text-anchor="middle" font-size="16" font-weight="900" font-family="Arial" fill="#fff">?</text></svg>`)
        };

        function loadIcons() {
            return new Promise((resolve) => {
                let loaded = 0;
                const total = Object.keys(ICONS).length;
                for (const [key, url] of Object.entries(ICONS)) {
                    const img = new Image();
                    img.onload = () => {
                        if (!map.hasImage('icon-' + key)) map.addImage('icon-' + key, img, { pixelRatio: 2 });
                        loaded++;
                        if (loaded === total) resolve();
                    };
                    img.src = url;
                }
            });
        }

        map.on('load', async () => {
            await loadIcons();

            map.addSource('mapillary-signs', {
                type: 'vector',
                tiles: [`https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${MAPILLARY_TOKEN}`],
                minzoom: 14,
                maxzoom: 14
            });

            // LỚP 1: HIỂN THỊ ICON
            map.addLayer({
                id: 'traffic-signs-layer',
                type: 'symbol',
                source: 'mapillary-signs',
                'source-layer': 'traffic_sign',
                minzoom: 14,
                layout: {
                    'icon-image': [
                        'case',
                        // Cập nhật icon cho đường nhánh
                        ['in', 'junction-with-a-side-road-perpendicular-right', ['get', 'value']], 'icon-junction-right',
                        ['in', 'no-left-turn', ['get', 'value']], 'icon-no-left',
                        ['in', 'no-right-turn', ['get', 'value']], 'icon-no-right',
                        ['in', 'no-entry', ['get', 'value']], 'icon-no-entry',
                        ['in', 'maximum-speed-limit', ['get', 'value']], 'icon-speed-empty',
                        ['in', 'stop', ['get', 'value']], 'icon-stop',
                        ['in', 'warning', ['get', 'value']], 'icon-warning',
                        ['in', 'information', ['get', 'value']], 'icon-info',
                        'icon-fallback'
                    ],
                    'icon-size': ['interpolate', ['linear'], ['zoom'], 14, 0.5, 18, 0.9],
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true
                }
            });

            // LỚP 2: CHÈN TEXT SỐ TỐC ĐỘ
            map.addLayer({
                id: 'speed-text-layer',
                type: 'symbol',
                source: 'mapillary-signs',
                'source-layer': 'traffic_sign',
                minzoom: 14,
                filter: ['in', 'maximum-speed-limit', ['get', 'value']],
                layout: {
                    'text-field': ['slice', ['get', 'value'], ['+', ['index-of', ['get', 'value'], 'limit-'], 6], ['index-of', ['get', 'value'], '--']],
                    'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
                    'text-size': ['interpolate', ['linear'], ['zoom'], 14, 10, 18, 18],
                    'text-allow-overlap': true,
                    'text-ignore-placement': true,
                    'text-anchor': 'center'
                },
                paint: { 'text-color': '#111111' }
            });

            // TƯƠNG TÁC
            const interactiveLayers = ['traffic-signs-layer', 'speed-text-layer'];
            map.on('mouseenter', interactiveLayers, () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', interactiveLayers, () => map.getCanvas().style.cursor = '');

            map.on('click', interactiveLayers, async (e) => {
                const feature = e.features[0];
                const props = feature.properties;
                const rawValue = props.value || 'Không xác định';
                
                // SỬ DỤNG HÀM DỊCH ĐỂ HIỂN THỊ TÊN TIẾNG VIỆT
                const displayName = translateMapillaryCode(rawValue);
                
                let category = 'Khác';
                if (rawValue.includes('warning--')) category = '⚠️ Cảnh báo nguy hiểm';
                else if (rawValue.includes('regulatory--')) category = '🛑 Cấm / Hiệu lệnh';
                else if (rawValue.includes('information--')) category = 'ℹ️ Thông tin chỉ dẫn';
                
                let dateStr = 'Không rõ';
                if (props.last_updated || props.captured_at) {
                    const d = new Date(props.last_updated || props.captured_at);
                    dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                }

                const popupHTML = `
                    <div class="popup-header">${displayName}</div>
                    <div class="popup-body">
                        <div class="popup-row"><span class="popup-label">Mã gốc:</span> <span class="popup-value">${rawValue}</span></div>
                        <div class="popup-row"><span class="popup-label">Phân loại:</span> <span>${category}</span></div>
                        <div class="popup-row"><span class="popup-label">Cập nhật:</span> <span>${dateStr}</span></div>
                        <div class="popup-img-container" id="popup-img-box">
                            <span class="loading-text">📷 Đang tải ảnh thực tế...</span>
                        </div>
                    </div>
                `;

                new maplibregl.Popup({ offset: 15, maxWidth: '300px' }).setLngLat(e.lngLat).setHTML(popupHTML).addTo(map);

                // TẢI ẢNH THẬT
                try {
                    const featureId = props.id;
                    if (!featureId) throw new Error('Không có ID');

                    const res1 = await fetch(`https://graph.mapillary.com/${featureId}?access_token=${MAPILLARY_TOKEN}&fields=images`);
                    const data1 = await res1.json();
                    const imageId = data1.images?.[0];

                    if (imageId) {
                        const res2 = await fetch(`https://graph.mapillary.com/${imageId}?access_token=${MAPILLARY_TOKEN}&fields=thumb_512_url`);
                        const data2 = await res2.json();
                        const imgUrl = data2.thumb_512_url;

                        if (imgUrl) {
                            const imgBox = document.getElementById('popup-img-box');
                            if (imgBox) imgBox.innerHTML = `<img src="${imgUrl}" alt="Ảnh biển báo" />`;
                        } else throw new Error('Không có link ảnh');
                    } else throw new Error('Không có ảnh');
                } catch (err) {
                    const imgBox = document.getElementById('popup-img-box');
                    if (imgBox) imgBox.innerHTML = `<span class="loading-text" style="color:#ef4444">Không có ảnh thực tế.</span>`;
                }
            });

            // BỘ LỌC
            function applyFilter() {
                const isWarning = document.getElementById('filter-warning').checked;
                const isRegulatory = document.getElementById('filter-regulatory').checked;
                const isInfo = document.getElementById('filter-information').checked;
                const isOther = document.getElementById('filter-other').checked;

                let conditions = ['any'];
                if (isWarning) conditions.push(['in', 'warning--', ['get', 'value']]);
                if (isRegulatory) conditions.push(['in', 'regulatory--', ['get', 'value']]);
                if (isInfo) conditions.push(['in', 'information--', ['get', 'value']]);
                if (isOther) {
                    conditions.push(['all', ['!', ['in', 'warning--', ['get', 'value']]], ['!', ['in', 'regulatory--', ['get', 'value']]], ['!', ['in', 'information--', ['get', 'value']]]]);
                }

                map.setFilter('traffic-signs-layer', conditions);
                map.setFilter('speed-text-layer', ['all', ['in', 'maximum-speed-limit', ['get', 'value']], conditions]);
            }

            document.querySelectorAll('#filter-panel input').forEach(el => el.addEventListener('change', applyFilter));
        });
    </script>
</body>
</html>
