<!DOCTYPE html>
<html lang="vi">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 270 Biển Báo - drivekit</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{display:flex;height:100vh}
#sidebar{width:380px;background:#f8f9fa;border-right:1px solid #ddd;overflow-y:auto;padding:12px}
#map{flex:1}
.header{font-weight:700;font-size:18px;margin-bottom:8px}
.sub{font-size:12px;color:#666;margin-bottom:12px}
.search{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter{padding:4px 10px;border-radius:20px;border:1px solid #ccc;background:white;font-size:12px;cursor:pointer}
.filter.active{background:#0d6efd;color:white;border-color:#0d6efd}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:white;border:1px solid #e5e5e5;border-radius:10px;padding:8px;text-align:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:#0d6efd}
.card img{width:64px;height:64px;object-fit:contain}
.card .ma{font-weight:700;font-size:12px;margin-top:4px}
.card .ten{font-size:10px;color:#666;line-height:1.2;height:24px;overflow:hidden}
.offline{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#dc3545;color:white;padding:8px 16px;border-radius:20px;font-size:13px;z-index:9999;display:none}
</style>
</head>
<body>
<div class="offline" id="offline">Mất mạng - không load được ảnh từ GitHub</div>
<div id="sidebar">
  <div class="header">🚦 270 Biển Báo drivekit</div>
  <div class="sub">GitHub: worldoftankblizt1234-wq/drivekit<br>Có mạng thì gọi ảnh, mất mạng thì thôi</div>
  <input class="search" id="search" placeholder="Tìm W.225, trẻ em, P.101...">
  <div class="filters">
    <div class="filter active" data-f="all">Tất cả</div>
    <div class="filter" data-f="canh_bao">Cảnh báo (54)</div>
    <div class="filter" data-f="cam">Cấm (36)</div>
    <div class="filter" data-f="hieu_lenh">Hiệu lệnh (36)</div>
    <div class="filter" data-f="chi_dan">Chỉ dẫn (144)</div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="map"></div>

<script>
const CDN = "https://cdn.jsdelivr.net/gh/worldoftankblizt1234-wq/drivekit@main/map/bien_bao_transparent";
const JSON_URL = "https://cdn.jsdelivr.net/gh/worldoftankblizt1234-wq/drivekit@main/map/bien_bao_array.json";

let allData = [];
let map = L.map('map').setView([21.028511, 105.804817], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function checkOnline(){
  const el=document.getElementById('offline');
  el.style.display = navigator.onLine ? 'none':'block';
}
window.addEventListener('online', checkOnline);
window.addEventListener('offline', checkOnline);
checkOnline();

async function load(){
  try{
    const r = await fetch(JSON_URL);
    allData = await r.json();
  }catch(e){
    // fallback nếu chưa có json trên github, tự tạo 270 item
    allData = Array.from({length:270},(_,i)=>{
      const id=i+1;
      return {id, ma:`Biển ${id}`, ten:`Biển ${id}`, file:`bien_${String(id).padStart(3,'0')}_transparent.png`, url:`${CDN}/bien_${String(id).padStart(3,'0')}_transparent.png`, nhom: id<=54?'canh_bao': id<=90?'cam': id<=126?'hieu_lenh':'chi_dan'}
    });
  }
  render();
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const f = document.querySelector('.filter.active').dataset.f;
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  const filtered = allData.filter(b=>{
    const matchGroup = f==='all' || b.nhom===f;
    const matchQ = !q || b.ma.toLowerCase().includes(q) || b.ten.toLowerCase().includes(q) || String(b.id).includes(q);
    return matchGroup && matchQ;
  });
  filtered.slice(0,150).forEach(b=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<img src="${b.url}" loading="lazy" onerror="this.src='https://via.placeholder.com/64?text=?'"><div class="ma">${b.ma}</div><div class="ten">${b.ten}</div>`;
    div.onclick=()=>{
      if(!navigator.onLine){ alert('Mất mạng rồi, không load được biển'); return; }
      const center = map.getCenter();
      L.marker([center.lat + (Math.random()-0.5)*0.01, center.lng + (Math.random()-0.5)*0.01], {
        icon: L.icon({iconUrl:b.url, iconSize:[48,48], iconAnchor:[24,24]})
      }).addTo(map).bindPopup(`<b>${b.ma}</b><br>${b.ten}<br><img src="${b.url}" width="80">`).openPopup();
      map.panTo(center);
    };
    grid.appendChild(div);
  });
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('.filter').forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    render();
  };
});

load();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
