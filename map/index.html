<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- Thẻ referrer giúp tránh bị chặn CORS trên một số WebView/Zalo -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mapillary Full Test - Header Auth & Fixed Icons</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #map{position:absolute;inset:0}
  #info{position:absolute;top:12px;left:12px;z-index:5;background:#fff;padding:12px 14px;border-radius:12px;
        font-size:12px;line-height:1.6;box-shadow:0 4px 20px rgba(0,0,0,.15);max-width:300px; border: 1px solid #ddd;}
  #info b{color:#0d6efd}
  #info .status{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;
                font-weight:700;margin-left:4px}
  #info .status.ok{background:#d1fae5;color:#065f46}
  #info .status.fail{background:#fee2e2;color:#991b1b}
  #info .status.pending{background:#fef3c7;color:#92400e}
  #tools{position:absolute;bottom:90px;left:12px;z-index:5;display:flex;flex-direction:column;
         gap:8px;width:220px}
  #tools button{padding:11px 14px;border:0;border-radius:10px;background:#0d6efd;color:#fff;
                font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);
                text-align:left}
  #tools button.warn{background:#ef4444}
  #tools button.ok{background:#10b981}
  #tools button:active{transform:scale(.97)}
</style>
</head>
<body>

<div id="map"></div>

<div id="info">
  <b>🔍 Mapillary Debug</b><br>
  Token (Header): <span id="status-token" class="status pending">checking...</span><br>
  Source (Tiles): <span id="status-source" class="status pending">pending</span><br>
  Icons: <span id="status-icons" class="status pending">pending</span><br>
  Features: <b id="feature-count">0</b> • Zoom: <b id="zoom-level">-</b>
</div>

<div id="tools">
  <button class="ok" id="btn-test-token">1. Test Token (Header)</button>
  <button class="warn" id="btn-toggle-icons">2. Toggle Icon / Circle</button>
  <button class="ok" id="btn-goto-nyc" style="background:#0d6efd;">3. Tới New York</button>
</div>

<script src="https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js"></script>
<script>
  window.vConsole = new window.VConsole({ theme: 'dark' });
</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
/* ============================================================
   1. TOKEN CỦA BẠN
   ============================================================ */
const TOKEN = 'MLY|30124595887140717|6f7fa14af38d34316e4f6ba9388e1be4'.trim();

/* ============================================================
   2. HELPERS & ICONS (SVG Base64)
   ============================================================ */
function setStatus(id, status, text) {
  const el = document.getElementById('status-' + id);
  if (!el) return;
  el.className = 'status ' + status;
  el.textContent = text;
}

function svgToBase64(svgString) {
  const base64 = btoa(unescape(encodeURIComponent(svgString)));
  return 'data:image/svg+xml;base64,' + base64;
}

const ICONS = {
  stop: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="16" y="21" text-anchor="middle" font-size="9" font-weight="900" font-family="Arial,sans-serif" fill="#fff">STOP</text></svg>`),
  yield: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><polygon points="16,3 30,29 2,29" fill="#fff" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><text x="16" y="26" text-anchor="middle" font-size="6" font-weight="900" font-family="Arial,sans-serif" fill="#111">YIELD</text></svg>`),
  warning: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><polygon points="16,3 30,29 2,29" fill="#f59e0b" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><text x="16" y="26" text-anchor="middle" font-size="16" font-weight="900" font-family="Arial,sans-serif" fill="#fff">!</text></svg>`),
  speed: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="16" y="21" text-anchor="middle" font-size="11" font-weight="900" font-family="Arial,sans-serif" fill="#111">50</text></svg>`),
  noEntry: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#dc2626" stroke="#fff" stroke-width="2"/><rect x="6" y="13" width="20" height="6" fill="#fff"/></svg>`),
  info: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#0d6efd" stroke="#fff" stroke-width="2"/><text x="16" y="23" text-anchor="middle" font-size="18" font-weight="900" font-family="Arial,sans-serif" fill="#fff">i</text></svg>`),
  other: svgToBase64(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#6b7280" stroke="#fff" stroke-width="2"/><text x="16" y="23" text-anchor="middle" font-size="16" font-weight="900" font-family="Arial,sans-serif" fill="#fff">?</text></svg>`)
};

/* ============================================================
   3. MAP INIT
   ============================================================ */
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap'
      }
    },
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  },
  center: [-73.9855, 40.7580], // Times Square
  zoom: 17
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

/* ============================================================
   4. TEST TOKEN BẰNG HEADER (TRÁNH LỖI 500)
   ============================================================ */
async function testTokenHeader() {
  setStatus('token', 'pending', 'testing...');
  console.log('%c [TEST] Đang test token bằng Header...', 'color:#f59e0b;font-weight:bold');
  
  try {
    // Gọi API /me bằng Header thay vì query param
    const res = await fetch('https://graph.mapillary.com/me', {
      method: 'GET',
      headers: {
        'Authorization': `OAuth ${TOKEN}`
      }
    });
    
    console.log('HTTP Status:', res.status);
    const data = await res.json();
    console.log('Data:', data);

    if (res.ok && !data.error) {
      setStatus('token', 'ok', 'OK ✓');
      console.log('%c ✅ TOKEN HỢP LỆ (Header Auth thành công)!', 'color:#0f0;font-weight:bold;font-size:14px');
    } else {
      setStatus('token', 'fail', 'FAIL ' + res.status);
      console.error('❌ Token lỗi hoặc API từ chối:', data);
    }
  } catch (e) {
    setStatus('token', 'fail', 'FETCH ERR');
    console.error('❌ Lỗi mạng (Có thể do CORS trên di động):', e);
  }
}
testTokenHeader(); // Tự động chạy khi mở

/* ============================================================
   5. MAP LOAD (SOURCE & ICONS)
   ============================================================ */
map.on('load', () => {
  // Dùng query param cho Vector Tiles (MapLibre yêu cầu)
  const tileUrl = `https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${encodeURIComponent(TOKEN)}`;
  
  map.addSource('mly-signs', {
    type: 'vector',
    tiles: [tileUrl],
    minzoom: 14,
    maxzoom: 14
  });
  setStatus('source', 'pending', 'loading...');

  // Lớp dự phòng (Fallback) - Chấm tròn xanh
  map.addLayer({
    id: 'sign-circle',
    type: 'circle',
    source: 'mly-signs',
    'source-layer': 'traffic_sign',
    paint: {
      'circle-radius': 8,
      'circle-color': '#0d6efd',
      'circle-stroke-width': 2,
      'circle-stroke-color': '#fff'
    }
  });

  // Load Icons bằng HTMLImageElement (Tránh lỗi fetch data:image trên mobile)
  loadAllIcons().then(allOk => {
    if (allOk) {
      addSymbolLayer();
      setStatus('icons', 'ok', 'OK ✓');
    } else {
      setStatus('icons', 'fail', 'see console');
    }
  });

  map.on('sourcedata', (e) => {
    if (e.sourceId === 'mly-signs' && e.isSourceLoaded) {
      setStatus('source', 'ok', 'loaded ✓');
      updateCount();
    }
  });

  // Bắt sự kiện click vào icon
  map.on('click', 'sign-icon', onSignClick);
  map.on('mouseenter', 'sign-icon', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'sign-icon', () => map.getCanvas().style.cursor = '');
  map.on('moveend', updateCount);
  map.on('idle', updateCount);
});

/* ============================================================
   6. LOAD ICONS (DÙNG new Image())
   ============================================================ */
function loadAllIcons() {
  const promises = Object.entries(ICONS).map(([name, dataUri]) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          if (!map.hasImage('sign-' + name)) {
            map.addImage('sign-' + name, img, { pixelRatio: 2 });
          }
          resolve({ name, ok: true });
        } catch (e) {
          console.error(`[ADD IMAGE FAIL] ${name}`, e);
          resolve({ name, ok: false });
        }
      };
      img.onerror = (err) => {
        console.error(`[IMG LOAD FAIL] ${name}`, err);
        resolve({ name, ok: false });
      };
      img.src = dataUri; // Gán data URI trực tiếp
    });
  });

  return Promise.all(promises).then(results => {
    return results.every(r => r.ok); // Trả về true nếu tất cả load thành công
  });
}

/* ============================================================
   7. ADD SYMBOL LAYER
   ============================================================ */
function addSymbolLayer() {
  if (map.getLayer('sign-icon')) return;

  map.addLayer({
    id: 'sign-icon',
    type: 'symbol',
    source: 'mly-signs',
    'source-layer': 'traffic_sign',
    layout: {
      'icon-image': [
        'case',
        ['in', 'stop',                ['downcase', ['get', 'value']]], 'sign-stop',
        ['in', 'yield',               ['downcase', ['get', 'value']]], 'sign-yield',
        ['in', 'no-entry',            ['downcase', ['get', 'value']]], 'sign-noEntry',
        ['in', 'maximum-speed-limit', ['downcase', ['get', 'value']]], 'sign-speed',
        ['in', 'speed',               ['downcase', ['get', 'value']]], 'sign-speed',
        ['in', 'no-',                 ['downcase', ['get', 'value']]], 'sign-noEntry',
        ['in', 'warning',             ['downcase', ['get', 'value']]], 'sign-warning',
        ['in', 'regulatory',          ['downcase', ['get', 'value']]], 'sign-warning',
        ['in', 'information',         ['downcase', ['get', 'value']]], 'sign-info',
        'sign-other'
      ],
      'icon-size': [
        'interpolate', ['linear'], ['zoom'],
        14, 0.5,
        18, 1.0
      ],
      'icon-allow-overlap': true,
      'icon-ignore-placement': true
    }
  });
  
  // Ẩn lớp chấm tròn dự phòng khi đã có icon
  map.setLayoutProperty('sign-circle', 'visibility', 'none');
}

/* ============================================================
   8. CLICK HANDLER (Lấy ảnh thật bằng Header Auth)
   ============================================================ */
async function onSignClick(e) {
  const f = e.features[0];
  const featureId = f.properties.id || f.id;
  const value = f.properties.value || '(unknown)';

  const popup = new maplibregl.Popup({ offset: 16, maxWidth: '300px' })
    .setLngLat(e.lngLat)
    .setHTML(`
      <div style="font-size:13px;line-height:1.5;min-width:220px">
        <b>🛑 ${value}</b><br>
        <span style="color:#6b7280;font-size:11px">ID: ${featureId || 'n/a'}</span>
        <div id="popup-img" style="margin-top:8px;font-size:11px;color:#9ca3af">Đang tải ảnh...</div>
      </div>
    `)
    .addTo(map);

  if (!featureId) return;

  try {
    // Dùng Header để lấy thông tin ảnh
    const r1 = await fetch(`https://graph.mapillary.com/${featureId}?fields=id,value,images`, {
      headers: { 'Authorization': `OAuth ${TOKEN}` }
    });
    const d1 = await r1.json();
    const imgId = d1.images?.[0];
    
    if (!imgId) {
      document.getElementById('popup-img').textContent = 'Không có ảnh liên kết';
      return;
    }

    const r2 = await fetch(`https://graph.mapillary.com/${imgId}?fields=thumb_512_url`, {
      headers: { 'Authorization': `OAuth ${TOKEN}` }
    });
    const d2 = await r2.json();
    
    const el = document.getElementById('popup-img');
    if (el && d2.thumb_512_url) {
      el.innerHTML = `<img src="${d2.thumb_512_url}" style="width:100%;border-radius:8px;display:block" loading="lazy"/>`;
    } else if (el) {
      el.textContent = 'Không tải được ảnh';
    }
  } catch (err) {
    const el = document.getElementById('popup-img');
    if (el) el.textContent = 'Lỗi tải ảnh! (Xem vConsole)';
    console.error('Lỗi click:', err);
  }
}

/* ============================================================
   9. CONTROLS & BUTTONS
   ============================================================ */
function updateCount() {
  try {
    const feats = map.querySourceFeatures('mly-signs', { sourceLayer: 'traffic_sign' });
    document.getElementById('feature-count').textContent = feats.length;
  } catch (_) {}
  document.getElementById('zoom-level').textContent = map.getZoom().toFixed(1);
}

document.getElementById('btn-test-token').addEventListener('click', testTokenHeader);

document.getElementById('btn-goto-nyc').addEventListener('click', () => {
  map.flyTo({ center: [-73.9855, 40.7580], zoom: 17 });
});

document.getElementById('btn-toggle-icons').addEventListener('click', () => {
  if (!map.getLayer('sign-icon')) return;
  const cur = map.getLayoutProperty('sign-icon', 'visibility');
  const next = cur === 'none' ? 'visible' : 'none';
  map.setLayoutProperty('sign-icon', 'visibility', next);
  if (map.getLayer('sign-circle')) {
    map.setLayoutProperty('sign-circle', 'visibility', next === 'visible' ? 'none' : 'visible');
  }
});
</script>
</body>
</html>
