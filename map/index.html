        .popup-img-container { margin-top: 10px; text-align: center; background: #f3f4f6; border-radius: 8px; min-height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        .popup-img-container img { width: 100%; height: auto; display: block; }

        // ==========================================
        // 2. KHỞI TẠO BẢN ĐỒ
        // ==========================================
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v4/style.json?key=${MAPTILER_KEY}`,
            center: [105.8542, 21.0285], 
            zoom: 16,
            minZoom: 3
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // ==========================================
        // 3. HÀM TẢI ẢNH TỪ CDN (CHỈ TẢI FILE DUY NHẤT)
        // ==========================================
        async function loadImagesFromCDN() {
            // Lấy danh sách các URL duy nhất (để không tải trùng file)
            const uniqueFiles = {};
            Object.values(MAPPING_DATA).forEach(item => {
                uniqueFiles[item.file] = item.url;
            });

            const fileEntries = Object.entries(uniqueFiles);
            let loadedCount = 0;

            return new Promise((resolve) => {
                fileEntries.forEach(([fileName, url]) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous'; 
                    
                    img.onload = () => {
                        if (!map.hasImage(fileName)) {
                            // MapLibre dùng fileName (VD: bien_055_transparent.png) làm ID
                            map.addImage(fileName, img, { pixelRatio: 2 }); 
                        }
                        loadedCount++;
                        if (loadedCount === fileEntries.length) resolve();
                    };
                    
                    img.onerror = () => {
                        console.warn(`Lỗi tải ảnh: ${url}`);
                        loadedCount++;
                        if (loadedCount === fileEntries.length) resolve();
                    };
                    img.src = url;
                });
            });
        }

        // ==========================================
        // 4. TỰ ĐỘNG TẠO EXPRESSION CHO MAPLIBRE
        // ==========================================
        function buildIconExpression() {
            let expression = ['case'];
            
            // Duyệt qua bảng Mapping JSON để tạo điều kiện
            for (const [mapillaryCode, data] of Object.entries(MAPPING_DATA)) {
                // Nếu chuỗi value của Mapillary chứa mã code -> Dùng file ảnh của bạn
                expression.push(['in', mapillaryCode, ['get', 'value']], data.file);
            }
            
            // Ảnh Fallback nếu không khớp bất kỳ mã nào
            // (Dùng tạm ảnh "Nguy hiểm khác" W.233)
            expression.push('bien_048_transparent.png'); 
            
            return expression;
        }

        // ==========================================
        // 5. KHỞI TẠO LỚP DỮ LIỆU
        // ==========================================
        map.on('load', async () => {
            // Tải toàn bộ ảnh (chỉ những file có trong bảng JSON)
            await loadImagesFromCDN();
            console.log('Đã nạp xong toàn bộ ảnh biển báo từ CDN!');

            // Thêm nguồn dữ liệu Vector Tile của Mapillary
            map.addSource('mapillary-signs', {
                type: 'vector',
                tiles: [`https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${MAPILLARY_TOKEN}`],
                minzoom: 14, maxzoom: 14
            });

            // Tạo Layer hiển thị Icon
            map.addLayer({
                id: 'traffic-signs-layer',
                type: 'symbol',
                source: 'mapillary-signs',
                'source-layer': 'traffic_sign',
                minzoom: 14,
                layout: {
                    'icon-image': buildIconExpression(),
                    'icon-size': ['interpolate', ['linear'], ['zoom'], 14, 0.3, 18, 0.6],
                    'icon-allow-overlap': false,
                    'icon-ignore-placement': false,
                    'icon-padding': 2,
                    'symbol-sort-key': [
                        'case',
                        ['in', 'stop', ['get', 'value']], 1,
                        ['in', 'maximum-speed-limit', ['get', 'value']], 2,
                        3
                    ]
                }
            });

            // TƯƠNG TÁC CLICK (Popup hiển thị thông tin từ JSON và ảnh thật Mapillary)
            const interactiveLayers = ['traffic-signs-layer'];
            map.on('mouseenter', interactiveLayers, () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', interactiveLayers, () => map.getCanvas().style.cursor = '');

            map.on('click', interactiveLayers, async (e) => {
                const feature = e.features[0];
                const props = feature.properties;
                const rawValue = props.value || '';
                
                // Tìm thông tin trong bảng JSON
                let displayData = { ma: 'Không rõ', ten: 'Biển báo không xác định' };
                for (const [key, data] of Object.entries(MAPPING_DATA)) {
                    if (rawValue.includes(key)) {
                        displayData = data;
                        break;
                    }
                }

                const popupHTML = `
                    <div class="popup-header">${displayData.ma}: ${displayData.ten}</div>
                    <div class="popup-body">
                        <div class="popup-row"><span class="popup-label">Mã gốc Mapillary:</span> <span class="popup-value">${rawValue}</span></div>
                        <div class="popup-row"><span class="popup-label">Mã QCVN:</span> <span class="popup-value">${displayData.ma}</span></div>
                        <div class="popup-img-container" id="popup-img-box">
                            <span style="font-size:11px;color:#9ca3af;">📷 Đang tải ảnh thực tế...</span>
                        </div>
                    </div>
                `;

                new maplibregl.Popup({ offset: 15, maxWidth: '300px' }).setLngLat(e.lngLat).setHTML(popupHTML).addTo(map);

                // Gọi API Mapillary lấy ảnh thật
                try {
                    const featureId = props.id;
                    const res1 = await fetch(`https://graph.mapillary.com/${featureId}?access_token=${MAPILLARY_TOKEN}&fields=images`);
                    const data1 = await res1.json();
                    const imageId = data1.images?.[0];

                    if (imageId) {
                        const res2 = await fetch(`https://graph.mapillary.com/${imageId}?access_token=${MAPILLARY_TOKEN}&fields=thumb_512_url`);
                        const data2 = await res2.json();
                        if (data2.thumb_512_url) {
                            document.getElementById('popup-img-box').innerHTML = `<img src="${data2.thumb_512_url}" />`;
                        } else throw new Error();
                    } else throw new Error();
                } catch (err) {
                    document.getElementById('popup-img-box').innerHTML = `<span style="color:#ef4444;font-size:11px;padding:10px;">Không có ảnh thực tế.</span>`;
                }
            });

            // BỘ LỌC (Dựa theo tiền tố của Mapillary: regulatory, warning, mandatory, information)
            function applyFilter() {
                const isWarning = document.getElementById('filter-warning').checked;
                const isRegulatory = document.getElementById('filter-regulatory').checked;
                const isMandatory = document.getElementById('filter-mandatory').checked;
                const isInfo = document.getElementById('filter-information').checked;
                const isOther = document.getElementById('filter-other').checked;

                let conditions = ['any'];
                if (isWarning) conditions.push(['in', 'warning--', ['get', 'value']]);
                if (isRegulatory) conditions.push(['in', 'regulatory--', ['get', 'value']]);
                if (isMandatory) conditions.push(['in', 'mandatory--', ['get', 'value']]);
                if (isInfo) conditions.push(['in', 'information--', ['get', 'value']]);
                if (isOther) {
                    conditions.push(['all', 
                        ['!', ['in', 'warning--', ['get', 'value']]], 
                        ['!', ['in', 'regulatory--', ['get', 'value']]],
                        ['!', ['in', 'mandatory--', ['get', 'value']]],
                        ['!', ['in', 'information--', ['get', 'value']]]
                    ]);
                }

                map.setFilter('traffic-signs-layer', conditions);
            }

            document.querySelectorAll('#filter-panel input').forEach(el => el.addEventListener('change', applyFilter));
        });
    </script>
</body>
</html>
