<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ thống Biển báo - Đối chiếu ảnh lỗi</title>
    
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #filter-panel { position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); z-index: 10; font-size: 14px; backdrop-filter: blur(5px); max-width: 250px; }
        .filter-group { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; }
        .filter-group input { margin-right: 10px; width: 16px; height: 16px; accent-color: #0d6efd; }
        
        .maplibregl-popup-content { padding: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 13px; max-width: 340px; }
        .popup-header { background: #0d6efd; color: #fff; padding: 10px 15px; font-weight: bold; }
        .popup-body { padding: 12px 15px; background: #fff; }
        .popup-row { margin-bottom: 6px; font-size: 12px; border-bottom: 1px dashed #e5e7eb; padding-bottom: 4px;}
        .popup-label { color: #6b7280; font-weight: 600; display: block; margin-bottom: 2px;}
        .popup-value { color: #111827; font-family: monospace; word-break: break-all; background: #f3f4f6; padding: 2px 4px; border-radius: 4px;}
        
        /* CSS cho 2 ảnh đối chiếu */
        .compare-container { display: flex; gap: 8px; margin-top: 10px; }
        .compare-box { flex: 1; text-align: center; background: #f3f4f6; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 120px;}
        .compare-title { font-size: 10px; font-weight: bold; color: #4b5563; margin-bottom: 4px; }
        .compare-box img { width: 100%; border-radius: 6px; background: #fff; object-fit: contain; max-height: 100px;}
    </style>
</head>
<body>

    <div id="filter-panel">
        <h3>🚦 Bộ lọc biển báo</h3>
        <div class="filter-group"><input type="checkbox" id="filter-warning" checked><label for="filter-warning">⚠️ Cảnh báo</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-regulatory" checked><label for="filter-regulatory">🛑 Cấm / Hiệu lệnh</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-mandatory" checked><label for="filter-mandatory">🔵 Bắt buộc</label></div>
        <div class="filter-group"><input type="checkbox" id="filter-information" checked><label for="filter-information">ℹ️ Chỉ dẫn</label></div>
    </div>

    <div id="map"></div>

    <script>
        const MAPTILER_KEY = 'aEzMCP0ANRz52vd1RvrW';
        const MAPILLARY_TOKEN = 'MLY|30124595887140717|6f7fa14af38d34316e4f6ba9388e1be4';
        const MAPPING_JSON_URL = 'https://cdn.jsdelivr.net/gh/worldoftankblizt1234-wq/drivekit@main/map/mapillary_mapping_270.json';

        let MAPPING_DATA = {};

        const map = new maplibregl.Map({
            container: 'map',
            style: `https://api.maptiler.com/maps/streets-v4/style.json?key=${MAPTILER_KEY}`,
            center: [105.8542, 21.0285], 
            zoom: 16,
            minZoom: 3
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        async function fetchMappingData() {
            try {
                const response = await fetch(MAPPING_JSON_URL);
                MAPPING_DATA = await response.json();
                console.log('✅ Đã tải xong JSON:', Object.keys(MAPPING_DATA).length, 'biển báo');
            } catch (error) {
                console.error('❌ Lỗi tải JSON:', error);
            }
        }

        async function loadImagesFromCDN() {
            const uniqueFiles = {};
            Object.values(MAPPING_DATA).forEach(item => {
                uniqueFiles[item.file] = item.url;
            });

            const fileEntries = Object.entries(uniqueFiles);
            let loadedCount = 0;

            return new Promise((resolve) => {
                if (fileEntries.length === 0) resolve();
                fileEntries.forEach(([fileName, url]) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous'; 
                    img.onload = () => {
                        if (!map.hasImage(fileName)) map.addImage(fileName, img, { pixelRatio: 4 }); 
                        loadedCount++;
                        if (loadedCount === fileEntries.length) resolve();
                    };
                    img.onerror = () => {
                        loadedCount++;
                        if (loadedCount === fileEntries.length) resolve();
                    };
                    img.src = url;
                });
            });
        }

        function buildIconExpression() {
            let expression = ['case'];
            const sortedKeys = Object.keys(MAPPING_DATA).sort((a, b) => b.length - a.length);
            for (const mapillaryCode of sortedKeys) {
                expression.push(['in', mapillaryCode, ['get', 'value']], MAPPING_DATA[mapillaryCode].file);
            }
            expression.push(''); 
            return expression;
        }

        map.on('load', async () => {
            await fetchMappingData();
            await loadImagesFromCDN();

            map.addSource('mapillary-signs', {
                type: 'vector',
                tiles: [`https://tiles.mapillary.com/maps/vtp/mly_map_feature_traffic_sign/2/{z}/{x}/{y}?access_token=${MAPILLARY_TOKEN}`],
                minzoom: 14, maxzoom: 14
            });

            map.addLayer({
                id: 'traffic-signs-layer',
                type: 'symbol',
                source: 'mapillary-signs',
                'source-layer': 'traffic_sign',
                minzoom: 14,
                layout: {
                    'icon-image': buildIconExpression(),
                    'icon-size': ['interpolate', ['linear'], ['zoom'], 14, 0.15, 18, 0.3],
                    'icon-allow-overlap': false,
                    'icon-ignore-placement': false,
                    'icon-padding': 2
                }
            });

            // POPUP ĐỐI CHIẾU 2 ẢNH
            map.on('click', 'traffic-signs-layer', async (e) => {
                const feature = e.features[0];
                const props = feature.properties;
                const rawValue = props.value || '';
                
                let displayData = null;
                for (const [key, data] of Object.entries(MAPPING_DATA)) {
                    if (rawValue.includes(key)) {
                        displayData = data;
                        break;
                    }
                }

                let htmlContent = '';
                if (displayData) {
                    htmlContent = `
                        <div class="popup-row">
                            <span class="popup-label">Mã QCVN trong JSON:</span>
                            <span style="font-weight:bold; color:#0d6efd">${displayData.ma} - ${displayData.ten}</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-label">File ảnh đang gọi:</span>
                            <span class="popup-value">${displayData.file}</span>
                        </div>
                        <div class="compare-container">
                            <div class="compare-box">
                                <div class="compare-title">Ảnh Github của bạn</div>
                                <img src="${displayData.url}" />
                            </div>
                            <div class="compare-box" id="mly-img-container">
                                <div class="compare-title">Ảnh Mapillary</div>
                                <span style="font-size:10px; color:#9ca3af; margin-top:20px;">Đang tải...</span>
                            </div>
                        </div>
                    `;
                } else {
                    htmlContent = `<div style="color:red; font-weight:bold; padding:10px 0;">⚠️ Mã này chưa có trong JSON!</div>`;
                }

                const popupHTML = `
                    <div class="popup-header">Đối chiếu dữ liệu</div>
                    <div class="popup-body">
                        <div class="popup-row" style="margin-bottom:10px;">
                            <span class="popup-label">Mã gốc Mapillary:</span>
                            <span class="popup-value" style="color:#dc2626; font-size:13px; font-weight:bold;">${rawValue}</span>
                        </div>
                        ${htmlContent}
                    </div>
                `;

                new maplibregl.Popup({ offset: 15, maxWidth: '340px' }).setLngLat(e.lngLat).setHTML(popupHTML).addTo(map);

                // Tải ảnh Mapillary thực tế
                if (displayData) {
                    try {
                        const featureId = props.id;
                        const res1 = await fetch(`https://graph.mapillary.com/${featureId}?access_token=${MAPILLARY_TOKEN}&fields=images`);
                        const data1 = await res1.json();
                        const imageId = data1.images?.[0];

                        if (imageId) {
                            const res2 = await fetch(`https://graph.mapillary.com/${imageId}?access_token=${MAPILLARY_TOKEN}&fields=thumb_512_url`);
                            const data2 = await res2.json();
                            const box = document.getElementById('mly-img-container');
                            if (data2.thumb_512_url && box) {
                                box.innerHTML = `<div class="compare-title">Ảnh Mapillary</div><img src="${data2.thumb_512_url}" />`;
                            } else if (box) {
                                box.innerHTML = `<div class="compare-title">Ảnh Mapillary</div><span style="font-size:10px;color:red;margin-top:20px;">Không có ảnh</span>`;
                            }
                        }
                    } catch (err) {
                        const box = document.getElementById('mly-img-container');
                        if (box) box.innerHTML = `<div class="compare-title">Ảnh Mapillary</div><span style="font-size:10px;color:red;margin-top:20px;">Lỗi tải</span>`;
                    }
                }
            });

            function applyFilter() {
                const isWarning = document.getElementById('filter-warning').checked;
                const isRegulatory = document.getElementById('filter-regulatory').checked;
                const isMandatory = document.getElementById('filter-mandatory').checked;
                const isInfo = document.getElementById('filter-information').checked;

                let conditions = ['any'];
                if (isWarning) conditions.push(['in', 'warning--', ['get', 'value']]);
                if (isRegulatory) conditions.push(['in', 'regulatory--', ['get', 'value']]);
                if (isMandatory) conditions.push(['in', 'mandatory--', ['get', 'value']]);
                if (isInfo) conditions.push(['in', 'information--', ['get', 'value']]);

                map.setFilter('traffic-signs-layer', conditions);
            }
            document.querySelectorAll('#filter-panel input').forEach(el => el.addEventListener('change', applyFilter));
        });
    </script>
</body>
</html>
